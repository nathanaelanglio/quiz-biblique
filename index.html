 cy='32' r='16'/>\u003ccircle cx='66' cy='42' r='14'/>\u003ccircle cx='50' cy='50' r='14'/>\u003c/g>\u003c/g>\u003c/g>\u003c/svg>"},"textes":{"accueil":"Bonjour à tous ! Je m'appelle Joël, et c'est moi qui anime le quiz biblique. Choisissez votre niveau, formez vos équipes, et c'est parti !","debut":"C'est parti ! Écoutez bien chaque question, et prenez le temps de réfléchir ensemble.","debut-tous":"C'est parti ! Aujourd'hui, nous jouons tous ensemble, dans la même équipe. Écoutez bien, et aidez-vous les uns les autres.","derniere":"Attention, voici la dernière question !","bravo-1":"Bravo ! C'est la bonne réponse !","bravo-2":"Excellent ! Vous avez trouvé !","bravo-3":"Super, bien joué ! C'est exactement ça !","encourage-1":"Ce n'est pas grave ! Regardons ensemble la bonne réponse.","encourage-2":"Presque ! Voici la bonne réponse.","encourage-3":"Pas cette fois, mais vous allez apprendre quelque chose de beau !","temps":"Le temps est écoulé ! Voyons ensemble la réponse.","joker-5050":"Je retire des mauvaises réponses. Réfléchissez bien !","joker-adulte":"Vous pouvez demander de l'aide à un adulte !","ouverte":"Répondez à voix haute ! Ensuite, l'adulte révèle la réponse.","revele":"Voici la réponse attendue.","podium":"Quelle belle partie ! Bravo à toutes les équipes, vous avez tous bien joué. Merci d'avoir participé, et à bientôt pour un nouveau quiz !","tour-lionceaux":"Au tour des Lionceaux ! Vous êtes prêts ? Écoutez bien la question.","tour-colombes":"Au tour des Colombes ! Vous êtes prêts ? Écoutez bien la question.","tour-oliviers":"Au tour des Oliviers ! Vous êtes prêts ? Écoutez bien la question.","tour-etoiles":"Au tour des Étoiles ! Vous êtes prêts ? Écoutez bien la question.","tour-cedres":"Au tour des Cèdres ! Vous êtes prêts ? Écoutez bien la question.","tour-perles":"Au tour des Perles ! Vous êtes prêts ? Écoutez bien la question.","tour-tous":"À vous tous ! Vous êtes prêts ? Écoutez bien la question.","q-p01":"Qui a construit une grande arche pour sauver sa famille et les animaux ? David ? Noé ? Ou Pierre ?","e-p01":"C'est Noé ! Jéhovah lui a dit : Fais-toi une arche en bois. Noé a obéi, et sa famille a été sauvée. Genèse chapitre 6, verset 14.","q-p02":"Combien de personnes sont entrées dans l'arche ? Huit ? Deux ? Ou Vingt ?","e-p02":"Huit personnes : Noé, sa femme, leurs trois fils et les trois femmes de leurs fils. Genèse chapitre 7, verset 13.","q-p03":"Après le déluge, quel beau signe Jéhovah a-t-il mis dans le nuage ? Une étoile ? La lune ? Ou Un arc-en-ciel ?","e-p03":"Un arc-en-ciel ! C'est le signe de la promesse que Jéhovah a faite à la terre. Genèse chapitre 9, verset 13.","q-p04":"Dans la Bible, qui était le grand frère jaloux d'Abel ? Caïn ? Ou Moïse ?","e-p04":"Caïn. Il a laissé la jalousie grandir dans son cœur. La Bible nous demande de ne pas être comme Caïn, mais de nous aimer les uns les autres. Première lettre de Jean, chapitre 3, versets 11 et 12.","q-p05":"Dans la ville de Jéricho, une femme a caché deux espions envoyés par Josué. Comment s'appelait-elle ? Ruth ? Rahab ? Ou Marie ?","e-p05":"C'est Rahab. Elle avait confiance en Jéhovah, et elle a été sauvée avec toute sa famille. Josué chapitre 6, verset 25.","q-p06":"Qu'est-ce que Rahab a attaché à sa fenêtre pour que sa famille soit protégée ? Un drapeau blanc ? Une lampe ? Ou Un cordon rouge ?","e-p06":"Un cordon de fil écarlate, c'est-à-dire rouge vif. C'était le signe convenu avec les espions. Josué chapitre 2, verset 18.","q-p07":"Selon la Bible, quel homme a reçu de Jéhovah une force extraordinaire ? Samson ? Jonas ? Ou Zachée ?","e-p07":"C'est Samson ! Une nuit, il a arraché les grandes portes d'une ville et il les a portées sur ses épaules jusqu'en haut d'une montagne. Juges chapitre 16, verset 3.","q-p08":"Samson avait fait une promesse à Jéhovah. Qu'est-ce qu'il ne devait jamais couper ? Ses sourcils ? Ou Ses cheveux ?","e-p08":"Ses cheveux. Samson a dit : Le rasoir n'est jamais passé sur ma tête. C'était sa promesse à Jéhovah. Juges chapitre 16, verset 17.","q-p09":"Qu'est-ce que Jacob a fait faire pour son fils Joseph ? Une petite maison ? Un beau et long vêtement ? Ou Un bateau ?","e-p09":"Un beau et long vêtement. Jacob aimait beaucoup Joseph. Genèse chapitre 37, verset 3.","q-p10":"Zacharie et Élisabeth étaient très vieux, et Jéhovah leur a donné un bébé. Comment s'appelait-il ? Samuel ? Jonas ? Ou Jean ?","e-p10":"Jean ! L'ange a dit à Zacharie : Ta femme, Élisabeth, te donnera un fils, et tu devras l'appeler Jean. Plus tard, il a préparé le chemin de Jésus. Luc chapitre 1, verset 13.","q-p11":"Que mangeait Jean le Baptiseur dans le désert ? Des gâteaux et du lait ? Des criquets et du miel sauvage ? Ou Du riz et du poisson ?","e-p11":"Des criquets et du miel sauvage ! Il portait aussi un vêtement en poil de chameau. Matthieu chapitre 3, verset 4.","q-p12":"Où Marie a-t-elle couché le bébé Jésus ? Dans une mangeoire ? Dans un berceau en or ? Ou Dans une barque ?","e-p12":"Dans une mangeoire, l'endroit où mangent les animaux, parce qu'il n'y avait pas de place pour eux dans la salle prévue pour les voyageurs. Luc chapitre 2, verset 7.","q-p13":"Qui a élevé Jésus avec Marie, comme un papa ? Abraham ? Joseph ? Ou Pierre ?","e-p13":"C'est Joseph, le charpentier. Jésus est le Fils de Dieu, et Joseph a été son père adoptif : il l'a élevé avec amour. Luc chapitre 3, verset 23.","q-p14":"Combien d'apôtres Jésus a-t-il choisis ? Trois ? Cent ? Ou Douze ?","e-p14":"Douze apôtres. Matthieu chapitre 10, versets 2 à 4.","q-p15":"Jésus a dit à Pierre : Nourris mes petites brebis. De qui parlait-il ? De vrais moutons ? Ou De ceux qui le suivaient ?","e-p15":"De ses disciples, ceux qui suivaient Jésus ! Il demandait à Pierre de prendre soin d'eux et de les nourrir de la Parole de Dieu. Jean chapitre 21, verset 17.","q-p16":"Qu'est-ce qui a avalé Jonas ? Un énorme poisson ? Un lion ? Ou Un aigle ?","e-p16":"Un énorme poisson envoyé par Jéhovah. Jonas est resté trois jours et trois nuits dans son ventre, puis il s'est retrouvé sain et sauf sur la terre ferme. Jonas chapitre 1, verset 17.","q-p17":"Qui a fermé la gueule des lions pour protéger Daniel ? Le roi ? Un ange de Jéhovah ? Ou Un soldat ?","e-p17":"Un ange de Jéhovah ! Daniel a dit au roi : Mon Dieu a envoyé son ange et a fermé la gueule des lions. Daniel chapitre 6, verset 22.","q-p18":"Où la maman de Moïse a-t-elle déposé son bébé pour le protéger ? Dans une grotte ? Sur un chameau ? Ou Dans une corbeille au bord du Nil ?","e-p18":"Dans une corbeille en papyrus, au milieu des roseaux, au bord du Nil. Et sa grande sœur surveillait de loin. Exode chapitre 2, versets 3 et 4.","q-p19":"Ruth a dit à Noémi : Ton Dieu sera mon Dieu. Qu'a fait Ruth ? Elle est restée avec Noémi ? Ou Elle est partie loin d'elle ?","e-p19":"Ruth est restée avec Noémi, sa belle-mère, pour l'aider et pour servir Jéhovah avec elle. Ruth chapitre 1, verset 16.","q-p20":"Zachée était petit. Où est-il monté pour voir Jésus ? Sur un chameau ? Dans un arbre ? Ou Sur un toit ?","e-p20":"Dans un arbre, un sycomore. Et Jésus l'a appelé par son nom ! Luc chapitre 19, versets 4 et 5.","q-p21":"Pendant un mariage, en quoi Jésus a-t-il changé de l'eau ? En lait ? En jus de fruit ? Ou En vin ?","e-p21":"En vin ! C'était son premier miracle, à Cana. Jean chapitre 2, verset 9.","q-p22":"Qui a donné un nom à tous les animaux ? Noé ? Adam ? Ou Moïse ?","e-p22":"C'est Adam, le premier homme. Jéhovah lui amenait les animaux, et chaque animal recevait le nom qu'Adam lui donnait. Genèse chapitre 2, verset 19.","q-m01":"Qui a été le premier meurtrier de l'histoire humaine ? A : Abel. B : Lamek. C : Caïn. D : Noé.","e-m01":"C'est Caïn. Il a laissé la jalousie le dominer et il a tué son frère Abel. La Bible le donne en exemple à ne pas suivre. Genèse chapitre 4, verset 8, et Première lettre de Jean, chapitre 3, verset 12.","q-m02":"Comment s'appelait la femme cananéenne de Jéricho qui a été épargnée avec sa famille ? A : Dalila. B : Rahab. C : Ruth. D : Noémi.","e-m02":"Rahab. Elle avait caché les espions de Josué, et Jéhovah l'a protégée. Elle est même devenue une ancêtre de Jésus. Josué chapitre 6, verset 25, et Matthieu chapitre 1, verset 5.","q-m03":"Qui était Ruth pour Noémi ? A : Sa sœur. B : Sa voisine. C : Sa belle-fille. D : Sa cousine.","e-m03":"Sa belle-fille. Ruth, qui venait du pays de Moab, avait épousé un fils de Noémi. Devenue veuve, elle est restée fidèle à Noémi et à Jéhovah. Ruth chapitre 1, versets 4 et 16.","q-m04":"Ruth s'est mariée avec Boaz. Quel roi célèbre est leur arrière-petit-fils ? A : David. B : Saül. C : Salomon. D : Sédécias.","e-m04":"Le roi David. Ruth et Boaz ont eu un fils, Obed. Obed est le père de Jessé, et Jessé est le père de David. Ruth chapitre 4, versets 13 et 17.","q-m05":"On dit souvent de lui qu'il est l'homme le plus fort qui ait jamais vécu. Qui est-ce ? A : Goliath. B : David. C : Saül. D : Samson.","e-m05":"Samson. Sa force ne venait pas de ses muscles, mais de Jéhovah : à la fin de sa vie, il a encore supplié Jéhovah de le fortifier. Juges chapitre 16, verset 28.","q-m06":"Quand on parle des ancêtres du peuple d'Israël, quels trois noms dit-on toujours ensemble ? A : Adam, Noé et Moïse. B : Moïse, Aaron et Josué. C : David, Salomon et Sédécias. D : Abraham, Isaac et Jacob.","e-m06":"Abraham, Isaac et Jacob. Jéhovah s'est présenté à Moïse ainsi : Je suis le Dieu d'Abraham, le Dieu d'Isaac et le Dieu de Jacob. Exode chapitre 3, verset 6.","q-m07":"Pourquoi les noms des douze fils de Jacob sont-ils restés dans l'histoire du peuple ? A : Parce qu'ils étaient tous prophètes. B : Parce que leurs familles sont devenues les douze tribus d'Israël. C : Parce qu'ils ont construit le temple. D : Parce qu'ils ont tous été rois.","e-m07":"Leurs descendants sont devenus les douze tribus d'Israël. Genèse chapitre 49, verset 28. Et dans la Révélation, les noms des douze tribus sont inscrits sur les portes de la ville sainte. Révélation chapitre 21, verset 12.","q-m08":"Comment s'appelait le père adoptif de Jésus ? A : Zacharie. B : Lazare. C : Jacques. D : Joseph.","e-m08":"Joseph. Jésus a été conçu par l'esprit saint, mais Joseph l'a élevé avec Marie. C'est pourquoi les gens disaient que Jésus était fils de Joseph. Luc chapitre 3, verset 23.","q-m09":"Sa mère était trop âgée pour avoir des enfants, et il est venu au monde pour préparer la venue du Messie. Qui est-ce ? A : Isaac. B : Jean le Baptiseur. C : Samuel. D : L'apôtre Jean.","e-m09":"Jean le Baptiseur. Ses parents, Zacharie et Élisabeth, étaient très âgés. Isaac aussi est né d'une mère âgée, Sara, mais c'est Jean qui a préparé la venue du Messie. Luc chapitre 1, versets 7 et 17.","q-m10":"Après la trahison de Judas, il restait onze apôtres. Qui a été choisi pour devenir le douzième ? A : Paul. B : Barnabé. C : Matthias. D : Étienne.","e-m10":"Matthias. Les disciples ont tiré au sort, et Matthias a été ajouté aux onze apôtres. Actes chapitre 1, verset 26.","q-m11":"Après sa résurrection, pendant combien de jours Jésus s'est-il montré à ses disciples ? A : Quarante jours. B : Trois jours. C : Sept jours. D : Cinquante jours.","e-m11":"Pendant quarante jours. Il leur a donné des preuves convaincantes qu'il était vivant, et il leur parlait du royaume de Dieu. Actes chapitre 1, verset 3.","q-m12":"À quel apôtre Jésus ressuscité a-t-il dit : Nourris mes petites brebis? A : Jean. B : Thomas. C : André. D : Pierre.","e-m12":"À Pierre. Avec d'autres frères dignes de confiance, Pierre allait nourrir, fortifier et conduire les disciples de Jésus. Jean chapitre 21, versets 15 à 17.","q-m13":"Quel apôtre a vécu très vieux et a probablement été le dernier apôtre à mourir ? A : Pierre. B : Jean. C : Jacques. D : Matthieu.","e-m13":"Jean. Après la résurrection de Jésus, il a encore servi Dieu fidèlement pendant près de soixante-dix ans, et c'est sur l'île de Patmos qu'il a reçu la Révélation.","q-m14":"Comment Jéhovah a-t-il ouvert un chemin dans la mer pour les Israélites ? A : Avec un grand pont. B : Avec des bateaux. C : Par un fort vent d'est qui a fait reculer la mer. D : En gelant l'eau.","e-m14":"Jéhovah a fait reculer la mer par un fort vent d'est toute la nuit, et les Israélites ont traversé sur un sol ferme. Exode chapitre 14, versets 21 et 22.","q-m15":"D'après les âges donnés dans la Bible, qui a vécu le plus longtemps ? A : Mathusalem. B : Adam. C : Noé. D : Abraham.","e-m15":"Mathusalem, qui a vécu neuf cent soixante-neuf ans ! Genèse chapitre 5, verset 27.","q-m16":"Près de la rivière, qui apportait à manger au prophète Élie ? A : Des colombes. B : Des corbeaux. C : Des soldats. D : Des bergers.","e-m16":"Des corbeaux ! Tous les matins et tous les soirs, ils lui apportaient du pain et de la viande. Premier livre des Rois, chapitre 17, verset 6.","q-m17":"Jésus avait douze ans. Où ses parents l'ont-ils retrouvé au bout de trois jours ? A : Au marché. B : Chez des amis. C : Au bord du lac. D : Dans le Temple, au milieu des enseignants.","e-m17":"Dans le Temple, assis au milieu des enseignants : il les écoutait et leur posait des questions. Luc chapitre 2, verset 46.","q-m18":"Avec combien de pains et de poissons Jésus a-t-il nourri une immense foule ? A : Trois pains et un poisson. B : Douze pains et douze poissons. C : Cinq pains et deux poissons. D : Sept pains et trois poissons.","e-m18":"Cinq pains et deux poissons. Environ cinq mille hommes ont mangé, sans compter les femmes et les enfants, et il est resté douze paniers ! Matthieu chapitre 14, versets 17 à 21.","q-m19":"Depuis combien de jours Lazare était-il dans la tombe quand Jésus l'a ressuscité ? A : Un jour. B : Deux jours. C : Quatre jours. D : Dix jours.","e-m19":"Quatre jours. Jésus a crié d'une voix forte : Lazare, viens dehors ! Et Lazare est sorti vivant. Jean chapitre 11, versets 17, 43 et 44.","q-m20":"Dans quel livre de la Bible Jéhovah dit-il : Vous êtes mes témoins? A : Isaïe. B : Genèse. C : Psaumes. D : Jonas.","e-m20":"Dans Isaïe, chapitre 43, verset 10. C'est sur ce verset qu'est basé notre nom : Témoins de Jéhovah.","q-m21":"Combien d'hommes le roi Nabuchodonosor a-t-il vus marcher dans le four de feu ? A : Un. B : Trois. C : Quatre. D : Sept.","e-m21":"Quatre ! On y avait jeté Shadrak, Méshak et Abed-Négo, mais le roi a vu un quatrième homme avec eux, et le feu ne leur avait fait aucun mal. Daniel chapitre 3, verset 25.","q-m22":"Où sont passées les eaux du déluge ? A : Elles se sont envolées dans l'espace. B : Elles sont toujours sur la terre, surtout dans les océans. C : Elles sont descendues au centre de la terre. D : Personne ne peut le savoir.","e-m22":"Elles sont toujours sur la terre, surtout dans les océans. Après le déluge, de nouvelles montagnes se sont sans doute élevées et le fond des mers s'est creusé, et l'eau s'y est rassemblée. Genèse chapitre 8, verset 3.","q-g01":"En quelle année Jésus est-il né ? A : En l'an 1 de notre ère. B : En l'an 4 avant notre ère. C : En l'an 2 avant notre ère. D : En l'an 29 de notre ère.","e-g01":"En l'an 2 avant notre ère, vraisemblablement au mois d'Éthanim, c'est-à-dire en septembre ou en octobre. Il est né environ six mois après Jean le Baptiseur. Luc chapitre 3, versets 1 et 23.","q-g02":"En quelle année Jésus a-t-il été baptisé ? A : En l'an 29 de notre ère. B : En l'an 27 de notre ère. C : En l'an 30 de notre ère. D : En l'an 33 de notre ère.","e-g02":"En l'an 29 de notre ère, à l'automne. Jean le Baptiseur avait commencé à prêcher la quinzième année du règne de Tibère César. Luc chapitre 3, versets 1 à 3.","q-g03":"Quel âge avait Jésus quand il a commencé son ministère ? A : Environ trente ans. B : Environ vingt ans. C : Environ trente-trois ans. D : Environ quarante ans.","e-g03":"Environ trente ans. Luc chapitre 3, verset 23 : Quand Jésus commença son ministère, il avait environ 30 ans.","q-g04":"Quel jour Jésus est-il mort ? A : Le 14 nisan de l'an 30. B : Le 10 nisan de l'an 33. C : Le 15 nisan de l'an 36. D : Le 14 nisan de l'an 33.","e-g04":"Le 14 nisan de l'an 33 de notre ère, un vendredi de printemps, vers trois heures de l'après-midi. Luc chapitre 23, versets 44 à 46.","q-g05":"Quel âge avait Jésus à sa mort ? A : Trente ans. B : Environ trente-trois ans et demi. C : Quarante ans. D : Environ trente et un ans.","e-g05":"Environ trente-trois ans et demi : il a commencé son ministère vers trente ans, et ce ministère a duré trois ans et demi. Luc chapitre 3, verset 23.","q-g06":"D'après Révélation chapitre 21, verset 14, quels noms sont inscrits sur les douze pierres de fondation de la muraille de la ville sainte ? A : Les noms des douze tribus d'Israël. B : Les noms des douze anges. C : Les noms des douze prophètes. D : Les noms des douze apôtres de l'Agneau.","e-g06":"Les noms des douze apôtres de l'Agneau. Les noms des douze tribus, eux, sont inscrits sur les portes de la ville, au verset 12.","q-g07":"Comment appelle-t-on, dans la Bible, ceux qui régneront avec Jésus dans le ciel ? A : La grande foule. B : Les autres brebis. C : Les 144 000. D : Les Lévites.","e-g07":"Les 144 000. Jean les a vus avec l'Agneau sur le mont Sion, et Jésus les appelle aussi son petit troupeau. Révélation chapitre 14, verset 1, et Luc chapitre 12, verset 32.","q-g08":"Combien de temps durera le règne de Jésus avant qu'il remette le Royaume à son Père ? A : Mille ans. B : Cent ans. C : Sept ans. D : Il ne le remettra jamais.","e-g08":"Mille ans. Ceux qui ont part à la première résurrection régneront avec lui pendant les mille ans. Ensuite, il remettra le Royaume à son Dieu et Père. Révélation chapitre 20, verset 6, et Première lettre aux Corinthiens, chapitre 15, verset 24.","q-g09":"En quelle année Jésus a-t-il été intronisé comme Roi dans le ciel ? A : 1919. B : 1931. C : 1914. D : 1975.","e-g09":"En octobre 1914. C'est la fin des sept temps annoncés dans le rêve de l'arbre, en Daniel chapitre 4, versets 16 et 17.","q-g10":"Quelle prophétie de Daniel donne l'année exacte de l'intronisation du Christ dans le ciel ? Explique le calcul.","e-g10":"Le rêve du grand arbre abattu, en Daniel chapitre 4. Les sept temps durent deux mille cinq cent vingt ans : ils commencent en octobre 607 avant notre ère, quand Jérusalem est détruite, et se terminent en octobre 1914, quand Jésus commence à régner. Les sept temps, c'est le temps accordé aux nations dont parle Jésus en Luc chapitre 21, verset 24. Ils vont d'octobre 607 avant notre ère à octobre 1914 de notre ère. Daniel chapitre 4, versets 16 et 17.","q-g11":"Quelle prophétie de Daniel donne l'année exacte de l'arrivée du Messie ? Quelle est cette année ?","e-g11":"La prophétie des soixante-dix semaines, en Daniel chapitre 9. Elle part de 455 avant notre ère, quand est donné l'ordre de rebâtir Jérusalem. Soixante-neuf semaines d'années, soit quatre cent quatre-vingt-trois ans, mènent à l'an 29 de notre ère : Jésus est baptisé et devient le Messie. Le Messie, le Guide, arrive en l'an 29. Au milieu de la dernière semaine, en l'an 33, il est mis à mort. Daniel chapitre 9, versets 24 à 27.","q-g12":"Quand s'est accomplie la prophétie de Malachie chapitre 3, versets 1 à 3 ?","e-g12":"De 1914 au début de 1919. Jésus, intronisé, est venu avec son Père inspecter le temple spirituel. Les chrétiens oints, les fils de Lévi, ont traversé une période d'épreuves et en sont sortis affinés et purifiés. Jéhovah, le Grand Affineur, a purifié ses serviteurs comme on affine l'or et l'argent. Et cet affinage continue tout au long des derniers jours. Malachie chapitre 3, versets 1 à 3.","q-g13":"Quel événement annoncé en Première lettre aux Thessaloniciens, chapitre 5, verset 3, attendons-nous encore ? Et sait-on exactement quand il viendra ?","e-g13":"La proclamation Paix et sécurité ! par les nations, suivie d'une destruction subite. On ne sait pas exactement quand elle sera faite : elle pourrait venir avant ou après la destruction des fausses religions, qui marque le début de la grande tribulation. L'important est de rester éveillés. La Tour de Garde de février 2026 explique que les deux possibilités restent ouvertes. Ce qui compte le plus, ce n'est pas le moment exact, mais notre fidélité à Dieu. Première lettre aux Thessaloniciens, chapitre 5, versets 3 à 6.","q-g14":"Genèse chapitre 2 dit que Dieu se reposa le septième jour, mais Jésus dit en Jean chapitre 5, verset 17 : Mon Père a continué de travailler jusqu'à maintenant. Comment concilier ces deux versets ?","e-g14":"Le contexte de la Genèse montre que Dieu s'est reposé de son œuvre de création matérielle concernant la terre. Jésus, lui, parle des autres œuvres de Dieu : il a inspiré la Bible, il guide et soutient les humains. Dieu a cessé de créer sur la terre, mais il n'a jamais cessé de travailler. Il n'y a pas de contradiction : les deux versets ne parlent pas du même travail. Genèse chapitre 2, versets 2 et 3, et Jean chapitre 5, verset 17.","q-g15":"D'après Matthieu chapitre 10, verset 23, réussirons-nous à faire connaître la bonne nouvelle du Royaume à chaque personne sur terre avant que vienne la fin ?","e-g15":"Non. Jésus a dit à ses disciples qu'ils n'auraient pas terminé le tour des villes avant qu'il arrive. Nous prêchons dans le monde entier, mais des millions de personnes vivent là où notre activité est sévèrement limitée, et des centaines de bébés naissent chaque minute. La bonne nouvelle est prêchée sur toute la terre, en témoignage pour toutes les nations, et le site jw.org la rend accessible à la majorité des humains. Mais nous n'aurons pas prêché à chaque personne avant que Jésus vienne juger. Matthieu chapitre 10, verset 23, et chapitre 24, verset 14.","q-g16":"Selon la chronologie biblique, il y a combien d'années environ qu'Adam a été créé ? A : Environ quatre mille ans. B : Un peu plus de six mille ans. C : Environ dix mille ans. D : Des millions d'années.","e-g16":"Un peu plus de six mille ans. Adam a été créé en 4026 avant notre ère, soit il y a environ six mille cinquante ans. Les âges donnés en Genèse chapitre 5 permettent ce calcul.","q-g17":"Depuis quelle année le peuple de Dieu s'appelle-t-il Témoins de Jéhovah ? A : 1914. B : 1919. C : 1942. D : 1931.","e-g17":"Depuis 1931. Le 26 juillet, lors d'une assemblée aux États-Unis, les Étudiants de la Bible ont adopté avec joie ce nom, basé sur Isaïe chapitre 43, verset 10.","q-g18":"Qui fut le dernier roi de la lignée de David à régner à Jérusalem ? A : Joachim. B : Salomon. C : Sédécias. D : Saül.","e-g18":"Sédécias. Après lui, Jéhovah a annoncé que la couronne n'appartiendrait à personne jusqu'à ce que vienne celui qui a le droit légal. Ce roi, c'est Jésus. Ézéchiel chapitre 21, verset 27.","q-g19":"Le roi David a commis un péché très grave, et selon la Loi de Moïse il aurait mérité la mort. Ce péché concernait la femme d'un de ses soldats. Comment s'appelait-elle ? A : Dalila. B : Bethsabée. C : Esther. D : Noémi.","e-g19":"Bethsabée, la femme d'Urie. David s'est sincèrement repenti, et Jéhovah lui a pardonné : il n'a pas été mis à mort, même s'il a subi les conséquences de son péché. Deuxième livre de Samuel, chapitre 12, verset 13.","q-g20":"Comment Samson est-il mort ? A : De vieillesse, dans sa maison. B : Dans un combat contre un lion. C : Noyé dans la mer. D : En faisant tomber le temple de Dagon.","e-g20":"En faisant tomber le temple de Dagon. Prisonnier des Philistins, il a supplié Jéhovah de lui rendre sa force une dernière fois. Il a poussé les deux colonnes, le temple s'est écroulé, et Samson est mort avec les ennemis du peuple de Dieu. Juges chapitre 16, versets 28 à 30.","q-g21":"Combien de temps Noé et sa famille sont-ils restés dans l'arche ? A : Quarante jours. B : Cent cinquante jours. C : Un peu plus d'un an. D : Sept ans.","e-g21":"Un peu plus d'un an : trois cent soixante-dix jours. La pluie est tombée quarante jours, mais il a fallu bien plus longtemps pour que les eaux baissent et que la terre sèche. Genèse chapitre 7, verset 11, et chapitre 8, versets 13 et 14.","q-g22":"Après sa résurrection, Jésus a demandé trois fois à Pierre s'il l'aimait. Qu'a-t-il voulu lui faire comprendre ? A : Qu'il doutait encore de lui et voulait le mettre à l'épreuve. B : Qu'il lui avait pardonné et qu'il devait nourrir ses brebis. C : Qu'il pouvait retourner tranquillement à son ancien métier de pêcheur. D : Qu'il le nommait chef, au-dessus de tous les autres apôtres.","e-g22":"Qu'il lui avait pardonné, et que son amour devait le pousser à prendre soin de ses brebis. La nuit de l'arrestation de Jésus, Pierre l'avait renié trois fois. Après sa résurrection, au bord de la mer de Galilée, Jésus lui a permis trois fois de dire qu'il l'aimait, puis il lui a confié le soin de ses disciples. Jean chapitre 21, versets 15 à 17.","q-p23":"Avec quoi Jéhovah a-t-il fait le premier homme, Adam ? De la poussière ? Du bois ? Ou Des pierres ?","e-p23":"Avec de la poussière ! Puis Jéhovah a soufflé dans ses narines, et Adam est devenu vivant. Genèse chapitre 2, verset 7.","q-p24":"Quel animal Satan a-t-il fait parler pour tromper Ève ? Un lion ? Un serpent ? Ou Un singe ?","e-p24":"Un serpent. Les serpents ne parlent pas : c'est Satan, un ange méchant, qui l'a fait parler pour mentir à Ève. Genèse chapitre 3, versets 1 à 5.","q-p25":"À Babel, des gens construisaient une très grande tour. Comment Jéhovah les a-t-il arrêtés ? Avec une grosse pluie ? Avec des langues différentes ? Ou Avec un grand vent ?","e-p25":"Jéhovah les a fait parler des langues différentes. Ils ne se comprenaient plus, alors ils ont arrêté de construire. Genèse chapitre 11, versets 7 à 9.","q-p26":"La femme de Loth a regardé en arrière. Qu'est-elle devenue ? Un arbre ? Un oiseau ? Ou Une statue de sel ?","e-p26":"Une statue de sel. Les anges avaient dit de ne pas regarder derrière, mais elle a désobéi. Genèse chapitre 19, verset 26.","q-p27":"Quel animal Jéhovah a-t-il fait parler pour arrêter Balaam ? Son chien ? Son ânesse ? Ou Son chameau ?","e-p27":"Son ânesse ! Elle voyait l'ange de Jéhovah sur la route, mais Balaam, lui, ne le voyait pas. Nombres chapitre 22, versets 28 à 31.","q-p28":"Qu'ont rapporté les espions du pays de Canaan ? De l'or ? Des fruits ? Ou Des moutons ?","e-p28":"Des fruits ! Des raisins, des grenades et des figues. Le pays que Jéhovah donnait à son peuple était un très bon pays. Nombres chapitre 13, verset 23.","q-p29":"Gédéon a demandé un signe à Jéhovah. Qu'a-t-il posé par terre ? Une peau de mouton ? Une grande épée ? Ou Un panier de fruits ?","e-p29":"Une peau de mouton. Le matin, elle était mouillée de rosée, et le sol était sec. Gédéon a su que Jéhovah l'avait choisi. Juges chapitre 6, versets 37 et 38.","q-p30":"Avec quoi David a-t-il vaincu le géant Goliath ? Une épée ? Un arc ? Ou Une fronde ?","e-p30":"Avec une fronde et une pierre. Goliath avait une épée et une lance, mais David est venu au nom de Jéhovah. Premier livre de Samuel, chapitre 17, versets 45 et 49.","q-p31":"Au mont Carmel, Élie a prié. Qu'est-ce que Jéhovah a envoyé du ciel ? De la neige ? Du feu ? Ou Du vent ?","e-p31":"Du feu ! Il a brûlé l'offrande d'Élie. Baal, lui, n'avait rien répondu. Alors tout le peuple a crié : Jéhovah est le vrai Dieu ! Premier livre des Rois, chapitre 18, versets 38 et 39.","q-p32":"Esther a été très courageuse pour sauver son peuple. Qui était-elle ? Une bergère ? Une reine ? Ou Une boulangère ?","e-p32":"Une reine. Le roi l'avait choisie. Elle est allée le voir sans être invitée, en risquant sa vie, pour sauver les Juifs. Esther chapitre 2, verset 17, et chapitre 4, verset 16.","q-p33":"Une nuit, des anges ont annoncé la naissance de Jésus. À qui ? À des pêcheurs ? À des soldats ? Ou À des bergers ?","e-p33":"À des bergers qui gardaient leurs troupeaux près de Bethléem. Ils sont tout de suite allés voir le bébé. Luc chapitre 2, versets 8 à 11.","q-p34":"Pour protéger Jésus du méchant roi Hérode, où sa famille est-elle partie ? En Égypte ? À Ninive ? Ou À Rome ?","e-p34":"En Égypte. Jéhovah a averti son papa dans un rêve. Toute la famille est partie tout de suite, et Jésus était en sécurité. Matthieu chapitre 2, versets 13 et 14.","q-p35":"Quel apôtre est sorti du bateau pour marcher sur l'eau vers Jésus ? Pierre ? Jean ? Ou Thomas ?","e-p35":"Pierre. Mais il a regardé la tempête, il a eu peur et il a commencé à couler. Jésus lui a attrapé la main. Matthieu chapitre 14, versets 29 à 31.","q-p36":"Quand Jésus est monté au ciel, qu'est-ce qui l'a caché ? Un nuage ? Un arbre ? Ou Une montagne ?","e-p36":"Un nuage. Les apôtres le regardaient monter, puis un nuage l'a caché à leurs yeux. C'était au mont des Oliviers. Actes chapitre 1, verset 9.","q-p37":"Paul et Silas chantaient en prison. Que s'est-il passé au milieu de la nuit ? Un incendie ? Un tremblement de terre ? Ou Une inondation ?","e-p37":"Un grand tremblement de terre ! Les portes se sont ouvertes. Le gardien de la prison a appris la vérité, et il s'est fait baptiser avec sa famille. Actes chapitre 16, versets 25 à 33.","q-p38":"Une nuit, quelqu'un a appelé le petit Samuel. Qui était-ce ? Sa maman ? Jéhovah ? Ou Le vieux prêtre ?","e-p38":"C'était Jéhovah ! Samuel a répondu : Parle, car ton serviteur écoute. Il était jeune, mais il a eu le courage de répéter tout le message. Premier livre de Samuel, chapitre 3, versets 10 et 18.","q-p39":"Abigaïl est allée calmer David et ses hommes en colère. Qu'a-t-elle apporté ? Des épées ? Beaucoup à manger ? Ou Des bijoux ?","e-p39":"Beaucoup à manger, chargé sur des ânes. Elle a parlé à David avec douceur, et il s'est calmé. Premier livre de Samuel, chapitre 25, versets 18 et 32 à 35.","q-p40":"Une maman très pauvre a fait un petit pain pour Élie avec ce qui lui restait. Qu'est-ce qui ne s'est plus vidé chez elle ? Sa farine et son huile ? Son puits d'eau ? Ou Son coffre d'argent ?","e-p40":"Sa farine et son huile ! C'était pendant une grande sécheresse. Jéhovah a nourri cette maman, son fils et Élie jusqu'au retour de la pluie. Premier livre des Rois, chapitre 17, versets 13 à 16.","q-p41":"Naamân était très malade. Dans sa maison, qui a parlé du prophète de Jéhovah ? Une petite fille ? Un grand roi ? Ou Un vieux soldat ?","e-p41":"Une petite fille israélite, qui servait la femme de Naamân. Elle a eu le courage de parler du prophète de son Dieu, et Naamân a été guéri. Deuxième livre des Rois, chapitre 5, versets 2 et 3.","q-p42":"Le serviteur d'Élisée avait peur d'une armée. Qu'a-t-il vu sur les montagnes ? Des chevaux de feu ? Des lions ? Ou Des géants ?","e-p42":"Des chevaux et des chars de feu, tout autour d'Élisée ! C'étaient les anges de Jéhovah. Ceux qui sont avec nous sont plus nombreux, avait dit Élisée. Deuxième livre des Rois, chapitre 6, versets 16 et 17.","q-m23":"La Bible dit que Dieu a pris Hénoch. Que s'est-il passé ? A : Il est monté au ciel sans mourir. B : Il s'est endormi paisiblement dans la mort. C : Il a été enlevé par ses ennemis. D : Il est parti vivre seul dans le désert.","e-m23":"Il s'est endormi paisiblement dans la mort. Des gens violents voulaient probablement lui faire du mal, et Jéhovah l'a protégé. Il n'est pas monté au ciel : Jésus a dit que personne n'y était monté. Genèse chapitre 5, verset 24, et Jean chapitre 3, verset 13.","q-m24":"La femme de Putiphar voulait pousser Joseph à mal agir avec elle. Pourquoi a-t-il refusé ? A : Il avait peur d'être puni par son maître. B : Il ne voulait pas pécher contre Dieu. C : Il voulait retourner chez son père. D : Il espérait être libéré plus vite.","e-m24":"Il ne voulait pas pécher contre Dieu, ni trahir Putiphar. Elle insistait jour après jour, et un jour Joseph s'est enfui. Genèse chapitre 39, versets 8 à 12.","q-m25":"Pharaon a ordonné à deux sages-femmes de tuer les bébés garçons hébreux. Elles ont refusé. Comment s'appelaient-elles ? A : Miriam et Jokébed. B : Shifra et Poua. C : Marthe et Marie. D : Déborah et Jaël.","e-m25":"Shifra et Poua. Elles craignaient Dieu plus que le roi d'Égypte, et elles ont sauvé les bébés. Jéhovah leur a fait du bien et leur a donné des enfants. Exode chapitre 1, versets 15 à 21.","q-m26":"Caleb avait été l'un des deux espions fidèles. Quel âge avait-il quand il a demandé la ville d'Hébron ? A : 40 ans. B : 60 ans. C : 85 ans. D : 120 ans.","e-m26":"85 ans ! Quarante-cinq ans plus tôt, les mauvais espions disaient que les géants d'Hébron étaient trop forts. Caleb a dit : Jéhovah sera avec moi. Et il a pris la ville. Josué chapitre 14, versets 10 à 12.","q-m27":"Le septième jour, combien de fois les Israélites ont-ils fait le tour de Jéricho ? A : Une fois. B : Trois fois. C : Sept fois. D : Douze fois.","e-m27":"Sept fois. Les six jours d'avant, ils en avaient fait le tour une fois par jour. Puis ils ont poussé un grand cri, et la muraille s'est effondrée. Josué chapitre 6, versets 15, 16 et 20.","q-m28":"Mefibosheth, le fils de Jonathan, était handicapé. Qu'a décidé le roi David ? A : Il mangerait toujours à la table du roi. B : Il deviendrait le chef de l'armée. C : Il serait guéri par un prophète. D : Il habiterait loin de Jérusalem.","e-m28":"Il mangerait tous les jours à la table du roi. David tenait la promesse faite des années plus tôt à son ami Jonathan : prendre soin de sa famille. Deuxième livre de Samuel, chapitre 9, versets 7 et 13.","q-m29":"À Babylone, qu'ont mangé Daniel et ses trois amis pendant dix jours, à la place des plats du roi ? A : Du pain et du miel. B : Des légumes, avec de l'eau. C : Du poisson grillé. D : Des fruits secs et du lait.","e-m29":"Des légumes, et ils ne buvaient que de l'eau. Au bout de dix jours, ils avaient meilleure mine que tous les autres jeunes. Jéhovah les a bénis. Daniel chapitre 1, versets 12 à 15.","q-m30":"Sous le roi Josias, qu'a découvert le grand prêtre Hilkia pendant les réparations du temple ? A : Un trésor d'or caché. B : Le livre de la Loi. C : Les tables de pierre. D : L'épée de Goliath.","e-m30":"Le livre de la Loi que Jéhovah avait donnée à Moïse. Josias a été bouleversé en l'écoutant, et il a aidé le peuple à revenir à Jéhovah. Deuxième livre des Rois, chapitre 22, versets 8 à 13.","q-m31":"Qui a été le premier disciple de Jésus à être tué à cause de sa foi ? A : Jacques. B : Pierre. C : Étienne. D : Paul.","e-m31":"Étienne. Devant le Sanhédrin, il a parlé avec courage. On l'a lapidé, et il a prié : ne leur compte pas ce péché. Actes chapitre 7, versets 59 et 60.","q-m32":"Les apôtres ont donné un surnom à un disciple : Barnabé. Que veut dire ce surnom ? A : Fils de consolation. B : Fils du tonnerre. C : Homme de paix. D : Ami fidèle.","e-m32":"Fils de consolation. Barnabé savait réconforter. Il a même eu le courage d'accueillir Saul, l'ancien persécuteur, quand les autres avaient peur de lui. Actes chapitre 4, verset 36, et chapitre 9, verset 27.","q-m33":"La Bible a donné, environ 200 ans à l'avance, le nom du roi qui prendrait Babylone. Qui est-ce ? A : Nabuchodonosor. B : Cyrus. C : Salomon. D : Alexandre le Grand.","e-m33":"Cyrus, roi de Perse. En 539 avant notre ère, son armée a détourné le fleuve et elle est entrée par les portes laissées ouvertes. Isaïe chapitre 44, verset 27, jusqu'au chapitre 45, verset 2.","q-m34":"Combien de fois environ le nom de Jéhovah est-il écrit dans la Bible ? A : Plus de 70 fois. B : Plus de 700 fois. C : Plus de 7 000 fois. D : Plus de 70 000 fois.","e-m34":"Plus de 7 000 fois ! C'est bien la preuve que Jéhovah veut qu'on connaisse son nom et qu'on l'utilise. Isaïe chapitre 42, verset 8.","q-m35":"Pendant combien de temps environ la Bible a-t-elle été écrite ? A : 40 ans. B : 400 ans. C : 1 600 ans. D : 4 000 ans.","e-m35":"Environ 1 600 ans, de 1513 avant notre ère jusque vers l'an 98 de notre ère. Une quarantaine d'hommes l'ont écrite, et ils ne se contredisent pas, parce que Dieu en est l'Auteur. Deuxième lettre à Timothée, chapitre 3, verset 16.","q-m36":"Pourquoi la Bible appelle-t-elle Jésus le Fils unique de Dieu ? A : Il est le seul à être né à Bethléem. B : Il est le seul créé directement par Jéhovah. C : Il est le seul à avoir été baptisé. D : Il est le seul à avoir fait des miracles.","e-m36":"Parce qu'il est le seul que Jéhovah a créé directement. Il a été créé en tout premier, et il a aidé son Père à créer tout le reste. Jean chapitre 3, verset 16, et Colossiens chapitre 1, verset 15.","q-m37":"Qui sont les démons ? A : Les âmes de méchants humains morts. B : Des anges qui se sont rebellés contre Dieu. C : Des monstres fabriqués par Satan. D : Des humains qui pratiquent la magie.","e-m37":"Des anges qui ont suivi Satan dans sa rébellion. Jéhovah les a chassés du ciel. Ils sont près de la terre, et leur destruction approche. Révélation chapitre 12, versets 9 et 12.","q-m38":"Anne, la mère de Samuel, était triste de ne pas avoir d'enfant. Qui la faisait souffrir encore plus ? A : L'autre femme de son mari. B : La mère de son mari. C : Une servante de la maison. D : Sa propre sœur aînée.","e-m38":"L'autre femme de son mari. Elle avait des enfants et se moquait d'Anne, surtout pendant le voyage de chaque année au tabernacle. Anne a tout confié à Jéhovah dans la prière. Premier livre de Samuel, chapitre 1, versets 6 et 7.","q-m39":"Élie attendait la pluie. Combien de fois a-t-il envoyé son serviteur regarder vers la mer ? A : Deux fois. B : Trois fois. C : Sept fois. D : Dix fois.","e-m39":"Sept fois. La septième fois, le serviteur a vu un petit nuage, de la taille d'une main d'homme. Pour Élie, c'était assez : Jéhovah allait agir. Premier livre des Rois, chapitre 18, versets 43 et 44.","q-m40":"Jonas était fâché, assis près de Ninive. Qu'est-ce que Jéhovah a fait pousser en une nuit pour lui donner de l'ombre ? A : Une courge. B : Un palmier. C : Un figuier. D : Un cèdre.","e-m40":"Une courge. Elle a séché dès le lendemain, et Jonas était triste pour elle. Jéhovah s'en est servi pour lui apprendre la miséricorde. Jonas chapitre 4, versets 6 à 10.","q-m41":"Après la mort de Lazare, à qui Jésus a-t-il dit : Je suis la résurrection et la vie? A : À Marthe. B : À Marie de Magdala. C : À Pierre. D : À sa mère, Marie.","e-m41":"À Marthe, la sœur de Lazare. Elle lui a répondu : je crois que tu es le Christ, le Fils de Dieu. Malgré son chagrin, sa foi restait solide. Jean chapitre 11, versets 25 à 27.","q-m42":"Pierre a demandé à Jésus s'il devait pardonner jusqu'à sept fois. Qu'a répondu Jésus ? A : Oui, sept fois suffisent. B : Trois fois seulement. C : Jusqu'à soixante-dix-sept fois. D : Seulement s'il s'excuse.","e-m42":"Jusqu'à soixante-dix-sept fois. Jésus ne voulait pas qu'on compte : l'amour ne fixe pas de limite au pardon. Les chefs religieux, eux, enseignaient de pardonner trois fois seulement. Matthieu chapitre 18, versets 21 et 22.","q-g23":"D'après Hébreux chapitre 11, verset 4, Abel parle encore, bien qu'il soit mort. Grâce à quoi parle-t-il ? Et pourquoi son offrande a-t-elle plu à Dieu ?","e-g23":"Grâce à sa foi : il est le premier humain à l'avoir manifestée. Son offrande a plu à Dieu parce qu'il l'a faite par foi, avec de bonnes motivations : il a donné à Jéhovah ce qu'il avait de meilleur, les premiers-nés de son troupeau. Son exemple de foi nous parle encore aujourd'hui. Abel est le premier humain à avoir manifesté la foi. Il a offert à Jéhovah ce qu'il avait de meilleur, avec un cœur sincère. Quand nous imitons sa foi, nous l'entendons encore nous parler. Hébreux chapitre 11, verset 4.","q-g24":"D'après Imitez leur foi, Abraham a peut-être connu un fidèle serviteur de Dieu qui avait vécu le Déluge. Qui est-ce ? A : Hénoch. B : Mathusalem. C : Sem. D : Lamek.","e-g24":"Sem, un fils de Noé. Il avait vu plus de 400 ans d'histoire, dont le Déluge et la tour de Babel. Après le Déluge, Noé a appelé Jéhovah le Dieu de Sem. Genèse chapitre 9, verset 26.","q-g25":"Quand les fils de Samuel se sont montrés malhonnêtes, qu'ont réclamé les anciens d'Israël ? Et d'après Jéhovah, qui rejetaient-ils vraiment ?","e-g25":"Ils ont réclamé un roi, pour être jugés comme toutes les nations. Jéhovah a dit à Samuel : ce n'est pas toi qu'ils ont rejeté, mais c'est moi qu'ils ont rejeté comme roi. Les fils de Samuel acceptaient des pots-de-vin. Le peuple a voulu un roi, comme les autres nations. En réalité, c'est Jéhovah qu'il rejetait comme roi. Premier livre de Samuel, chapitre 8, versets 1 à 7.","q-g26":"Après avoir fui la reine Jézabel, Élie a marché 40 jours et 40 nuits. Jusqu'à quelle montagne ? A : Le mont Carmel. B : Le mont Horeb. C : Le mont des Oliviers. D : Le mont Moria.","e-g26":"Le mont Horeb, c'est-à-dire le Sinaï, où Jéhovah s'était révélé à Moïse, des siècles plus tôt, dans le buisson en feu. Là, Jéhovah a consolé Élie par une voix calme et basse. Premier livre des Rois, chapitre 19, versets 8 à 12.","q-g27":"Élie se croyait le seul fidèle qui restait. D'après Jéhovah, combien d'hommes en Israël ne s'étaient pas mis à genoux devant Baal ? A : 70. B : 700. C : 7 000. D : 70 000.","e-g27":"Sept mille. Élie n'était pas seul ! Jéhovah lui a aussi donné Élisée, pour l'aider et lui succéder. Premier livre des Rois, chapitre 19, versets 16 et 18.","q-g28":"Quand la plante qui faisait de l'ombre à Jonas a séché, quelle leçon Jéhovah lui a-t-il donnée au sujet de Ninive ?","e-g28":"Jonas avait pitié d'une plante qu'il n'avait ni plantée ni entretenue. Jéhovah, qui a donné la vie aux Ninivites et pourvoit à leurs besoins, avait bien plus de raisons d'avoir pitié de Ninive, où vivaient plus de 120 000 personnes qui ne faisaient même pas la différence entre le bien et le mal, sans compter leurs nombreux animaux. Jonas devait apprendre la miséricorde. Jonas tenait plus à une plante qu'à la vie de plus de 120 000 personnes. Jéhovah, qui leur donne la vie, voulait lui apprendre la miséricorde. Jonas chapitre 4, versets 10 et 11.","q-g29":"Les Juifs fêtent chaque année la victoire du temps d'Esther. D'où vient le nom de cette fête, Pourim ? A : Des sorts tirés par Aman. B : Du nom du roi de Perse. C : D'un mot qui veut dire victoire. D : Du nom d'une ville de Perse.","e-g29":"Des sorts tirés par Aman. Pourim vient du mot pour, qui veut dire sort. Aman avait tiré au sort le jour où les Juifs devaient être tués. Grâce à Esther, ce jour est devenu celui de leur victoire. Esther chapitre 3, verset 7, et chapitre 9, versets 24 à 26.","q-g30":"Après la visite des bergers à Bethléem, qu'a fait Marie de tout ce qu'elle avait entendu ? A : Elle l'a raconté à tout le village. B : Elle y a réfléchi dans son cœur. C : Elle l'a écrit sur un rouleau. D : Elle a demandé l'avis des prêtres.","e-g30":"Elle retenait toutes ces paroles et y réfléchissait dans son cœur. Marie était une jeune femme réfléchie. Imitons-la en méditant sur ce que nous lisons dans la Bible. Luc chapitre 2, verset 19.","q-g31":"Beaucoup de disciples avaient cessé de suivre Jésus. Il a demandé aux apôtres : Vous ne voulez pas vous en aller, vous aussi ? Qu'a répondu Pierre ? A : Seigneur, vers qui irions-nous ?. B : Nous attendrons de mieux comprendre. C : Nous resterons si tu nous expliques. D : Nous allons y réfléchir ensemble.","e-g31":"Seigneur, vers qui irions-nous ? Tu as des paroles de vie éternelle. Pierre ne comprenait pas tout, mais il est resté fidèle. Jean chapitre 6, versets 67 et 68.","q-g32":"Au mont Carmel, Élie a demandé au peuple : Jusqu'à quand hésiterez-vous ? Que voulait-il dire, et quelle leçon pour nous ?","e-g32":"Les Israélites voulaient adorer Baal tout en demandant à Jéhovah de les bénir. Ils devaient choisir, parce que Jéhovah exige un attachement exclusif. Pour nous : ne pas laisser d'autres baals prendre dans notre vie la place qui revient au culte de Jéhovah. Le peuple essayait de suivre deux chemins à la fois. Mais Jéhovah ne partage avec personne l'adoration qui lui revient. Premier livre des Rois, chapitre 18, verset 21.","q-g33":"D'après des biblistes, que signifie le nom Jéhovah ? A : Il fait devenir. B : Le Tout-Puissant. C : Le Seigneur des seigneurs. D : Celui qui voit tout.","e-g33":"Il fait devenir. Jéhovah est la forme française d'un nom hébreu. Les autres réponses sont des titres : Dieu en a beaucoup, mais il n'a qu'un seul nom. Isaïe chapitre 42, verset 8.","q-g34":"En Genèse chapitre 3, quel mensonge Satan a-t-il dit à Ève ? Et en quoi a-t-il sali la réputation de Jéhovah ?","e-g34":"Il lui a dit qu'elle ne mourrait pas et qu'elle serait comme Dieu. Il a laissé entendre que Jéhovah la privait de quelque chose de bon, et que les humains seraient plus heureux sans lui obéir. Il a ainsi calomnié Jéhovah, en le faisant passer pour un dirigeant injuste et sans amour. Vous ne mourrez absolument pas : c'était le premier mensonge. Satan a fait passer Jéhovah pour un Dieu qui prive les humains de ce qui est bon. Jéhovah prouvera que sa façon de gouverner est la meilleure. Genèse chapitre 3, versets 4 et 5, et Jean chapitre 8, verset 44.","q-g35":"Pourquoi la Bible dit-elle que la vie de Jésus est une rançon correspondante ? Comment la mort d'un seul homme peut-elle sauver tous les humains ?","e-g35":"Adam était un homme parfait. En désobéissant, il a perdu la vie parfaite, pour lui et pour ses descendants, et nous sommes devenus prisonniers du péché et de la mort. Jésus, homme parfait lui aussi, a donné sa vie parfaite : un prix exactement équivalent. Il nous permet ainsi de retrouver ce qu'Adam a perdu. Un homme parfait a fait entrer le péché et la mort. Un autre homme parfait a donné sa vie pour racheter ce qui avait été perdu. Première lettre à Timothée, chapitre 2, versets 5 et 6.","q-g36":"D'après la Bible, dans quel état sont les morts ? A : Ils veillent sur leur famille. B : Ils ne savent rien. C : Ils souffrent pour leurs fautes. D : Ils attendent au ciel.","e-g36":"Ils ne savent rien. Jésus a comparé la mort à un profond sommeil. Les morts ne souffrent pas, et ils ne peuvent pas nous faire de mal. Ecclésiaste chapitre 9, verset 5.","q-g37":"D'après la Bible, qui sera ressuscité ? A : Seulement les serviteurs de Jéhovah. B : Les justes et les injustes. C : Seulement ceux qui sont morts jeunes. D : Seulement ceux qui vont au ciel.","e-g37":"Les justes et les injustes. Jésus a dit que tous ceux qui sont dans les tombes, dans la mémoire de Dieu, entendront sa voix. Actes chapitre 24, verset 15, et Jean chapitre 5, versets 28 et 29.","q-g38":"D'après Daniel chapitre 2, verset 44, qu'est-ce qui distingue le royaume de Dieu des gouvernements humains ? A : Il sera élu par tous les peuples. B : Il ne sera jamais détruit. C : Il gouvernera depuis Jérusalem. D : Il ne durera que sept ans.","e-g38":"Il ne sera jamais détruit. Son roi, Jésus, ne sera jamais remplacé, et il gouvernera toute la terre avec amour et justice. Daniel chapitre 2, verset 44.","q-g39":"En Actes chapitre 15, qui a demandé aux chrétiens de s'abstenir du sang ? A : Le collège central de Jérusalem. B : L'apôtre Paul, tout seul. C : Les prêtres du Temple. D : Les anciens d'Antioche.","e-g39":"Le collège central, c'est-à-dire les apôtres et les anciens de Jérusalem. Jéhovah l'avait déjà demandé à Noé après le Déluge, parce que pour lui le sang représente la vie. Actes chapitre 15, versets 28 et 29, et Genèse chapitre 9, verset 4.","q-g40":"Après un miracle, des gens ont voulu faire de Jésus leur roi. Qu'a-t-il fait ? A : Il a accepté pour un temps. B : Il s'est retiré seul dans la montagne. C : Il a demandé l'avis de ses apôtres. D : Il leur a dit d'attendre la Pâque.","e-g40":"Il s'est retiré dans la montagne. Il ne se mêlait pas de politique, car son royaume ne fait pas partie de ce monde. Les vrais chrétiens restent neutres eux aussi. Jean chapitre 6, verset 15, et chapitre 18, verset 36.","q-g41":"Quelle est la différence entre se vouer à Jéhovah et se faire baptiser ?","e-g41":"Se vouer à Jéhovah, c'est lui promettre dans une prière personnelle qu'on n'adorera que lui et qu'on fera passer sa volonté en premier. Le baptême vient ensuite : il montre publiquement qu'on s'est voué à Dieu. C'est l'amour pour Jéhovah qui pousse à faire ces deux pas. L'un est une promesse faite à Jéhovah dans la prière. L'autre la rend visible à tous. Et c'est l'amour qui pousse à faire ces deux pas. Psaume 40, verset 8, et Première lettre de Pierre, chapitre 3, verset 21.","q-g42":"Qui est aujourd'hui l'esclave fidèle et avisé dont parle Jésus en Matthieu chapitre 24, verset 45 ? A : Tous les chrétiens baptisés. B : Un petit groupe d'anciens oints. C : Les anciens de chaque assemblée. D : Les pionniers et les missionnaires.","e-g42":"Un petit groupe d'anciens oints de l'esprit : le Collège central. Il fournit la nourriture spirituelle au bon moment et dirige l'œuvre de prédication. Matthieu chapitre 24, verset 45."},"voixDispo":{"accueil":1,"bravo-1":1,"bravo-2":1,"bravo-3":1,"debut-tous":1,"debut":1,"derniere":1,"e-g01":1,"e-g02":1,"e-g03":1,"e-g04":1,"e-g05":1,"e-g06":1,"e-g07":1,"e-g08":1,"e-g09":1,"e-g10":1,"e-g11":1,"e-g12":1,"e-g13":1,"e-g14":1,"e-g15":1,"e-g16":1,"e-g17":1,"e-g18":1,"e-g19":1,"e-g20":1,"e-g21":1,"e-g22":1,"e-g23":1,"e-g24":1,"e-g25":1,"e-g26":1,"e-g27":1,"e-g28":1,"e-g29":1,"e-g30":1,"e-g31":1,"e-g32":1,"e-g33":1,"e-g34":1,"e-g35":1,"e-g36":1,"e-g37":1,"e-g38":1,"e-g39":1,"e-g40":1,"e-g41":1,"e-g42":1,"e-m01":1,"e-m02":1,"e-m03":1,"e-m04":1,"e-m05":1,"e-m06":1,"e-m07":1,"e-m08":1,"e-m09":1,"e-m10":1,"e-m11":1,"e-m12":1,"e-m13":1,"e-m14":1,"e-m15":1,"e-m16":1,"e-m17":1,"e-m18":1,"e-m19":1,"e-m20":1,"e-m21":1,"e-m22":1,"e-m23":1,"e-m24":1,"e-m25":1,"e-m26":1,"e-m27":1,"e-m28":1,"e-m29":1,"e-m30":1,"e-m31":1,"e-m32":1,"e-m33":1,"e-m34":1,"e-m35":1,"e-m36":1,"e-m37":1,"e-m38":1,"e-m39":1,"e-m40":1,"e-m41":1,"e-m42":1,"e-p01":1,"e-p02":1,"e-p03":1,"e-p04":1,"e-p05":1,"e-p06":1,"e-p07":1,"e-p08":1,"e-p09":1,"e-p10":1,"e-p11":1,"e-p12":1,"e-p13":1,"e-p14":1,"e-p15":1,"e-p16":1,"e-p17":1,"e-p18":1,"e-p19":1,"e-p20":1,"e-p21":1,"e-p22":1,"e-p23":1,"e-p24":1,"e-p25":1,"e-p26":1,"e-p27":1,"e-p28":1,"e-p29":1,"e-p30":1,"e-p31":1,"e-p32":1,"e-p33":1,"e-p34":1,"e-p35":1,"e-p36":1,"e-p37":1,"e-p38":1,"e-p39":1,"e-p40":1,"e-p41":1,"e-p42":1,"encourage-1":1,"encourage-2":1,"encourage-3":1,"joker-5050":1,"joker-adulte":1,"ouverte":1,"podium":1,"q-g01":1,"q-g02":1,"q-g03":1,"q-g04":1,"q-g05":1,"q-g06":1,"q-g07":1,"q-g08":1,"q-g09":1,"q-g10": var AC=null, analyseur=null, buf=new Uint8Array(256), tictacBuf=null;
function ctx(){
  if(AC)return AC;

  return AC;
}

function effet(nom){

  try{var a=effets[nom]||(effets[nom]=new Audio('sons/'+nom+(nom==='tictac'?'.ogg':'.mp3')));a.volume=GAINS[nom]||.5;a.currentTime=0;a.play().catch(function(){})}catch(e){}
}
// Montage de Milo (15/11/2026) : chaque effet a un point d'entrée de la voix, en ms depuis le début RÉEL de l'effet
// (événement playing, pas l'appel à play). L'effet est écrit pour être à −12 dB sous sa crête à la 1re syllabe.
// La voix suivante est préchargée pendant l'effet. Filet : point d'entrée + 1000 ms depuis l'appel.
var ENTREE={jingle:2000,tour:530,juste:640,faux:540,'fin-temps':620,joker:710,podium:2510,'whoosh-avant':240,entree:510};
function effetPuis(nom,suite,precharge){
  var fait=false,ms=ENTREE[nom]||600;function go(){if(fait)return;fait=true;suite()}
  if(precharge)prechargerVoix(precharge);
  if(!son){setTimeout(go,300);return}
  effet(nom);var a=effets[nom];
  if(a){var lance=function(){a.removeEventListener('playing',lance);setTimeout(go,ms)};a.addEventListener('playing',lance)}
  setTimeout(go,ms+1000);
}

function brancher(){

function etatGuide(add,rem){var g=document.getElementById('g');if(!g)return;(rem||[]).forEach(function(c){g.classList.remove(c)});(add||[]).forEach(function(c){g.classList.add(c)})}
function dire(cles,fin){ // cles : liste de clés de TXT, lues à la suite
  jeton++;var mon=jeton;stopVoix(true);
  file=cles.slice();derniereFile=cles.slice();
  suivant();

    if(mon!==jeton)return;
    var k=file.shift();

    if(!son){parleEnCours=false;etatGuide([],['parle']);if(fin)fin();return}
    parleEnCours=true;etatGuide(['parle']);
    if(VOIX[k]){
      brancher();simule=!sourceBranchee;
      var u='voix/'+k+'.mp3';if(lecteur.src.slice(-u.length)!==u)lecteur.src=u;else try{lecteur.currentTime=0}catch(e){}lecteur.volume=1;
      lecteur.onended=function(){setTimeout(suivant,250)};
      lecteur.onerror=function(){synthese(txt,function(){setTimeout(suivant,250)})};
      var p=lecteur.play();if(p&&p.catch)p.catch(function(){synthese(txt,function(){setTimeout(suivant,250)})});

}
function synthese(txt,ok){

    var vs=speechSynthesis.getVoices().filter(function(v){return /^fr/i.test(v.lang)});
    var h=vs.filter(function(v){return /Henri|Paul|Thomas|Remy|Rémy|Male|Homme/i.test(v.name)})[0]||vs[0];if(h)u.voice=h;
    u.onend=ok;u.onerror=ok;speechSynthesis.speak(u);
  }catch(e){ok()}
}

function bouche(t){
  var g=document.getElementById('g'),v=0;
  if(g&&parleEnCours){
    if(!simule&&analyseur){analyseur.getByteTimeDomainData(buf);var m=0;for(var i=0;i<buf.length;i++){var d=Math.abs(buf[i]-128);if(d>m)m=d}v=Math.min(1,m/38)}
    else{var s=(t-t0)/1000;v=Math.max(0,Math.min(1,(Math.sin(s*9.5)*.5+Math.sin(s*15.7)*.3+.25)*(Math.sin(s*1.3)>-.55?1:0)))}
  }
  if(g)g.style.setProperty('--bouche',v.toFixed(2));
  requestAnimationFrame(bouche);

function melanger(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),x=a[i];a[i]=a[j];a[j]=x}return a}
function tirer(niv,deja){
  var vus=lire('vus',[]);
  var exclus={};deja.forEach(function(q){exclus[q.id]=1;(q.exclut||[]).forEach(function(x){exclus[x]=1})});
  var pool=Q.filter(function(q){return q.niveau===niv&&!exclus[q.id]});
  // Partie très longue : les paires qui se donnent la réponse ne peuvent plus être évitées, puis on accepte de reposer.
  if(!pool.length)pool=Q.filter(function(q){return q.niveau===niv&&!deja.some(function(d){return d.id===q.id})});
  if(!pool.length)pool=Q.filter(function(q){return q.niveau===niv});
  var neufs=pool.filter(function(q){return vus.indexOf(q.id)<0});
  if(!neufs.length){vus=vus.filter(function(id){return !pool.some(function(q){return q.id===id})});ecrire('vus',vus);neufs=pool}
  var q=melanger(neufs)[0];
  if(q){vus.push(q.id);ecrire('vus',vus)}
  return q;
}

  P.q=tirer(eq.niv,P.poses);P.poses.push(P.q);P.n++;P.ok=null;P.retirees=[];P.reponse=null;P.juge=null;

function poser(){
  // La durée se fixe AVANT l'affichage : sinon la 1re question (et chaque changement de niveau en Mélange) s'affichait sans minuteur.
  P.duree=dureeQ(eqCourante().niv);P.reste=P.duree;
  ecran='question';rendre();
  var cles=[];if(P.n===P.total&&P.total>1)cles.push('derniere');cles.push('q-'+P.q.id);if(P.q.type==='ouverte')cles.push('ouverte');
  majMinuteur();

function demarrerMinuteur(){
  if(!P||ecran!=='question'||!P.duree||P.tic)return;
  P.tic=setInterval(function(){
    P.reste--;majMinuteur();
    if(P.reste<=5&&P.reste>0)effet('tictac');
    if(P.reste<=0){stopMinuteur();
      if(P.q.type==='ouverte'){reveler(true)}else{repondre(-1,true)}}
  },1000);
}
function stopMinuteur(){if(P&&P.tic){clearInterval(P.tic);P.tic=null}scene.classList.remove('temps-court')}
function majMinuteur(){
  var ch=document.getElementById('chiffre'),arc=document.getElementById('arc');if(!ch||!arc)return;
  var c=2*Math.PI*44;ch.textContent=P.reste;arc.setAttribute('stroke-dasharray',(c*(P.duree?P.reste/P.duree:0)).toFixed(1)+' '+c.toFixed(1));
  ch.parentNode.setAttribute('aria-label',P.reste+' secondes');
  scene.classList.toggle('temps-court',!!P.tic&&P.reste>0&&P.reste<=5);
}
function repondre(i,temps){
  if(ecran!=='question'||P.q.type==='ouverte')return;
  stopMinuteur();P.reponse=i;P.ok=(i===P.q.bonne);
  if(P.ok)eqCourante().s+=10;
  ecran='reponse';rendre();
  var r=1+Math.floor(Math.random()*3),k1=temps?'temps':(P.ok?'bravo-'+r:'encourage-'+r);
  // Temps écoulé : la cloche de fin joue seule, jamais « faux » par-dessus (Milo, 15/11)
  effetPuis(temps?'fin-temps':(P.ok?'juste':'faux'),function(){if(ecran==='reponse')dire([k1,'e-'+P.q.id])},k1);
}
function reveler(temps){
  if(ecran!=='question')return;
  stopMinuteur();ecran='reponse';P.ok=null;rendre();
  if(temps)effetPuis('fin-temps',function(){if(ecran==='reponse')dire(['temps','e-'+P.q.id])},'temps');
  else dire(['revele','e-'+P.q.id]);
}
function juger(ok){
  if(P.juge!==null)return;
  P.juge=ok;P.ok=ok;if(ok){eqCourante().s+=10}
  rendre();var r=1+Math.floor(Math.random()*3);
  effetPuis(ok?'juste':'faux',function(){if(ecran==='reponse')dire([ok?'bravo-'+r:'encourage-'+r])},ok?'bravo-'+r:'encourage-'+r);
}
function sortieScene(f){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches){f();return}
  if(scene.classList.contains('joel--sort'))return;scene.classList.add('joel--sort');setTimeout(f,280);
}
function suite(){
  stopVoix();sortieScene(suiteApresSortie);
}
function suiteApresSortie(){
  if(P.n>=P.total){ecran='podium';rendre();effetPuis('podium',function(){if(ecran==='podium')dire(['podium'])},'podium');return}
  P.tour=(P.tour+1)%P.eq.length;lancerTour();
}
function joker5050(){
  var eq=eqCourante();if(eq.j5050||P.q.type==='ouverte'||ecran!=='question')return;
  eq.j5050=true;var mauvaises=P.q.choix.map(function(_,i){return i}).filter(function(i){return i!==P.q.bonne});
  P.retirees=melanger(mauvaises).slice(0,P.q.choix.length>=4?2:1);
  rendre();majMinuteur();effetPuis('joker',function(){dire(['joker-5050'],function(){demarrerMinuteur()})},'joker-5050');
}
function jokerAdulte(){
  var eq=eqCourante();if(eq.jadulte||ecran!=='question')return;
  eq.jadulte=true;rendre();majMinuteur();effetPuis('joker',function(){dire(['joker-adulte'],function(){demarrerMinuteur()})},'joker-adulte');
}

/* ---------- Écrans ---------- */
function niveauScene(){return ecran==='accueil'?(cfg.niveau==='melange'?'moyens':cfg.niveau):(P?eqCourante().niv:'moyens')}
function tel(){return cfg.mode==='tel'}
function seg(act,v,actif,html){return '<button class="seg" data-act="'+act+'" data-v="'+v+'" aria-pressed="'+actif+'">'+html+'</button>'}
var R={};
R.accueil=function(){
  var NV=['petits','moyens','grands'];
  var nivBtns=NV.map(function(k){return seg('niveau',k,cfg.niveau===k,'<span class="niv-carte" style="display:flex;align-items:center;gap:.5em"><span class="pastille" style="background:'+NIV[k].coul+'"></span><span>'+NIV[k].nom+'<small>'+NIV[k].age+'</small></span></span>')}).join('')
    +seg('niveau','melange',cfg.niveau==='melange','Mélange<small>un niveau par équipe</small>');
  var eqs=cfg.jeu==='tous'
    ?'<div class="eq-champ" style="cursor:default">'+forme(TOUS)+'<span class="nom">Tout le monde joue ensemble</span></div>'
    :EQUIPES.map(function(e){var on=cfg.actives.indexOf(e.k)>=0,nv=cfg.nivEq[e.k]||'moyens';
      return '<div class="eq-champ'+(on?'':' inactive')+'" data-act="eq" data-v="'+e.k+'" role="button" tabindex="0" aria-pressed="'+on+'">'+forme(e)+'<span class="nom">'+esc(e.n)+'</span>'
        +(cfg.niveau==='melange'&&on?'<button class="tag-niv" data-act="niveq" data-v="'+e.k+'" style="background:'+NIV[nv].coul+'" aria-label="Niveau de '+esc(e.n)+' : '+NIV[nv].nom+'">'+NIV[nv].nom+'</button>':'')
        +'</div>'}).join('');
  return '<div class="ecran ecran-accueil">'
   +'<header class="ac-titre"><h1>Le Grand Quiz de Joël</h1><p>Le quiz biblique des équipes, dès 5 ans</p><p class="bulle-court">Touchez une équipe pour l\'ajouter ou la retirer.</p></header>'
   +guide('',TXT.accueil)
   +'<section class="ac-bloc ac-mode"><h2>1. Où joue-t-on ?</h2><div class="seg-ligne">'
     +seg('mode','tv',cfg.mode==='tv','Grand écran<small>sur la télé, un adulte mène</small>')
     +seg('mode','tel',cfg.mode==='tel','Téléphone<small>passé de main en main</small>')+'</div></section>'
   +'<section class="ac-bloc ac-niv"><h2>2. Niveau</h2><div class="seg-ligne">'+nivBtns+'</div></section>'
   +'<section class="ac-bloc ac-opt"><div class="opt-ligne">'
     +'<div><h2>Comment ?</h2><div class="mini-seg seg-ligne">'+seg('jeu','equipes',cfg.jeu==='equipes','Équipes')+seg('jeu','tous',cfg.jeu==='tous','Tous ensemble')+'</div></div>'
     +'<div><h2>Questions</h2><div class="mini-seg seg-ligne">'+[6,10,15,20].map(function(n){return seg('nb',n,cfg.nb===n,n)}).join('')+'</div></div>'
     +'<div><h2>Minuteur</h2><div class="mini-seg seg-ligne">'+seg('duree','auto',cfg.duree==='auto','Oui')+seg('duree','45',cfg.duree==='45','45 s')+seg('duree','sans',cfg.duree==='sans','Sans')+'</div></div>'
   +'</div></section>'
   +'<section class="ac-bloc ac-eq">'+(cfg.jeu==='tous'?'<h2>3. Une seule grande équipe</h2>'
     :'<h2>3. Nombre d\'équipes</h2><div class="mini-seg seg-ligne nb-eq">'+[1,2,3,4,5,6].map(function(n){return seg('nbeq',n,cfg.actives.length===n,n)}).join('')+'</div>')
   +'<div class="eq-grille">'+eqs+'</div></section>'
   +'<button class="cta ac-go" data-act="commencer">Commencer la partie</button>'
   +'</div>';
};
function bandeauTour(avecMin){
  var eq=eqCourante(),nm=eq.n.replace(/^Les /,'');
  return '<header class="bandeau"><div class="tour">'+forme(eq)+'<span class="txt">'+(eq.k==='tous'?'Tout le monde':'<span class="av">À vous, les </span><span class="art">Les </span>'+esc(nm))+'</span></div>'
    +'<div class="progression"><span class="long">Question </span>'+P.n+' / '+P.total+'</div>'+(avecMin&&P.duree?minuteur(P.reste,P.duree):'')+'</header>';
}
function cartes(rev){
  var q=P.q,niv=q.niveau;
  return '<div class="choix choix-'+(niv==='petits'?'petits':'moyens')+'">'+q.choix.map(function(ch,i){
    var cls='carte-choix',tag='';
    if(!rev&&P.retirees.indexOf(i)>=0)cls+=' retiree';
    if(rev){
      if(i===q.bonne){cls+=' bonne';tag='<span class="etiq">'+COCHE+'<span class="etiq-txt">Bonne réponse</span></span>'}
      else if(i===P.reponse){cls+=' choisie-ko';tag='<span class="etiq neutre">Votre choix</span>'}
      else cls+=' eteinte';
    }
    var il=ILLU[q.id+'-'+i];
    var corps=niv==='petits'
      ?(il?'<span class="illu" aria-hidden="true">'+il+'</span>':'<span class="lettre">'+'ABC'[i]+'</span>')+'<span class="lib">'+esc(ch)+'</span>'
      :'<span class="lettre">'+'ABCD'[i]+'</span><span class="lib">'+esc(ch)+'</span>';
    return '<button class="'+cls+'"'+(rev?' tabindex="-1"':' data-act="rep" data-v="'+i+'"')+' aria-label="'+'ABCD'[i]+' : '+esc(ch)+'">'+tag+corps+'</button>';
  }).join('')+'</div>';
}
function jokers(){
  var eq=eqCourante(),ouv=P.q.type==='ouverte',petit=P.q.niveau==='petits';
  var j1=ouv?'<button class="joker" disabled><span class="j-ico">50/50</span>Pas pour une réponse libre</button>'
    :'<button class="joker" data-act="j5050"'+(eq.j5050?' disabled':'')+'><span class="j-ico">50/50</span>'+(eq.j5050?'Déjà utilisé':(petit||P.q.choix.length<4?'Retirer une réponse':'Retirer deux réponses'))+'</button>';
  return '<div class="jokers">'+j1+'<button class="joker" data-act="jadulte"'+(eq.jadulte?' disabled':'')+'><span class="j-ico">?</span>'+(eq.jadulte?'Déjà utilisé':'Demander à un adulte')+'</button></div>';
}
R.tour=function(){
  var eq=eqCourante();
  return '<div class="ecran ecran-tour" style="--c:'+eq.c+';--e:'+eq.e+'">'
    +guide('attente',TXT['tour-'+eq.k])
    +'<div class="centre">'+forme(eq)+'<p class="au-tour">'+(eq.k==='tous'?'À vous tous':'Au tour de')+'</p><p class="nom-eq">'+esc(eq.n)+'</p>'
    +'<p class="consigne">'+(tel()?MAIN+(eq.k==='tous'?'Rassemblez-vous autour du téléphone':'Passez le téléphone à cette équipe'):'Approchez-vous de l\'écran')+'</p></div>'
    +'<div class="bas">'+scores(P.tour)+'<button class="cta" data-act="pret" autofocus>Nous sommes prêts !</button></div></div>';
};
R.question=function(){
  var q=P.q,ouv=q.type==='ouverte';
  var corps=ouv?'<div class="ouverte"><p class="oral">'+MICRO+'Répondez à voix haute</p><p class="aide">Ensuite, l\'adulte révèle la réponse et dit si elle est trouvée.</p><button class="cta" data-act="reveler">Révéler la réponse</button></div>':cartes(false);
  var g=guide('',ouv?'Réfléchissez ensemble, puis répondez à voix haute !':'Écoutez bien, et choisissez la bonne réponse !');
  var debut='<div class="ecran ecran-question'+(P.duree?'':' sans-minuteur')+'">'+bandeauTour(true)+g;
  if(tel())return debut+'<main class="corps"><p class="q-texte">'+esc(q.question)+'</p>'+corps+'</main>'+jokers()+scores(P.tour)+'</div>';
  return debut+'<main class="corps"><p class="q-texte">'+esc(q.question)+'</p>'+corps+jokers()+'</main><footer class="pied">'+scores(P.tour)+'</footer></div>';
};
R.reponse=function(){
  var q=P.q,ouv=q.type==='ouverte',ok=P.ok;
  var titre=ouv
    ?'<div class="titre-rep">'+(P.juge===null?'La réponse attendue':(ok?'Bien trouvé !<span class="gain">+10 points</span>':'Pas cette fois, mais bravo d\'avoir essayé !'))+'</div>'
    :'<div class="titre-rep">'+(ok?'Bonne réponse !<span class="gain">+10 points</span>':'Presque ! Voici la réponse.')+'</div>';
  var bloc=ouv
    ?'<div class="revele"><strong>'+esc(q.reponse_attendue)+'</strong>'+(q.juge_minimum?'<p class="juge-min">Pour l\'adulte : '+esc(q.juge_minimum)+'</p>':'')
      +'<div class="juge"><button class="'+(P.juge===true?'choisi':'')+'" data-act="juge" data-v="1"'+(P.juge!==null?' disabled':'')+'>Trouvée : +10</button><button class="'+(P.juge===false?'choisi':'')+'" data-act="juge" data-v="0"'+(P.juge!==null?' disabled':'')+'>Pas cette fois</button></div></div>'
    :cartes(true);
  var etat=ouv?(P.juge===null?'':(ok?'joie':'encourage')):(ok?'joie':'encourage');
  var g=guide(etat,ouv?TXT.revele:(ok?'Bravo ! C\'est la bonne réponse !':'Ce n\'est pas grave ! Regardons ensemble la réponse.'));
  var explic='<div class="explic"><span class="verset">'+esc(q.reference)+'</span><p>'+esc(q.explication)+'</p></div>';
  var bout='<button class="cta" data-act="suite"'+(ouv&&P.juge===null?' disabled style="opacity:.5"':'')+'>'+(P.n>=P.total?'Voir le podium':(P.eq.length>1?'Équipe suivante':'Question suivante'))+'</button>';
  if(tel())return '<div class="ecran ecran-reponse">'+bandeauTour(false)+g+'<main class="corps">'+titre+bloc+explic+'</main><div class="pied-bouton">'+bout+'</div></div>';
  return '<div class="ecran ecran-reponse">'+bandeauTour(false)+g+'<main class="corps">'+titre+bloc+explic+'</main><footer class="pied">'+scores(P.tour)+bout+'</footer></div>';
};
R.podium=function(){
  var tri=P.eq.slice().sort(function(a,b){return b.s-a.s});
  // Ex aequo : même rang affiché (classement 1, 1, 3), la marche garde sa place
  function rangDe(e){return 1+P.eq.filter(function(x){return x.s>e.s}).length}
  function marche(e,place){var rang=e?rangDe(e):0;return e?'<div class="marche m'+place+' r'+rang+'" style="--c:'+e.c+'"><div class="qui">'+forme(e)+esc(e.n)+'<span class="pts">'+e.s+' points</span></div><div class="socle">'+rang+'</div></div>':''}
  var conf='';for(var i=0;i<34;i++){conf+='<i style="left:'+((i*37)%100)+'%;background:'+(P.eq[i%P.eq.length].c)+';animation-delay:'+(-(i*.53)%4).toFixed(2)+'s;animation-duration:'+(3.4+(i%5)*.35).toFixed(2)+'s"></i>'}
  var pod=tri.length===1?marche(tri[0],1):marche(tri[1],2)+marche(tri[0],1)+marche(tri[2],3);
  return '<div class="ecran ecran-podium"><div class="confettis" aria-hidden="true">'+conf+'</div>'
    +'<h1 class="po-titre">'+(tri.length===1?'Bravo à tous !':'Bravo à toutes les équipes !')+'</h1>'
    +guide('joie',TXT.podium)
    +'<div class="podium">'+pod+'</div>'
    +'<div class="tous"><p>Une médaille pour chaque équipe :</p>'+tri.map(function(e){return '<span class="puce">'+RUBAN+forme(e)+'<span class="n">'+esc(e.n)+'</span></span>'}).join('')
    +'<button class="secondaire" data-act="rejouer">Rejouer</button><button class="secondaire" data-act="menu">Changer les réglages</button></div></div>';
};

/* ---------- Rendu et mise à l'échelle ---------- */
var ecranPrecedent=null;
function rendre(){
  scene.className=(tel()?'tel':'tv')+' niv-'+niveauScene()+(ecran!==ecranPrecedent?' transition-entree':'');
  ecranPrecedent=ecran;
  scene.innerHTML=R[ecran]();
  ajuster();
  if(parleEnCours)etatGuide(['parle']);
  var f=scene.querySelector('[autofocus]');if(f)try{f.focus({preventScroll:true})}catch(e){}
}
function ajuster(){
  var w=tel()?375:1920,h=tel()?812:1080,W=window.innerWidth,H=window.innerHeight,s=Math.min(W/w,H/h);
  scene.style.width=w+'px';scene.style.height=h+'px';
  scene.style.transform='translate('+((W-w*s)/2)+'px,'+((H-h*s)/2)+'px) scale('+s+')';
}
window.addEventListener('resize',ajuster);

/* ---------- Commandes ---------- */
function action(act,v){
  switch(act){
    case 'mode':case 'jeu':case 'duree':cfg[act]=v;break;
    case 'niveau':cfg.niveau=v;break;
    case 'nb':cfg.nb=+v;break;
    case 'eq':{var i=cfg.actives.indexOf(v);if(i>=0){if(cfg.actives.length>1)cfg.actives.splice(i,1)}else cfg.actives.push(v);
      cfg.actives=EQUIPES.map(function(e){return e.k}).filter(function(k){return cfg.actives.indexOf(k)>=0});break}
    case 'nbeq':{var n=+v;var garde=cfg.actives.slice(0,n);EQUIPES.forEach(function(e){if(garde.length<n&&garde.indexOf(e.k)<0)garde.push(e.k)});
      cfg.actives=EQUIPES.map(function(e){return e.k}).filter(function(k){return garde.indexOf(k)>=0});break}
    case 'niveq':{var o=['petits','moyens','grands'],c=cfg.nivEq[v]||'moyens';cfg.nivEq[v]=o[(o.indexOf(c)+1)%3];break}
    case 'commencer':ecrire('cfg',cfg);ctx();nouvellePartie();effetPuis('jingle',lancerTour,cfg.jeu==='tous'?'debut-tous':'debut');return;
    case 'pret':poser();return;
    case 'rep':repondre(+v);return;
    case 'reveler':reveler(false);return;
    case 'juge':juger(v==='1');return;
    case 'suite':suite();return;
    case 'j5050':joker5050();return;
    case 'jadulte':jokerAdulte();return;
    case 'rejouer':stopVoix();var anc=P.eq;nouvellePartie();lancerTour();return;
    case 'menu':stopVoix();stopMinuteur();sortieScene(function(){ecran='accueil';rendre()});return;
  }
  ecrire('cfg',cfg);rendre();
}
scene.addEventListener('click',function(ev){
  var b=ev.target.closest('[data-act]');if(!b||b.disabled)return;
  ev.stopPropagation();action(b.dataset.act,b.dataset.v);
});
scene.addEventListener('keydown',function(ev){
  if((ev.key==='Enter'||ev.key===' ')&&ev.target.matches('.eq-champ')){ev.preventDefault();action('eq',ev.target.dataset.v)}
});
document.addEventListener('keydown',function(ev){
  if(ev.target.matches('input,textarea'))return;
  var k=ev.key.toLowerCase();
  if(ecran==='question'&&P&&P.q.type!=='ouverte'){var idx={'1':0,'2':1,'3':2,'4':3,a:0,b:1,c:2,d:3}[k];if(idx!==undefined&&idx<P.q.choix.length&&P.retirees.indexOf(idx)<0){repondre(idx);return}}
  if(ecran==='question'&&P&&P.q.type==='ouverte'&&(k==='enter'||k===' ')){ev.preventDefault();reveler(false);return}
  if(ecran==='reponse'&&P&&P.q.type==='ouverte'&&P.juge===null){if(k==='o'||k==='1'){juger(true);return}if(k==='n'||k==='0'){juger(false);return}}
  if(ecran==='reponse'&&(k==='enter'||k===' '||k==='arrowright')&&!(P.q.type==='ouverte'&&P.juge===null)){ev.preventDefault();suite();return}
  if(ecran==='tour'&&(k==='enter'||k===' ')){ev.preventDefault();poser();return}
  if(k==='r')reecouter();
  if(k==='m')basculerSon();
});
function reecouter(){if(derniereFile.length)dire(derniereFile,ecran==='question'?demarrerMinuteur:null)}
function basculerSon(){son=!son;ecrire('son',son);var b=document.getElementById('b-son');b.setAttribute('aria-pressed',String(son));b.setAttribute('aria-label',son?'Couper le son':'Remettre le son');if(!son)stopVoix()}
document.getElementById('b-reecouter').addEventListener('click',reecouter);
document.getElementById('b-son').addEventListener('click',basculerSon);
document.getElementById('b-son').setAttribute('aria-pressed',String(son));

/* Premier geste : les navigateurs exigent un clic avant de jouer un son. */
var lancer=document.getElementById('lancer');
document.getElementById('b-lancer').addEventListener('click',function(){
  lancer.hidden=true;ctx();if(AC&&AC.resume)AC.resume();
  try{speechSynthesis.getVoices()}catch(e){}
  ecranPrecedent=null;rendre();
  effetPuis('entree',function(){if(ecran==='accueil')dire(['accueil'])},'accueil');
});
rendre();
})();
</script>
