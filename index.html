<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Le Grand Quiz de Joël</title>
<meta name="description" content="Le Grand Quiz de Joël : le quiz biblique des équipes, pour les enfants de 5 à 15 ans.">
<style>

/* Maquette : un look unique et assumé (scène sombre par niveau), pas de bascule clair/sombre. */
:root{color-scheme:dark;--ui-bg:#0C0A12;--ui-panneau:#1E1B28;--ui-fg:#F1EFF6;--ui-doux:#B9B4C8;--ui-filet:#3A3548;--ui-accent:#6EA8FF;--ui-sur-accent:#0E0C14;
  --encre:#1A1424;--carte:#FFFFFF;--ok:#157F45;--ok-clair:#E3F5EA;--trait:#241C30}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--ui-bg);color:var(--ui-fg);font-family:'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}

/* ---------- Scène ---------- */
#scene{position:absolute;left:0;top:0;transform-origin:0 0;overflow:hidden;color:#fff;
  background:radial-gradient(120% 90% at 30% 20%,var(--fond2),var(--fond) 70%)}
.niv-petits{--fond:#0C4A30;--fond2:#136543;--accent:#FFD23F;--sur-accent:#1A1424}
.niv-moyens{--fond:#132B5E;--fond2:#1C3D85;--accent:#FF9F1C;--sur-accent:#1A1424}
.niv-grands{--fond:#3A1D5C;--fond2:#52297F;--accent:#3DD6C4;--sur-accent:#1A1424}

/* Formes d'équipe : la couleur n'est jamais seule, chaque équipe a aussi sa forme */
.forme{display:inline-block;width:1em;height:1em;flex:none;overflow:visible;vertical-align:middle}

/* Bulle de parole (sous-titre de ce que dit le guide) */
.zone-guide{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;min-width:0}
.bulle-txt{background:#fff;color:var(--encre);border-radius:28px;padding:.7em 1em;font-weight:600;line-height:1.3;position:relative;box-shadow:0 6px 0 rgba(0,0,0,.18);max-width:100%}
.bulle-txt::after{content:"";position:absolute;left:50%;bottom:-18px;margin-left:-14px;border:14px solid transparent;border-top:18px solid #fff;border-bottom:0}

/* Minuteur */
.minuteur{position:relative;flex:none}
.minuteur svg{display:block;width:100%;height:100%;transform:rotate(-90deg)}
.minuteur .chiffre{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:800;font-variant-numeric:tabular-nums}

/* Puces de score */
.scores{display:flex;gap:16px;flex-wrap:wrap;align-items:center;min-width:0}
.puce{display:flex;align-items:center;gap:.45em;background:rgba(255,255,255,.12);border:3px solid transparent;border-radius:999px;padding:.3em .8em .3em .5em;font-weight:600;white-space:nowrap}
.puce .pts{font-weight:800;font-variant-numeric:tabular-nums;margin-left:.2em}
.puce.actif{background:#fff;color:var(--encre);border-color:var(--accent)}

/* Boutons de scène */
.cta{background:var(--accent);color:var(--sur-accent);border:0;border-radius:999px;font-weight:800;box-shadow:0 6px 0 rgba(0,0,0,.25);white-space:nowrap;flex:none}
.secondaire{background:transparent;color:#fff;border:3px solid rgba(255,255,255,.75);border-radius:999px;font-weight:700}
.joker{display:flex;align-items:center;gap:.5em;background:rgba(255,255,255,.12);border:3px solid rgba(255,255,255,.6);border-radius:999px;color:#fff;font-weight:700;padding:.4em 1em .4em .4em}
.joker .j-ico{background:#fff;color:var(--encre);border-radius:999px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;min-width:2.4em;height:2.4em;padding:0 .4em;font-size:.8em}
.joker[disabled]{opacity:.45;cursor:not-allowed;border-style:dashed}

/* Cartes de choix */
.choix{display:grid;gap:24px}
.carte-choix{background:var(--carte);color:var(--encre);border:5px solid transparent;border-radius:28px;display:flex;align-items:center;gap:.6em;font-weight:700;text-align:left;box-shadow:0 8px 0 rgba(0,0,0,.22);position:relative;min-width:0}
.carte-choix .lettre{background:var(--accent);color:var(--sur-accent);border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:800;flex:none}
.carte-choix .lib{min-width:0}
.choix-petits .carte-choix{flex-direction:column;justify-content:center;text-align:center}
.illu{display:block;border-radius:50%;background:#FFF4D6;border:4px solid var(--trait)}
.illu svg{display:block;width:100%;height:100%}
.carte-choix.bonne{border-color:var(--ok);background:var(--ok-clair)}
.carte-choix.choisie-ko{border-style:dashed;border-color:#fff;outline:4px dashed var(--encre);outline-offset:-14px}
.carte-choix.eteinte{opacity:.58}
.etiq{position:absolute;top:-.7em;right:.8em;background:var(--ok);color:#fff;border-radius:999px;padding:.15em .7em;font-size:.5em;font-weight:800;display:flex;align-items:center;gap:.3em;white-space:nowrap}
.etiq.neutre{background:var(--encre)}
.etiq svg{width:1em;height:1em}

/* Explication */
.explic{background:var(--carte);color:var(--encre);border-radius:28px;display:flex;gap:.8em;align-items:flex-start;border-left:16px solid var(--accent)}
.verset{background:var(--encre);color:#fff;border-radius:999px;font-weight:800;white-space:nowrap;padding:.25em .8em;flex:none}
.explic p{margin:0;line-height:1.35;font-weight:600;min-width:0}

/* ========== GRAND ÉCRAN 1920 × 1080 ========== */
.tv{font-size:32px}
.tv .ecran{position:absolute;inset:0;padding:40px 56px 36px;display:grid;gap:24px 40px}
.tv .zone-guide{gap:34px}
.tv .zone-guide .guide{width:300px}
.tv .bulle-txt{font-size:32px;max-width:400px}
.tv .bandeau{grid-area:bandeau;display:flex;align-items:center;gap:32px}
.tv .tour{display:flex;align-items:center;gap:22px;font-size:54px;font-weight:800;background:#fff;color:var(--encre);border-radius:999px;padding:12px 40px 12px 24px}
.tv .tour .forme{font-size:64px}
.tv .tour span{font-weight:600}
.tv .progression{font-size:32px;font-weight:700;margin-left:auto;color:var(--accent)}
.tv .minuteur{width:130px;height:130px}
.tv .minuteur .chiffre{font-size:52px}
.tv .pied{grid-area:pied;display:flex;align-items:center;gap:32px}
.tv .pied .scores{flex:1}
.tv .scores{gap:12px}
.tv .puce{font-size:26px}
.tv .puce .forme{font-size:28px}
.tv .jokers{display:flex;gap:18px;justify-content:flex-end}
.tv .joker{font-size:28px}
.tv .cta{font-size:40px;padding:22px 56px}
.tv .secondaire{font-size:30px;padding:16px 36px}

.tv .ecran-question,.tv .ecran-reponse{grid-template-columns:420px 1fr;grid-template-rows:150px 1fr 120px;grid-template-areas:"bandeau bandeau" "guide corps" "pied pied"}
.tv .zone-guide{grid-area:guide}
.tv .corps{grid-area:corps;display:flex;flex-direction:column;justify-content:center;gap:40px;min-width:0}
.tv .q-texte{font-size:64px;font-weight:800;line-height:1.18;margin:0;text-wrap:balance}
.tv .choix-moyens,.tv .choix-grands-qcm{grid-template-columns:1fr 1fr}
.tv .choix-moyens .carte-choix{font-size:54px;padding:22px 32px;min-height:150px}
.tv .carte-choix .lettre{width:84px;height:84px;font-size:46px}
.tv .choix-petits{grid-template-columns:repeat(3,1fr);gap:40px}
.tv .choix-petits .carte-choix{font-size:50px;padding:28px 20px 30px;gap:20px}
.tv .choix-petits .illu{width:230px;height:230px}
.tv .ouverte{background:rgba(255,255,255,.1);border:4px dashed rgba(255,255,255,.6);border-radius:32px;padding:44px 52px;display:flex;flex-direction:column;align-items:flex-start;gap:22px}
.tv .ouverte .oral{font-size:54px;font-weight:800;margin:0;display:flex;align-items:center;gap:22px}
.tv .ouverte .oral svg{width:70px;height:70px}
.tv .ouverte .aide{font-size:32px;margin:0;line-height:1.35}
.tv .ecran-reponse .corps{gap:30px}
.tv .ecran-reponse .choix-moyens .carte-choix{min-height:112px;font-size:46px;padding:16px 28px}
.tv .ecran-reponse .choix-moyens .lettre{width:72px;height:72px;font-size:40px}
.tv .ecran-reponse .choix-petits .illu{width:150px;height:150px}
.tv .ecran-reponse .choix-petits .carte-choix{font-size:40px;padding:20px 16px 22px}
.tv .etiq{font-size:28px;top:-22px}
.tv .ecran-reponse .choix{gap:34px 24px}
.tv .explic{font-size:40px;padding:30px 40px}
.tv .verset{font-size:32px}
.tv .titre-rep{font-size:60px;font-weight:800;display:flex;align-items:center;gap:24px}
.tv .gain{background:var(--accent);color:var(--sur-accent);border-radius:999px;padding:6px 26px;font-size:44px;font-weight:800}
.tv .revele{background:var(--carte);color:var(--encre);border-radius:28px;padding:26px 40px;display:flex;align-items:center;gap:30px;flex-wrap:wrap}
.tv .revele .attendue{font-size:30px;font-weight:600}
.tv .revele strong{font-size:72px}
.tv .juge{display:flex;gap:20px;margin-left:auto}
.tv .juge button{font-size:30px;padding:16px 30px;border-radius:999px;font-weight:800;border:4px solid var(--encre);background:#fff;color:var(--encre)}
.tv .juge button.choisi{background:var(--encre);color:#fff}

/* Accueil TV */
.tv .ecran-accueil{grid-template-columns:480px 1fr;grid-template-rows:auto auto auto 1fr auto;grid-template-areas:"guide titre" "guide mode" "guide niv" "guide eq" "guide go";gap:26px 56px}
.tv .ac-titre{grid-area:titre}
.tv .ecran-accueil .zone-guide .guide,.tv .ecran-tour .zone-guide .guide,.tv .ecran-podium .zone-guide .guide{width:360px}
.tv .ac-titre h1{font-size:96px;margin:0;line-height:1;letter-spacing:-.01em}
.tv .ac-titre p{font-size:36px;margin:10px 0 0;color:var(--accent);font-weight:700}
.tv .ac-bloc h2{font-size:30px;margin:0 0 14px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;opacity:.9}
.tv .ac-mode{grid-area:mode}.tv .ac-niv{grid-area:niv}.tv .ac-eq{grid-area:eq}
.tv .ac-go{grid-area:go;justify-self:start}
.tv .seg-ligne{display:flex;gap:20px}
.tv .seg{flex:1;background:rgba(255,255,255,.1);border:4px solid rgba(255,255,255,.35);border-radius:24px;padding:16px 26px;text-align:left;font-size:36px;font-weight:800;color:#fff}
.tv .seg small{display:block;font-size:24px;font-weight:600;opacity:.9}
.seg[aria-pressed="true"]{background:#fff !important;color:var(--encre) !important;border-color:var(--accent) !important}
.tv .niv-carte .pastille{width:40px;height:40px}
.niv-carte{display:flex;align-items:center;gap:.6em}
.niv-carte .pastille{border-radius:50%;flex:none;border:3px solid #fff}
.tv .eq-grille{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.eq-champ{display:flex;align-items:center;gap:.5em;background:#fff;color:var(--encre);border-radius:18px;font-weight:700;min-width:0}
.eq-champ .nom{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-bottom:3px dotted #8B8698}
.eq-champ .retirer{background:none;border:0;color:#5A5468;font-weight:800}
.tv .eq-champ{font-size:32px;padding:14px 18px}
.tv .eq-champ .forme{font-size:36px}
.tv .eq-champ .retirer{font-size:32px}

/* Tour suivant TV */
.ecran-tour{background:var(--c);color:var(--e)}
.tv .ecran-tour{grid-template-columns:480px 1fr;grid-template-rows:1fr auto;grid-template-areas:"guide centre" "guide bas"}
.ecran-tour .centre{grid-area:centre;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-width:0}

.tv .ecran-tour .consigne{font-size:40px;font-weight:600;margin:24px 0 0}
.ecran-tour .bas{grid-area:bas;display:flex;align-items:center;gap:24px;justify-content:space-between}
.ecran-tour .puce{background:rgba(255,255,255,.88);color:var(--encre)}
.ecran-tour .puce.actif{background:var(--encre);color:#fff;border-color:var(--encre)}
.ecran-tour .cta{background:var(--encre);color:#fff}

/* Podium TV */
.tv .ecran-podium{grid-template-columns:440px 1fr;grid-template-rows:auto 1fr auto;grid-template-areas:"guide titre" "guide podium" "guide tous"}
.tv .po-titre{grid-area:titre;font-size:84px;font-weight:800;margin:0;line-height:1.2}
.podium{grid-area:podium;display:flex;align-items:flex-end;justify-content:center;gap:24px;min-width:0}
.marche{display:flex;flex-direction:column;align-items:center;text-align:center;flex:1;max-width:380px;min-width:0}
.marche .socle{width:100%;background:#fff;color:var(--encre);border-radius:24px 24px 0 0;display:flex;align-items:flex-start;justify-content:center;font-weight:800;border-top:14px solid var(--c)}
.marche .qui{display:flex;flex-direction:column;align-items:center;font-weight:800;margin-bottom:16px}
.tv .marche .qui .forme{font-size:90px;margin-bottom:12px}
.tv .marche .qui{font-size:42px}
.tv .marche .qui .pts{font-size:34px;color:var(--accent)}
.tv .marche .socle{font-size:90px;padding-top:12px}
.tv .m1 .socle{height:300px}.tv .m2 .socle{height:220px}.tv .m3 .socle{height:160px}
.tous{grid-area:tous;display:flex;align-items:center;gap:24px;flex-wrap:wrap}
.tv .tous p{font-size:32px;font-weight:700;margin:0}
.tous .puce{background:#fff;color:var(--encre)}
.tous .ruban{width:1em;height:1.15em;flex:none}
.confettis{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.ecran-podium > :not(.confettis){position:relative}
.confettis i{position:absolute;top:-40px;width:18px;height:28px;border-radius:4px;animation:tombe 4s linear infinite}
@keyframes tombe{from{transform:translateY(0) rotate(0)}to{transform:translateY(1200px) rotate(720deg)}}
.tel .confettis i{width:8px;height:12px}

.tel .po-titre{font-size:28px;font-weight:800;margin:0;line-height:1.1}
.tel .podium{gap:8px;flex:1}
.tel .marche .qui{font-size:15px;margin-bottom:8px}
.tel .marche .qui .forme{font-size:40px;margin-bottom:6px}
.tel .marche .qui .pts{font-size:15px;color:var(--accent)}
.tel .marche .socle{font-size:36px;padding-top:6px;border-radius:14px 14px 0 0;border-top-width:8px}
.tel .m1 .socle{height:130px}.tel .m2 .socle{height:96px}.tel .m3 .socle{height:70px}
.tel .tous{gap:6px}
.tel .tous p{font-size:15px;font-weight:700;margin:0;width:100%}

/* ====== COMPOSANT GUIDE (identique dans guides.html) ====== */
.guide{--bouche:0;display:block}
.guide svg{display:block;width:100%;height:auto;overflow:visible}
.guide .corps-anim{transform-box:view-box;transform-origin:100px 270px;animation:g-balance 4.2s ease-in-out infinite}
.guide .tete{transform-box:view-box;transform-origin:100px 72px;transition:transform .5s ease}
.guide .tete-voix{transform-box:view-box;transform-origin:100px 72px;transform:translateY(calc(var(--bouche,0) * -1.2px)) rotate(calc(var(--bouche,0) * -1.5deg));transition:transform 80ms linear}
.guide .yeux{transform-box:fill-box;transform-origin:center;animation:g-cligne 4.8s infinite}
.guide .pupilles{transition:transform .4s}
.guide .sourcils{transition:transform .4s}
.guide .bras-g,.guide .bras-d{transform-box:fill-box;transform-origin:50% 5%;transition:transform .45s cubic-bezier(.3,1.4,.5,1)}
.guide .yeux-joie,.guide .bouche-parle,.guide .bouche-joie,.guide .etincelles,.guide .bulle{display:none}
.guide .bouche-parle{transform-box:fill-box;transform-origin:50% 0;transform:scale(calc(.85 + var(--bouche,0) * .2),calc(.1 + var(--bouche,0) * .9));transition:transform 70ms linear}
.guide.parle .bouche-repos,.guide.parle .bouche-joie{display:none}
.guide.parle .bouche-parle{display:inline}
.guide.joie .yeux{display:none}
.guide.joie .yeux-joie{display:inline}
.guide.joie:not(.parle) .bouche-repos{display:none}
.guide.joie:not(.parle) .bouche-joie{display:inline}
.guide.joie .corps-anim{animation:g-saut .8s cubic-bezier(.3,0,.4,1) infinite}
.guide.joie .bras-g{transform:rotate(150deg)}
.guide.joie .bras-d{transform:rotate(-150deg)}
.guide.joie .etincelles{display:inline}
.guide.joie .etincelles path{transform-box:fill-box;transform-origin:center;animation:g-scintille .5s ease-in-out infinite alternate}
.guide.joie .etincelles path:nth-child(2){animation-delay:.2s}
.guide.joie .etincelles path:nth-child(3){animation-delay:.35s}
.guide.encourage .tete{transform:rotate(-6deg)}
.guide.encourage .sourcils{transform:translateY(-1.5px)}
.guide.encourage .bras-d{animation:g-geste 1.6s ease-in-out infinite alternate}
.guide.encourage .corps-anim{animation-duration:6s}
.guide.attente .bulle{display:inline}
.guide.attente .tete{transform:rotate(5deg)}
.guide.attente .pupilles{animation:g-regarde 3.2s ease-in-out infinite}
.guide.attente .bulle .pt{animation:g-points 1.2s infinite}
.guide.attente .bulle .pt:nth-of-type(2){animation-delay:.2s}
.guide.attente .bulle .pt:nth-of-type(3){animation-delay:.4s}
@keyframes g-balance{0%,100%{transform:rotate(-1.5deg)}50%{transform:rotate(1.5deg)}}
@keyframes g-cligne{0%,93%,100%{transform:scaleY(1)}95.5%{transform:scaleY(.1)}}
@keyframes g-saut{0%{transform:translateY(0) scale(1.05,.95)}35%{transform:translateY(-30px) scale(.97,1.03)}55%{transform:translateY(-36px) scale(1,1)}85%{transform:translateY(0) scale(1.03,.97)}100%{transform:translateY(0) scale(1.05,.95)}}
@keyframes g-geste{from{transform:rotate(-26deg)}to{transform:rotate(-48deg)}}
@keyframes g-regarde{0%,100%{transform:translateX(0)}25%{transform:translateX(-1.6px)}60%{transform:translateX(1.6px)}}
@keyframes g-points{0%,60%,100%{opacity:.25}30%{opacity:1}}
@keyframes g-scintille{from{transform:scale(.6);opacity:.55}to{transform:scale(1.15);opacity:1}}
@media (prefers-reduced-motion:reduce){.guide .corps-anim,.guide.joie .corps-anim,.guide .etincelles path,.guide.encourage .bras-d,.guide .pupilles,.confettis i{animation:none!important}}
/* ====== fin du composant ====== */

/* ====== THÈME « papier chaud » (Léa, 14/11/2026) : couche finale sur la scène ====== */
#scene{--encre:#241C30;--papier:#FBF6EC;--carte:#FFFFFF;--filet:#E3D8C6;--accent:var(--niv);--sur-accent:#FFFFFF;
  color:var(--encre);font-family:'Segoe UI Variable Display','Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
  background:radial-gradient(circle 600px at 0 100%,var(--niv-clair) 99.5%,transparent 100%),radial-gradient(circle 240px at 100% 0,var(--niv-clair) 99%,transparent 100%),var(--papier)}
#scene.tel{background:radial-gradient(circle 150px at 100% 0,var(--niv-clair) 99%,transparent 100%),radial-gradient(circle 120px at 0 100%,var(--niv-clair) 99%,transparent 100%),var(--papier)}
#scene.niv-petits{--niv:#1B7A44;--niv-clair:#DCEFDD;--vif:#FFC93C}
#scene.niv-moyens{--niv:#2563C9;--niv-clair:#DCE7FA;--vif:#FFA62B}
#scene.niv-grands{--niv:#7A3FA8;--niv-clair:#ECE1F5;--vif:#3DD6C4}
#scene .niv-carte .pastille{border-color:var(--encre)}
/* Bulle de Joël */
#scene .bulle-txt{border:3px solid var(--encre);box-shadow:none}
#scene .bulle-txt::before{content:"";position:absolute;left:50%;bottom:-24px;margin-left:-17px;border:17px solid transparent;border-top:22px solid var(--encre);border-bottom:0}
#scene.tel .bulle-txt::before{left:-19px;bottom:13px;margin:0;border:12px solid transparent;border-right:18px solid var(--encre);border-left:0}
/* Relief commun : bord encre et ombre pleine décalée, comme un autocollant */
#scene .tour,#scene .carte-choix,#scene .cta,#scene .joker,#scene .eq-champ,#scene .revele,#scene .explic,#scene .marche .socle,#scene .juge button{border:3px solid var(--encre)}
#scene.tv .carte-choix{border-width:4px;box-shadow:0 8px 0 var(--encre)}
#scene.tel .carte-choix{box-shadow:0 4px 0 var(--encre)}
#scene .tour{box-shadow:0 5px 0 var(--encre)}
#scene.tel .tour{box-shadow:0 3px 0 var(--encre)}
#scene .carte-choix{transition:transform .12s ease,box-shadow .12s ease}
#scene .carte-choix[data-act]:hover{transform:translateY(-3px)}
#scene .carte-choix[data-act]:active{transform:translateY(5px);box-shadow:0 2px 0 var(--encre)}
#scene .carte-choix.bonne{border-color:var(--ok);background:var(--ok-clair);box-shadow:0 6px 0 var(--ok)}
#scene .carte-choix.choisie-ko{border:3px dashed var(--encre);outline:none;background:#F3ECE0;box-shadow:none}
#scene .carte-choix.eteinte{opacity:.45;box-shadow:none}
#scene .carte-choix .lettre{border:3px solid var(--encre)}
#scene .q-texte,#scene .ac-titre h1,#scene .po-titre,#scene .titre-rep,#scene .nom-eq{letter-spacing:-.015em}
/* Minuteur */
#scene .minuteur svg circle:first-child{fill:#FFFFFF;stroke:var(--filet)}
#scene .minuteur .chiffre{color:var(--encre)}
#scene .minuteur{border-radius:50%;box-shadow:0 0 0 3px var(--encre)}
/* Scores */
#scene .puce{background:#FFFFFF;color:var(--encre);border:2.5px solid var(--filet)}
#scene .puce.actif{background:var(--niv);color:#FFFFFF;border-color:var(--encre);box-shadow:0 4px 0 var(--encre)}
/* Boutons */
#scene .cta{background:var(--vif);color:var(--encre);box-shadow:0 6px 0 var(--encre)}
#scene.tel .cta{box-shadow:0 4px 0 var(--encre)}
#scene .cta:active{transform:translateY(4px);box-shadow:0 2px 0 var(--encre)}
#scene .secondaire{background:#FFFFFF;color:var(--encre);border:3px solid var(--encre)}
#scene .joker{background:#FFFFFF;color:var(--encre);box-shadow:0 4px 0 var(--encre)}
#scene .joker .j-ico{background:var(--niv-clair);color:var(--encre);border:2px solid var(--encre)}
#scene .joker[disabled]{opacity:.55;box-shadow:none;border-style:dashed}
#scene .ouverte{background:#FFFFFF;border:3px dashed var(--encre)}
#scene .ouverte .oral{color:var(--niv)}
/* Réponse */
#scene .gain{background:var(--vif);color:var(--encre);border:3px solid var(--encre)}
#scene .explic{border-left:16px solid var(--niv)}
#scene.tel .explic{border-left-width:8px}
#scene .juge button.choisi{background:var(--encre);color:#FFFFFF}
/* Accueil */
#scene .ac-titre h1{display:inline;background:linear-gradient(transparent 64%,var(--vif) 64%,var(--vif) 90%,transparent 90%)}
#scene .ac-titre p{color:var(--niv)}
#scene .ac-bloc h2{color:var(--encre);opacity:.8}
#scene .seg{background:#FFFFFF;color:var(--encre);border:3px solid var(--filet)}
#scene .seg[aria-pressed="true"]{background:var(--niv)!important;color:#FFFFFF!important;border-color:var(--encre)!important;box-shadow:0 4px 0 var(--encre)}
#scene .seg[aria-pressed="true"] .pastille{border-color:#FFFFFF}
#scene .eq-champ{box-shadow:0 4px 0 var(--encre)}
#scene .eq-champ.inactive{opacity:.55;background:#F3ECE0;border-style:dashed;box-shadow:none}
#scene .eq-champ .nom{border-bottom:none}
#scene .bulle-court{color:var(--encre)}
/* Tour suivant : la couleur de l'équipe reste le fond */
#scene .ecran-tour .puce{background:#FFFFFF;color:var(--encre);border-color:var(--encre)}
#scene .ecran-tour .puce.actif{background:var(--encre);color:#FFFFFF}
#scene .ecran-tour .cta{background:#FFFFFF;color:var(--encre)}
#scene .ecran-tour .centre .forme{background:#FFFFFF;border-radius:50%;padding:.14em;box-shadow:0 0 0 4px var(--encre),0 8px 0 4px var(--encre)}
/* Podium */
#scene .marche .socle{border-top:16px solid var(--c);box-shadow:0 6px 0 var(--encre)}
#scene .marche .qui .pts{color:var(--niv)}
#scene .tous .puce{border-color:var(--encre)}
/* Focus visible sur fond clair */
#scene .carte-choix:focus-visible,#scene .cta:focus-visible,#scene .seg:focus-visible,#scene .joker:focus-visible,#scene .eq-champ:focus-visible{outline:4px solid var(--niv);outline-offset:5px}
/* Grand écran : accueil resserré (nombre d'équipes) */
#scene.tv .ecran-accueil{gap:12px 56px;padding-block:30px}
#scene.tv .ac-titre h1{font-size:80px}
#scene.tv .ac-titre p{font-size:30px;margin-top:6px}
#scene.tv .ac-bloc h2{font-size:24px;margin-bottom:8px}
#scene.tv .ecran-accueil .seg{font-size:28px;padding:8px 20px}
#scene.tv .ecran-accueil .seg small{font-size:20px}
#scene.tv .eq-champ{font-size:28px;padding:10px 16px}
#scene.tv .eq-grille{gap:12px}
#scene.tv .ac-go{font-size:36px;padding:16px 48px}
#scene.tv .ecran-accueil .zone-guide .guide{width:300px}
/* Grand écran : la zone centrale ne pousse jamais le pied hors de l'écran (mesuré sur les textes les plus longs de la banque) */
#scene.tv .ecran-question,#scene.tv .ecran-reponse{grid-template-rows:150px minmax(0,1fr) 120px}
#scene.tv .corps{min-height:0;gap:26px}
#scene.tv .q-texte{font-size:54px;line-height:1.15}
#scene.tv .choix-moyens .carte-choix{font-size:42px;min-height:118px;padding:16px 26px}
#scene.tv .carte-choix .lettre{width:72px;height:72px;font-size:38px}
#scene.tv .choix-petits .illu{width:200px;height:200px}
#scene.tv .choix-petits .carte-choix{font-size:44px;padding:22px 16px 24px;gap:14px}
#scene.tv .joker{font-size:24px}
#scene.tv .ecran-reponse .corps{gap:16px}
#scene.tv .titre-rep{font-size:46px}
#scene.tv .ecran-reponse .choix-moyens .carte-choix{min-height:86px;font-size:36px;padding:12px 24px}
#scene.tv .ecran-reponse .choix-moyens .lettre{width:58px;height:58px;font-size:30px}
#scene.tv .ecran-reponse .choix-petits .illu{width:130px;height:130px}
#scene.tv .ecran-reponse .choix-petits .carte-choix{font-size:34px;padding:16px 12px 18px}
#scene.tv .explic{font-size:28px;padding:18px 28px}
#scene.tv .verset{font-size:26px}
#scene.tv .revele{padding:16px 26px;gap:14px 24px}
#scene.tv .revele strong{font-size:30px;line-height:1.25}
#scene.tv .juge button{font-size:26px;padding:12px 24px}
#scene.tv .juge-min{font-size:22px}
#scene.tv .ouverte{padding:28px 40px;gap:16px}
#scene.tv .ouverte .oral{font-size:44px}
#scene.tv .ouverte .aide{font-size:28px}
#scene.tv .po-titre{line-height:1.25}
/* Téléphone : accueil tenu dans 375 × 812, niveaux sur une ligne de quatre */
#scene.tel .ecran-accueil{gap:7px;padding-top:10px}
#scene.tel .ac-titre h1{font-size:28px}
#scene.tel .ac-titre p{font-size:14px}
#scene.tel .ecran-accueil .seg{padding:5px 8px;min-width:0}

#scene.tel .ac-niv .seg{padding:6px 4px;font-size:14px;text-align:center}
#scene.tel .ac-niv .seg small{font-size:11px}
#scene.tel .ac-niv .niv-carte{justify-content:center}
#scene.tel .ac-niv .pastille{display:none}
#scene.tel .eq-champ{padding:6px 9px}
#scene.tel .ac-go{padding:12px 20px}
/* Téléphone : une explication longue défile dans sa zone au lieu de passer sous le bouton */
#scene.tel .ecran-reponse .corps{overflow-y:auto;overscroll-behavior:contain}
#scene.tel .explic{font-size:15px}
/* Téléphone : la question la plus longue (4 choix longs, 6 équipes, minuteur) tient sans toucher aux jokers */
#scene.tel .q-texte{font-size:20px;line-height:1.2}
#scene.tel .choix-moyens .carte-choix{font-size:18px;min-height:50px;padding:6px 10px;line-height:1.2}

/* Place réservée aux boutons Réécouter et Son du jeu, fixés en haut à droite */
#scene.tv .bandeau{padding-right:112px}

/* ---------- Ajouts du jeu (au-dessus de la maquette de Léa) ---------- */
#commandes{position:fixed;right:calc(12px + env(safe-area-inset-right,0px));top:calc(12px + env(safe-area-inset-top,0px));z-index:20;display:flex;gap:8px}

#commandes button{background:#FFFFFF;color:#241C30;border:3px solid #241C30}

</style>

<script>
(function(){
'use strict';
var DONNEES={"questions":[{"id":"p01","niveau":"petits","type":"qcm","question":"Qui a construit une grande arche pour sauver sa famille et les animaux ?","choix":["David","Noé","Pierre"],"bonne":1,"explication":"C'est Noé ! Jéhovah lui a dit : « Fais-toi une arche en bois. » Noé a obéi, et sa famille a été sauvée. Genèse chapitre 6, verset 14.","reference":"Genèse 6:14","source":"https://wol.jw.org/fr/wol/b/r30/lp-f/nwtsty/1/6","origine":"instructeur"},{"id":"p02","niveau":"petits","type":"qcm","question":"Combien de personnes sont entrées dans l'arche ?","choix":["Huit","Deux","Vingt"],"bonne":0,"explication":"Huit personnes : Noé, sa femme, leurs trois fils et les trois femmes de leurs fils. Genèse chapitre 7, verset 13.","reference":"Genèse 7:13","source":"https://wol.jw.org/fr/wol/b/r30/lp-f/nwtsty/1/7","origine":"instructeur"},{"id":"p03","niveau":"petits","type":"qcm","question":"Après le déluge, quel beau signe Jéhovah a-t-il mis dans le nuage ?","choix":["Une étoile","La lune","Un arc-en-ciel"],"bonne":2,"explication":"Un arc-en-ciel ! C'est le signe de la promesse que Jéhovah a faite à la terre. Genèse chapitre 9, verset 13.","reference":"Genèse 9:13","source":"https://wol.jw.org/fr/wol/b/r30/lp-f/nwtsty/1/9","origine":"instructeur"},{"id":"p04","niveau":"petits","type":"qcm","question":"Dans la Bible, qui était le grand frère jaloux d'Abel ?","choix":["Caïn","Moïse"],"bonne":0,"explication":"Caïn. Il a laissé la jalousie grandir dans son cœur. La Bible nous demande de ne pas être comme Caïn, mais de nous aimer les uns les autres. Première lettre de Jean, chapitre 3, versets 11 et 12.","reference":"1 Jean 3:11, 12","source":"https://wol.jw.org/fr/wol/b/r30/lp-f/nwtsty/62/3","origine":"president"},{"id":"p05","niveau":"petits","type":"qcm","question":"Dans la ville de Jéricho, une femme a caché deux espions envoyés par Josué. Comment s'appelait-elle ?","choix":["Ruth","Rahab","Marie"],"bonne":1,"explication":"C'est Rahab. Elle avait confiance en Jéhovah, et elle a été sauvée avec toute sa famille. Josué chapitre 6, verset 25.","reference":"Josué 6:25","source":"https://wol.jw.org/fr/wol/b/r30/lp-f/nwtsty/6/6","origine":"president"},{"id":"p06","niveau":"petits","type":"qcm","question":"Qu'est-ce que Rahab a attaché à sa fenêtre pour que sa famille soit protégée ?","choix":["Un drapeau blanc","Une lampe","Un cordon rouge"],"bonne":2,"explication":"Un cordon de fil écarlate, c'est-à-dire rouge vif. C'était le signe convenu avec les espions. Josué chapitre 2, verset 18.","reference":"Josué 2:18","source":"https://wol.jw.org/fr/wol/b/r30/lp-f/nwtsty/6/2","origine":"instructeur"},{"id":"p07","niveau":"petits","type":"qcm","question":"Selon la Bible, quel homme a reçu de Jéhovah une force extraordinaire ?","choix":["Samson","Jonas","Zachée"],"bonne":0,"explication":"C'est Samson ! Une nuit, il a arraché les grandes portes d'une ville et il les a portées sur ses épaules jusqu'en haut d'une montagne. Juges chapitre 16, verset 3.","reference":"Juges 16:3","source":"https://wol.jw.org/fr/wol/b/r30/lp-f/nwtsty/7/16","origine":"president"},{"id":"p08","niveau":"petits","type":"qcm","question":"Samson avait fait une promesse à Jéhovah. Qu'est-ce qu'il ne devait jamais couper ?","choix":["Ses sourcils","Ses cheveux"],"bonne":1,"explication":"Ses cheveux. Samson a dit : « Le rasoir n'est jamais passé sur ma tête. » C'était sa promesse à Jéhovah. Juges chapitre 16, verset 17.","reference":"Juges 16:17","source":"https://wol.jw.org/fr/wol/b/r30/lp-f/nwtsty/7/16","origine":"instructeur"},{"id":"p09","niveau":"petits","type":"qcm","question":"Qu'est-ce que Jacob a fait faire pour son fils Joseph ?","choix":["Une petite maison","Un beau et long vêtement","Un bateau"],"bonne":1,"explication":"Un beau et long vêtement. Jacob aimait beaucoup Joseph. Genèse chapitre 37, verset 3.","reference":"Genèse 37:3","source":"https://wol.jw.org/fr/wol/b/r30/lp-f/nwtsty/1/37","origine":"instructeur"},{"id":"p10","niveau":"petits","type":"qcm","question":"Zacharie et Élisabeth étaient très vieux, et Jéhovah leur a donné un bébé. Comment s'appelait-il ?","choix":["Samuel","Jonas","Jean"],"bonne":2,"explication":"Jean ! L'ange a dit à Zacharie : « Ta femme, Élisabeth, te donnera un fils, et tu devras l'appeler Jean. » Plus tard, il a préparé le chemin de Jésus. Luc chapitre 1, verset 13.","reference":"Luc 1:13","source":"https://wol.jw.org/fr/wol/b/r30/lp-f/nwtsty/42/1","origine":"president"},{"id":"p11","niveau":"petits","type":"qcm","question":"Que mangeait Jean le Baptiseur dans le désert ?","choix":["Des gâteaux et du lait","Des criquets et du miel sauvage","Du riz et du poisson"],"bonne":1,"explication":"Des criquets et du miel sauvage ! Il portait aussi un vêtement en poil de chameau. Matthieu chapitre 3, verset 4.","reference":"Matthieu 3:4","source":"https://wol.jw.org/fr/wol/b/r30/lp-f/nwt/40/3","origine":"instructeur"},{"id":"p12","niveau":"petits","type":"qcm","question":"Où Marie a-t-elle couché le bébé Jésus ?","choix":["Dans une mangeoire","Dans un berceau en or","Dans une barque"],"bonne":0,"explication":"Dans une mangeoire, l'endroit où mangent les animaux, parce qu'il n'y avait pas de place pour eux dans la salle prévue pour les voyageurs. Luc chapitre 2, verset 7.","reference":"Luc 2:7","source":"https://wol.jw.org/fr/wol/b/r30/lp-f/nwtsty/42/2","origine":"instructeur"},{"id":"p13","niveau":"petits","type":"qcm","question":"Qui a élevé Jésus avec Marie, comme un papa ?","choix":["Abraham","Joseph","Pierre"],"bonne":1,"explication":"C'est Joseph, le charpentier. Jésus est le Fils de Dieu, et Joseph a été son père adoptif : il l'a élevé avec amour. Luc chapitre 3, verset 23.","reference":"Luc 3:23","source":"https://wol.jw.org/fr/wol/d/r30/lp-f/1001070647","origine":"president"},{"id":"p14","niveau":"petits","type":"qcm","question":"Combien d'apôtres Jésus a-t-il choisis ?","choix":["Trois","Cent","Douze"],"bonne":2,"explication":"Douze apôtres. Matthieu chapitre 10, versets 2 à 4.","reference":"Matthieu 10:2-4","source":"https://wol.jw.org/fr/wol/b/r30/lp-f/nwtsty/40/10","origine":"president"},{"id":"p15","niveau":"petits","type":"qcm","question":"Jésus a dit à Pierre : « Nourris mes petites brebis. » De qui parlait-il ?","choix":["De vrais moutons","De ceux qui le suivaient"],"bonne":1,"explication":"De ses disciples, ceux qui suivaient Jésus ! Il demandait à Pierre de prendre soin d'eux et de les nourrir de la Parole de Dieu. Jean chapitre 21, verset 17.","reference":"Jean 21:17","source":"https://wol.jw.org/fr/wol/d/r30/lp-f/1001070689","origine":"president","exclut":["g22"]},{"id":"p16","niveau":"petits","type":"qcm","question":"Qu'est-ce qui a avalé Jonas ?","choix":["Un énorme poisson","Un lion","Un aigle"],"bonne":0,"explication":"Un énorme poisson envoyé par Jéhovah. Jonas est resté trois jours et trois nuits dans son ventre, puis il s'est retrouvé sain et sauf sur la terre ferme. Jonas chapitre 1, verset 17.","reference":"Jonas 1:17 ; 2:10","source":"https://wol.jw.org/fr/wol/b/r30/lp-f/nwtsty/32/1","origine":"instructeur"},{"id":"p17","niveau":"petits","type":"qcm","question":"Qui a fermé la gueule des lions pour protéger Daniel ?","choix":["Le roi","Un ange de Jéhovah","Un soldat"],"bonne":1,"explication":"Un ange de Jéhovah ! Daniel a dit au roi : « Mon Dieu a envoyé son ange et a fermé la gueule des lions. » Daniel chapitre 6, verset 22.","reference":"Daniel 6:22","source":"https://wol.jw.org/fr/wol/b/r30/lp-f/nwtsty/27/6","origine":"instructeur"},{"id":"p18","niveau":"petits","type":"qcm","question":"Où la maman de Moïse a-t-elle déposé son bébé pour le protéger ?","choix":["Dans une grotte","Sur un chameau","Dans une corbeille au bord du Nil"],"bonne":2,"explication":"Dans une corbeille en papyrus, au milieu des roseaux, au bord du Nil. Et sa grande sœur surveillait de loin. Exode chapitre 2, versets 3 et 4.","reference":"Exode 2:3, 4","source":"https://wol.jw.org/fr/wol/b/r30/lp-f/nwtsty/2/2","origine":"instructeur"},{"id":"p19","niveau":"petits","type":"qcm","question":"Ruth a dit à Noémi : « Ton Dieu sera mon Dieu. » Qu'a fait Ruth ?","choix":["Elle est restée avec Noémi","Elle est partie loin d'elle"],"bonne":0,"explication":"Ruth est restée avec Noémi, sa belle-mère, pour l'aider et pour servir Jéhovah avec elle. Ruth chapitre 1, verset 16.","reference":"Ruth 1:16","source":"https://wol.jw.org/fr/wol/b/r30/lp-f/nwtsty/8/1","origine":"president"},{"id":"p20","niveau":"petits","type":"qcm","question":"Zachée était petit. Où est-il monté pour voir Jésus ?","choix":["Sur un chameau","Dans un arbre","Sur un toit"],"bonne":1,"explication":"Dans un arbre, un sycomore. Et Jésus l'a appelé par son nom ! Luc chapitre 19, versets 4 et 5.","reference":"Luc 19:4, 5","source":"https://wol.jw.org/fr/wol/b/r30/lp-f/nwtsty/42/19","origine":"instructeur"},{"id":"p21","niveau":"petits","type":"qcm","question":"Pendant un mariage, en quoi Jésus a-t-il changé de l'eau ?","choix":["En lait","En jus de fruit","En vin"],"bonne":2,"explication":"En vin ! C'était son premier miracle, à Cana. Jean chapitre 2, verset 9.","reference":"Jean 2:9","source":"https://wol.jw.org/fr/wol/b/r30/lp-f/nwt/43/2","origine":"instructeur"},{"id":"p22","niveau":"petits","type":"qcm","question":"Qui a donné un nom à tous les animaux ?","choix":["Noé","Adam","Moïse"],"bonne":1,"explication":"C'est Adam, le premier homme. Jéhovah lui amenait les animaux, et chaque animal recevait le nom qu'Adam lui donnait. Genèse chapitre 2, verset 19.","reference":"Genèse 2:19","source":"https://wol.jw.org/fr/wol/b/r30/lp-f/nwtsty/1/2","origine":"instructeur"},{"id":"m01","niveau":"moyens","type":"qcm","question":"Qui a été le premier meurtrier de l'histoire humaine ?","choix":["Abel","Lamek","Caïn","Noé"],"bonne":2,"explication":"C'est Caïn. Il a laissé la jalousie le dominer et il a tué son frère Abel. La Bible le donne en exemple à ne pas suivre. Genèse chapitre 4, verset 8, et Première lettre de Jean, chapitre 3, verset 12.","reference":"Genèse 4:8 ; 1 Jean 3:12","source":"https://wol.jw.org/fr/wol/d/r30/lp-f/1200000857","origine":"president"},{"id":"m02","niveau":"moyens","type":"qcm","question":"Comment s'appelait la femme cananéenne de Jéricho qui a été épargnée avec sa famille ?","choix":["Dalila","Rahab","Ruth","Noémi"],"bonne":1,"explication":"Rahab. Elle avait caché les espions de Josué, et Jéhovah l'a protégée. Elle est même devenue une ancêtre de Jésus. Josué chapitre 6, verset 25, et Matthieu chapitre 1, verset 5.","reference":"Josué 6:25 ; Matthieu 1:5","source":"https://wol.jw.org/fr/wol/b/r30/lp-f/nwtsty/6/6","origine":"president"},{"id":"m03","niveau":"moyens","type":"qcm","question":"Qui était Ruth pour Noémi ?","choix":["Sa sœur","Sa voisine","Sa belle-fille","Sa cousine"],"bonne":2,"explication":"Sa belle-fille. Ruth, qui venait du pays de Moab, avait épousé un fils de Noémi. Devenue veuve, elle est restée fidèle à Noémi et à Jéhovah. Ruth chapitre 1, versets 4 et 16.","reference":"Ruth 1:4, 16","source":"https://wol.jw.org/fr/wol/b/r30/lp-f/nwtsty/8/1","origine":"president"},{"id":"m04","niveau":"moyens","type":"qcm","question":"Ruth s'est mariée avec Boaz. Quel roi célèbre est leur arrière-petit-fils ?","choix":["David","Saül","Salomon","Sédécias"],"bonne":0,"explication":"Le roi David. Ruth et Boaz ont eu un fils, Obed. Obed est le père de Jessé, et Jessé est le père de David. Ruth chapitre 4, versets 13 et 17.","reference":"Ruth 4:13, 17","source":"https://wol.jw.org/fr/wol/b/r30/lp-f/nwtsty/8/4","origine":"instructeur"},{"id":"m05","niveau":"moyens","type":"qcm","question":"On dit souvent de lui qu'il est l'homme le plus fort qui ait jamais vécu. Qui est-ce ?","choix":["Goliath","David","Saül","Samson"],"bonne":3,"explication":"Samson. Sa force ne venait pas de ses muscles, mais de Jéhovah : à la fin de sa vie, il a encore supplié Jéhovah de le fortifier. Juges chapitre 16, verset 28.","reference":"Juges 16:28","source":"https://wol.jw.org/fr/wol/d/r30/lp-f/2005206","origine":"president"},{"id":"m06","niveau":"moyens","type":"qcm","question":"Quand on parle des ancêtres du peuple d'Israël, quels trois noms dit-on toujours ensemble ?","choix":["Adam, Noé et Moïse","Moïse, Aaron et Josué","David, Salomon et Sédécias","Abraham, Isaac et Jacob"],"bonne":3,"explication":"Abraham, Isaac et Jacob. Jéhovah s'est présenté à Moïse ainsi : « Je suis le Dieu d'Abraham, le Dieu d'Isaac et le Dieu de Jacob. » Exode chapitre 3, verset 6.","reference":"Exode 3:6","source":"https://wol.jw.org/fr/wol/b/r30/lp-f/nwtsty/2/3","origine":"president"},{"id":"m07","niveau":"moyens","type":"qcm","question":"Pourquoi les noms des douze fils de Jacob sont-ils restés dans l'histoire du peuple ?","choix":["Parce qu'ils étaient tous prophètes","Parce que leurs familles sont devenues les douze tribus d'Israël","Parce qu'ils ont construit le temple","Parce qu'ils ont tous été rois"],"bonne":1,"explication":"Leurs descendants sont devenus les douze tribus d'Israël. Genèse chapitre 49, verset 28. Et dans la Révélation, les noms des douze tribus sont inscrits sur les portes de la ville sainte. Révélation chapitre 21, verset 12.","reference":"Genèse 49:28 ; Révélation 21:12","source":"https://wol.jw.org/fr/wol/b/r30/lp-f/nwtsty/1/49","origine":"president"},{"id":"m08","niveau":"moyens","type":"qcm","question":"Comment s'appelait le père adoptif de Jésus ?","choix":["Zacharie","Lazare","Jacques","Joseph"],"bonne":3,"explication":"Joseph. Jésus a été conçu par l'esprit saint, mais Joseph l'a élevé avec Marie. C'est pourquoi les gens disaient que Jésus était « fils de Joseph ». Luc chapitre 3, verset 23.","reference":"Luc 3:23","source":"https://wol.jw.org/fr/wol/d/r30/lp-f/1001070647","origine":"president"},{"id":"m09","niveau":"moyens","type":"qcm","question":"Sa mère était trop âgée pour avoir des enfants, et il est venu au monde pour préparer la venue du Messie. Qui est-ce ?","choix":["Isaac","Jean le Baptiseur","Samuel","L'apôtre Jean"],"bonne":1,"explication":"Jean le Baptiseur. Ses parents, Zacharie et Élisabeth, étaient très âgés. Isaac aussi est né d'une mère âgée, Sara, mais c'est Jean qui a préparé la venue du Messie. Luc chapitre 1, versets 7 et 17.","reference":"Luc 1:7, 17","source":"https://wol.jw.org/fr/wol/b/r30/lp-f/nwtsty/42/1","origine":"president"},{"id":"m10","niveau":"moyens","type":"qcm","question":"Après la trahison de Judas, il restait onze apôtres. Qui a été choisi pour devenir le douzième ?","choix":["Paul","Barnabé","Matthias","Étienne"],"bonne":2,"explication":"Matthias. Les disciples ont tiré au sort, et Matthias a été ajouté aux onze apôtres. Actes chapitre 1, verset 26.","reference":"Actes 1:26","source":"https://wol.jw.org/fr/wol/b/r30/lp-f/nwtsty/44/1","origine":"president"},{"id":"m11","niveau":"moyens","type":"qcm","question":"Après sa résurrection, pendant combien de jours Jésus s'est-il montré à ses disciples ?","choix":["Quarante jours","Trois jours","Sept jours","Cinquante jours"],"bonne":0,"explication":"Pendant quarante jours. Il leur a donné des preuves convaincantes qu'il était vivant, et il leur parlait du royaume de Dieu. Actes chapitre 1, verset 3.","reference":"Actes 1:3","source":"https://wol.jw.org/fr/wol/b/r30/lp-f/nwtsty/44/1","origine":"president"},{"id":"m12","niveau":"moyens","type":"qcm","question":"À quel apôtre Jésus ressuscité a-t-il dit : « Nourris mes petites brebis » ?","choix":["Jean","Thomas","André","Pierre"],"bonne":3,"explication":"À Pierre. Avec d'autres frères dignes de confiance, Pierre allait nourrir, fortifier et conduire les disciples de Jésus. Jean chapitre 21, versets 15 à 17.","reference":"Jean 21:15-17","source":"https://wol.jw.org/fr/wol/d/r30/lp-f/1001070689","origine":"president","exclut":["g22"]},{"id":"m13","niveau":"moyens","type":"qcm","question":"Quel apôtre a vécu très vieux et a probablement été le dernier apôtre à mourir ?","choix":["Pierre","Jean","Jacques","Matthieu"],"bonne":1,"explication":"Jean. Après la résurrection de Jésus, il a encore servi Dieu fidèlement pendant près de soixante-dix ans, et c'est sur l'île de Patmos qu'il a reçu la Révélation.","reference":"Jean 21:22","source":"https://wol.jw.org/fr/wol/d/r30/lp-f/1001070689","origine":"president"},{"id":"m14","niveau":"moyens","type":"qcm","question":"Comment Jéhovah a-t-il ouvert un chemin dans la mer pour les Israélites ?","choix":["Avec un grand pont","Avec des bateaux","Par un fort vent d'est qui a fait reculer la mer","En gelant l'eau"],"bonne":2,"explication":"Jéhovah a fait reculer la mer par un fort vent d'est toute la nuit, et les Israélites ont traversé sur un sol ferme. Exode chapitre 14, versets 21 et 22.","reference":"Exode 14:21, 22","source":"https://wol.jw.org/fr/wol/b/r30/lp-f/nwtsty/2/14","origine":"instructeur"},{"id":"m15","niveau":"moyens","type":"qcm","question":"D'après les âges donnés dans la Bible, qui a vécu le plus longtemps ?","choix":["Mathusalem","Adam","Noé","Abraham"],"bonne":0,"explication":"Mathusalem, qui a vécu neuf cent soixante-neuf ans ! Genèse chapitre 5, verset 27.","reference":"Genèse 5:27","source":"https://wol.jw.org/fr/wol/b/r30/lp-f/nwtsty/1/5","origine":"instructeur"},{"id":"m16","niveau":"moyens","type":"qcm","question":"Près de la rivière, qui apportait à manger au prophète Élie ?","choix":["Des colombes","Des corbeaux","Des soldats","Des bergers"],"bonne":1,"explication":"Des corbeaux ! Tous les matins et tous les soirs, ils lui apportaient du pain et de la viande. Premier livre des Rois, chapitre 17, verset 6.","reference":"1 Rois 17:6","source":"https://wol.jw.org/fr/wol/b/r30/lp-f/nwtsty/11/17","origine":"instructeur"},{"id":"m17","niveau":"moyens","type":"qcm","question":"Jésus avait douze ans. Où ses parents l'ont-ils retrouvé au bout de trois jours ?","choix":["Au marché","Chez des amis","Au bord du lac","Dans le Temple, au milieu des enseignants"],"bonne":3,"explication":"Dans le Temple, assis au milieu des enseignants : il les écoutait et leur posait des questions. Luc chapitre 2, verset 46.","reference":"Luc 2:46","source":"https://wol.jw.org/fr/wol/b/r30/lp-f/nwtsty/42/2","origine":"instructeur"},{"id":"m18","niveau":"moyens","type":"qcm","question":"Avec combien de pains et de poissons Jésus a-t-il nourri une immense foule ?","choix":["Trois pains et un poisson","Douze pains et douze poissons","Cinq pains et deux poissons","Sept pains et trois poissons"],"bonne":2,"explication":"Cinq pains et deux poissons. Environ cinq mille hommes ont mangé, sans compter les femmes et les enfants, et il est resté douze paniers ! Matthieu chapitre 14, versets 17 à 21.","reference":"Matthieu 14:17-21","source":"https://wol.jw.org/fr/wol/b/r30/lp-f/nwt/40/14","origine":"instructeur"},{"id":"m19","niveau":"moyens","type":"qcm","question":"Depuis combien de jours Lazare était-il dans la tombe quand Jésus l'a ressuscité ?","choix":["Un jour","Deux jours","Quatre jours","Dix jours"],"bonne":2,"explication":"Quatre jours. Jésus a crié d'une voix forte : « Lazare, viens dehors ! » Et Lazare est sorti vivant. Jean chapitre 11, versets 17, 43 et 44.","reference":"Jean 11:17, 43, 44","source":"https://wol.jw.org/fr/wol/b/r30/lp-f/nwt/43/11","origine":"instructeur"},{"id":"m20","niveau":"moyens","type":"qcm","question":"Dans quel livre de la Bible Jéhovah dit-il : « Vous êtes mes témoins » ?","choix":["Isaïe","Genèse","Psaumes","Jonas"],"bonne":0,"explication":"Dans Isaïe, chapitre 43, verset 10. C'est sur ce verset qu'est basé notre nom : Témoins de Jéhovah.","reference":"Isaïe 43:10","source":"https://wol.jw.org/fr/wol/d/r30/lp-f/1102014243","origine":"instructeur"},{"id":"m21","niveau":"moyens","type":"qcm","question":"Combien d'hommes le roi Nabuchodonosor a-t-il vus marcher dans le four de feu ?","choix":["Un","Trois","Quatre","Sept"],"bonne":2,"explication":"Quatre ! On y avait jeté Shadrak, Méshak et Abed-Négo, mais le roi a vu un quatrième homme avec eux, et le feu ne leur avait fait aucun mal. Daniel chapitre 3, verset 25.","reference":"Daniel 3:25","source":"https://wol.jw.org/fr/wol/b/r30/lp-f/nwtsty/27/3","origine":"instructeur"},{"id":"m22","niveau":"moyens","type":"qcm","question":"Où sont passées les eaux du déluge ?","choix":["Elles se sont envolées dans l'espace","Elles sont toujours sur la terre, surtout dans les océans","Elles sont descendues au centre de la terre","Personne ne peut le savoir"],"bonne":1,"explication":"Elles sont toujours sur la terre, surtout dans les océans. Après le déluge, de nouvelles montagnes se sont sans doute élevées et le fond des mers s'est creusé, et l'eau s'y est rassemblée. Genèse chapitre 8, verset 3.","reference":"Genèse 8:3","source":"https://wol.jw.org/fr/wol/d/r30/lp-f/1200001150","origine":"president"},{"id":"g01","niveau":"grands","type":"qcm","question":"En quelle année Jésus est-il né ?","choix":["En l'an 1 de notre ère","En l'an 4 avant notre ère","En l'an 2 avant notre ère","En l'an 29 de notre ère"],"bonne":2,"explication":"En l'an 2 avant notre ère, vraisemblablement au mois d'Éthanim, c'est-à-dire en septembre ou en octobre. Il est né environ six mois après Jean le Baptiseur. Luc chapitre 3, versets 1 et 23.","reference":"Luc 3:1, 23","source":"https://wol.jw.org/fr/wol/d/r30/lp-f/1200002451","origine":"president"},{"id":"g02","niveau":"grands","type":"qcm","question":"En quelle année Jésus a-t-il été baptisé ?","choix":["En l'an 29 de notre ère","En l'an 27 de notre ère","En l'an 30 de notre ère","En l'an 33 de notre ère"],"bonne":0,"explication":"En l'an 29 de notre ère, à l'automne. Jean le Baptiseur avait commencé à prêcher la quinzième année du règne de Tibère César. Luc chapitre 3, versets 1 à 3.","reference":"Luc 3:1-3","source":"https://wol.jw.org/fr/wol/d/r30/lp-f/1200002451","origine":"president","exclut":["g11"]},{"id":"g03","niveau":"grands","type":"qcm","question":"Quel âge avait Jésus quand il a commencé son ministère ?","choix":["Environ trente ans","Environ vingt ans","Environ trente-trois ans","Environ quarante ans"],"bonne":0,"explication":"Environ trente ans. Luc chapitre 3, verset 23 : « Quand Jésus commença son ministère, il avait environ 30 ans. »","reference":"Luc 3:23","source":"https://wol.jw.org/fr/wol/b/r30/lp-f/nwtsty/42/3","origine":"president"},{"id":"g04","niveau":"grands","type":"qcm","question":"Quel jour Jésus est-il mort ?","choix":["Le 14 nisan de l'an 30","Le 10 nisan de l'an 33","Le 15 nisan de l'an 36","Le 14 nisan de l'an 33"],"bonne":3,"explication":"Le 14 nisan de l'an 33 de notre ère, un vendredi de printemps, vers trois heures de l'après-midi. Luc chapitre 23, versets 44 à 46.","reference":"Luc 23:44-46","source":"https://wol.jw.org/fr/wol/d/r30/lp-f/1200002451","origine":"president","exclut":["g05"]},{"id":"g05","niveau":"grands","type":"qcm","question":"Quel âge avait Jésus à sa mort ?","choix":["Trente ans","Environ trente-trois ans et demi","Quarante ans","Environ trente et un ans"],"bonne":1,"explication":"Environ trente-trois ans et demi : il a commencé son ministère vers trente ans, et ce ministère a duré trois ans et demi. Luc chapitre 3, verset 23.","reference":"Luc 3:23","source":"https://wol.jw.org/fr/wol/d/r30/lp-f/1200002451","origine":"president","exclut":["g04"]},{"id":"g06","niveau":"grands","type":"qcm","question":"D'après Révélation chapitre 21, verset 14, quels noms sont inscrits sur les douze pierres de fondation de la muraille de la ville sainte ?","choix":["Les noms des douze tribus d'Israël","Les noms des douze anges","Les noms des douze prophètes","Les noms des douze apôtres de l'Agneau"],"bonne":3,"explication":"Les noms des douze apôtres de l'Agneau. Les noms des douze tribus, eux, sont inscrits sur les portes de la ville, au verset 12.","reference":"Révélation 21:12, 14","source":"https://wol.jw.org/fr/wol/b/r30/lp-f/nwtsty/66/21","origine":"president"},{"id":"g07","niveau":"grands","type":"qcm","question":"Comment appelle-t-on, dans la Bible, ceux qui régneront avec Jésus dans le ciel ?","choix":["La grande foule","Les autres brebis","Les 144 000","Les Lévites"],"bonne":2,"explication":"Les 144 000. Jean les a vus avec l'Agneau sur le mont Sion, et Jésus les appelle aussi son « petit troupeau ». Révélation chapitre 14, verset 1, et Luc chapitre 12, verset 32.","reference":"Révélation 14:1 ; Luc 12:32","source":"https://wol.jw.org/fr/wol/b/r30/lp-f/nwtsty/66/14","origine":"president"},{"id":"g08","niveau":"grands","type":"qcm","question":"Combien de temps durera le règne de Jésus avant qu'il remette le Royaume à son Père ?","choix":["Mille ans","Cent ans","Sept ans","Il ne le remettra jamais"],"bonne":0,"explication":"Mille ans. Ceux qui ont part à la première résurrection régneront avec lui pendant les mille ans. Ensuite, il remettra le Royaume à son Dieu et Père. Révélation chapitre 20, verset 6, et Première lettre aux Corinthiens, chapitre 15, verset 24.","reference":"Révélation 20:6 ; 1 Corinthiens 15:24","source":"https://wol.jw.org/fr/wol/b/r30/lp-f/nwtsty/66/20","origine":"president"},{"id":"g09","niveau":"grands","type":"qcm","question":"En quelle année Jésus a-t-il été intronisé comme Roi dans le ciel ?","choix":["1919","1931","1914","1975"],"bonne":2,"explication":"En octobre 1914. C'est la fin des « sept temps » annoncés dans le rêve de l'arbre, en Daniel chapitre 4, versets 16 et 17.","reference":"Daniel 4:16, 17","source":"https://wol.jw.org/fr/wol/d/r30/lp-f/1102026527","origine":"president","exclut":["g10"]},{"id":"g10","niveau":"grands","type":"ouverte","question":"Quelle prophétie de Daniel donne l'année exacte de l'intronisation du Christ dans le ciel ? Explique le calcul.","choix":[],"bonne":null,"reponse_attendue":"Le rêve du grand arbre abattu, en Daniel chapitre 4. Les « sept temps » durent deux mille cinq cent vingt ans : ils commencent en octobre 607 avant notre ère, quand Jérusalem est détruite, et se terminent en octobre 1914, quand Jésus commence à régner.","explication":"Les sept temps, c'est le « temps accordé aux nations » dont parle Jésus en Luc chapitre 21, verset 24. Ils vont d'octobre 607 avant notre ère à octobre 1914 de notre ère. Daniel chapitre 4, versets 16 et 17.","reference":"Daniel 4:16, 17 ; Luc 21:24","source":"https://wol.jw.org/fr/wol/d/r30/lp-f/1102026527","origine":"president","juge_minimum":"Daniel 4, les sept temps, de 607 avant notre ère à 1914. Bonus : 2 520 ans.","exclut":["g09"]},{"id":"g11","niveau":"grands","type":"ouverte","question":"Quelle prophétie de Daniel donne l'année exacte de l'arrivée du Messie ? Quelle est cette année ?","choix":[],"bonne":null,"reponse_attendue":"La prophétie des soixante-dix semaines, en Daniel chapitre 9. Elle part de 455 avant notre ère, quand est donné l'ordre de rebâtir Jérusalem. Soixante-neuf semaines d'années, soit quatre cent quatre-vingt-trois ans, mènent à l'an 29 de notre ère : Jésus est baptisé et devient le Messie.","explication":"Le Messie, le Guide, arrive en l'an 29. Au milieu de la dernière semaine, en l'an 33, il est mis à mort. Daniel chapitre 9, versets 24 à 27.","reference":"Daniel 9:24-27","source":"https://wol.jw.org/fr/wol/d/r30/lp-f/1102026527","origine":"president","juge_minimum":"Daniel 9, les soixante-dix semaines, et l'an 29. Bonus : départ en 455 avant notre ère.","exclut":["g02"]},{"id":"g12","niveau":"grands","type":"ouverte","question":"Quand s'est accomplie la prophétie de Malachie chapitre 3, versets 1 à 3 ?","choix":[],"bonne":null,"reponse_attendue":"De 1914 au début de 1919. Jésus, intronisé, est venu avec son Père inspecter le temple spirituel. Les chrétiens oints, les « fils de Lévi », ont traversé une période d'épreuves et en sont sortis affinés et purifiés.","explication":"Jéhovah, le Grand Affineur, a purifié ses serviteurs comme on affine l'or et l'argent. Et cet affinage continue tout au long des derniers jours. Malachie chapitre 3, versets 1 à 3.","reference":"Malachie 3:1-3","source":"https://wol.jw.org/fr/wol/d/r30/lp-f/1102014249","origine":"president","juge_minimum":"De 1914 au début de 1919. Bonus : Jésus inspecte le temple, les oints sont purifiés."},{"id":"g13","niveau":"grands","type":"ouverte","question":"Quel événement annoncé en Première lettre aux Thessaloniciens, chapitre 5, verset 3, attendons-nous encore ? Et sait-on exactement quand il viendra ?","choix":[],"bonne":null,"reponse_attendue":"La proclamation « Paix et sécurité ! » par les nations, suivie d'une destruction subite. On ne sait pas exactement quand elle sera faite : elle pourrait venir avant ou après la destruction des fausses religions, qui marque le début de la grande tribulation. L'important est de rester éveillés.","explication":"La Tour de Garde de février 2026 explique que les deux possibilités restent ouvertes. Ce qui compte le plus, ce n'est pas le moment exact, mais notre fidélité à Dieu. Première lettre aux Thessaloniciens, chapitre 5, versets 3 à 6.","reference":"1 Thessaloniciens 5:3-6","source":"https://wol.jw.org/fr/wol/d/r30/lp-f/2026285","origine":"president","juge_minimum":"La proclamation « Paix et sécurité ! ». Accepter aussi « juste avant la grande tribulation » : c'était l'explication donnée jusqu'en 2026. Bonus : on ne sait pas exactement quand, peut-être après la destruction des fausses religions."},{"id":"g14","niveau":"grands","type":"ouverte","question":"Genèse chapitre 2 dit que Dieu se reposa le septième jour, mais Jésus dit en Jean chapitre 5, verset 17 : « Mon Père a continué de travailler jusqu'à maintenant. » Comment concilier ces deux versets ?","choix":[],"bonne":null,"reponse_attendue":"Le contexte de la Genèse montre que Dieu s'est reposé de son œuvre de création matérielle concernant la terre. Jésus, lui, parle des autres œuvres de Dieu : il a inspiré la Bible, il guide et soutient les humains. Dieu a cessé de créer sur la terre, mais il n'a jamais cessé de travailler.","explication":"Il n'y a pas de contradiction : les deux versets ne parlent pas du même travail. Genèse chapitre 2, versets 2 et 3, et Jean chapitre 5, verset 17.","reference":"Genèse 2:1-3 ; Jean 5:17","source":"https://wol.jw.org/fr/wol/d/r30/lp-f/502014102","origine":"president","juge_minimum":"Les deux versets ne parlent pas du même travail : Dieu a fini de créer sur la terre, mais il continue d'agir."},{"id":"g15","niveau":"grands","type":"ouverte","question":"D'après Matthieu chapitre 10, verset 23, réussirons-nous à faire connaître la bonne nouvelle du Royaume à chaque personne sur terre avant que vienne la fin ?","choix":[],"bonne":null,"reponse_attendue":"Non. Jésus a dit à ses disciples qu'ils n'auraient pas terminé le tour des villes avant qu'il arrive. Nous prêchons dans le monde entier, mais des millions de personnes vivent là où notre activité est sévèrement limitée, et des centaines de bébés naissent chaque minute.","explication":"La bonne nouvelle est prêchée sur toute la terre, en témoignage pour toutes les nations, et le site jw.org la rend accessible à la majorité des humains. Mais nous n'aurons pas prêché à chaque personne avant que Jésus vienne juger. Matthieu chapitre 10, verset 23, et chapitre 24, verset 14.","reference":"Matthieu 10:23 ; 24:14","source":"https://wol.jw.org/fr/wol/d/r30/lp-f/2024405","origine":"president","juge_minimum":"Non : Jésus a dit qu'on n'aurait pas fini le tour des villes avant qu'il vienne. Bonus : une raison (pays où l'activité est limitée, naissances)."},{"id":"g16","niveau":"grands","type":"qcm","question":"Selon la chronologie biblique, il y a combien d'années environ qu'Adam a été créé ?","choix":["Environ quatre mille ans","Un peu plus de six mille ans","Environ dix mille ans","Des millions d'années"],"bonne":1,"explication":"Un peu plus de six mille ans. Adam a été créé en 4026 avant notre ère, soit il y a environ six mille cinquante ans. Les âges donnés en Genèse chapitre 5 permettent ce calcul.","reference":"Genèse 5","source":"https://wol.jw.org/fr/wol/d/r30/lp-f/1200000970","origine":"president"},{"id":"g17","niveau":"grands","type":"qcm","question":"Depuis quelle année le peuple de Dieu s'appelle-t-il Témoins de Jéhovah ?","choix":["1914","1919","1942","1931"],"bonne":3,"explication":"Depuis 1931. Le 26 juillet, lors d'une assemblée aux États-Unis, les Étudiants de la Bible ont adopté avec joie ce nom, basé sur Isaïe chapitre 43, verset 10.","reference":"Isaïe 43:10","source":"https://wol.jw.org/fr/wol/d/r30/lp-f/1102014243","origine":"president"},{"id":"g18","niveau":"grands","type":"qcm","question":"Qui fut le dernier roi de la lignée de David à régner à Jérusalem ?","choix":["Joachim","Salomon","Sédécias","Saül"],"bonne":2,"explication":"Sédécias. Après lui, Jéhovah a annoncé que la couronne n'appartiendrait à personne « jusqu'à ce que vienne celui qui a le droit légal ». Ce roi, c'est Jésus. Ézéchiel chapitre 21, verset 27.","reference":"Jérémie 52:1 ; Ézéchiel 21:27","source":"https://wol.jw.org/fr/wol/d/r30/lp-f/2011605","origine":"president"},{"id":"g19","niveau":"grands","type":"qcm","question":"Le roi David a commis un péché très grave, et selon la Loi de Moïse il aurait mérité la mort. Ce péché concernait la femme d'un de ses soldats. Comment s'appelait-elle ?","choix":["Dalila","Bethsabée","Esther","Noémi"],"bonne":1,"explication":"Bethsabée, la femme d'Urie. David s'est sincèrement repenti, et Jéhovah lui a pardonné : il n'a pas été mis à mort, même s'il a subi les conséquences de son péché. Deuxième livre de Samuel, chapitre 12, verset 13.","reference":"2 Samuel 11:3 ; 12:13","source":"https://wol.jw.org/fr/wol/d/r30/lp-f/2007686","origine":"president"},{"id":"g20","niveau":"grands","type":"qcm","question":"Comment Samson est-il mort ?","choix":["De vieillesse, dans sa maison","Dans un combat contre un lion","Noyé dans la mer","En faisant tomber le temple de Dagon"],"bonne":3,"explication":"En faisant tomber le temple de Dagon. Prisonnier des Philistins, il a supplié Jéhovah de lui rendre sa force une dernière fois. Il a poussé les deux colonnes, le temple s'est écroulé, et Samson est mort avec les ennemis du peuple de Dieu. Juges chapitre 16, versets 28 à 30.","reference":"Juges 16:28-30","source":"https://wol.jw.org/fr/wol/b/r30/lp-f/nwtsty/7/16","origine":"president"},{"id":"g21","niveau":"grands","type":"qcm","question":"Combien de temps Noé et sa famille sont-ils restés dans l'arche ?","choix":["Quarante jours","Cent cinquante jours","Un peu plus d'un an","Sept ans"],"bonne":2,"explication":"Un peu plus d'un an : trois cent soixante-dix jours. La pluie est tombée quarante jours, mais il a fallu bien plus longtemps pour que les eaux baissent et que la terre sèche. Genèse chapitre 7, verset 11, et chapitre 8, versets 13 et 14.","reference":"Genèse 7:11 ; 8:13, 14","source":"https://wol.jw.org/fr/wol/d/r30/lp-f/1200001150","origine":"instructeur"},{"id":"g22","niveau":"grands","type":"qcm","question":"Après sa résurrection, Jésus a demandé trois fois à Pierre s'il l'aimait. Qu'a-t-il voulu lui faire comprendre ?","choix":["Qu'il doutait encore de lui et voulait le mettre à l'épreuve","Qu'il lui avait pardonné et qu'il devait nourrir ses brebis","Qu'il pouvait retourner tranquillement à son ancien métier de pêcheur","Qu'il le nommait chef, au-dessus de tous les autres apôtres"],"bonne":1,"explication":"Qu'il lui avait pardonné, et que son amour devait le pousser à prendre soin de ses brebis. La nuit de l'arrestation de Jésus, Pierre l'avait renié trois fois. Après sa résurrection, au bord de la mer de Galilée, Jésus lui a permis trois fois de dire qu'il l'aimait, puis il lui a confié le soin de ses disciples. Jean chapitre 21, versets 15 à 17.","reference":"Jean 21:15-17","source":"https://wol.jw.org/fr/wol/d/r30/lp-f/1001070689","origine":"instructeur","exclut":["m12","p15"]}],"illustrations":{"p01-0":"\u003csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'>\u003cg stroke='#241C30' stroke-width='3' stroke-linejoin='round' stroke-linecap='round'>\u003cpath d='M22 90 Q22 71 50 69 Q78 71 78 90 Z' fill='#3B7DD8'/>\u003cpath d='M44 57 V70 H56 V57' fill='#D9A273'/>\u003cellipse cx='50' cy='44' rx='15' ry='17' fill='#D9A273'/>\u003cg fill='#8A3F1F'>\u003ccircle cx='
