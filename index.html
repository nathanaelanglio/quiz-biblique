<script>
(function(){
'use strict';
var DONNEES={"questions":[{"id":"p01","niveau":"petits","type":"qcm","question":"Qui a construit une grande arche pour sauver sa famille et les animaux ?","choix":["David","Noé","Pierre"],"bonne":1,"explication":"C'est Noé ! Jéhovah lui a dit : « Fais-toi une arche en bois. » Noé a obéi, et sa famille a été sauvée. Genèse chapitre 6, verset 14.","reference":"Genèse 6:14","source":"https://wol.jw.org/fr/wol/b/r30/lp-f/nwtsty/1/6","origine":"instructeur"},{"id":"p02","niveau":"petits","type":"qcm","question":"Combien de personnes sont entrées dans l'arche ?","choix":["Huit","Deux","Vingt"],"bonne":0,"explication":"Huit personnes : Noé, sa femme, leurs trois fils et les trois femmes de leurs fils. Genèse chapitre 7, verset 13.","reference":"Genèse 7:13","source":"https://wol.jw.org/fr/wol/b/r30/lp-f/nwtsty/1/7","origine":"instructeur"},{"id":"p03","niveau":"petits","type":"qcm","question":"Après le déluge, quel beau signe Jéhovah a-t-il mis dans le nuage ?","choix":["Une étoile","La lune","Un arc-en-ciel"],"bonne":2,"explication":"Un arc-en-ciel ! C'est le signe de la promesse que Jéhovah a faite à la terre. Genèse chapitre 9, verset 13.","reference":"Genèse 9:13","source":"https://wol.jw.org/fr/wol/b/r30/lp-f/nwtsty/1/9","origine":"instructeur"},{"id":"p04","niveau":"petits","type":"qcm","question":"Dans la Bible, qui était le grand frère jaloux d'Abel ?","choix":["Caïn","Moïse"],"bonne":0,"explication":"Caïn. Il a laissé la jalousie grandir dans son cœur. La Bible nous demande de ne pas être comme Caïn, mais de nous aimer les uns les autres. Première lettre de Jean, chapitre 3, versets 11 et 12.","reference":"1 Jean 3:11, 12","source":"https://wol.jw.org/fr/wol/b/r30/lp-f/nwtsty/62/3","origine":"president"},{"id":"p05","niveau":"petits","type":"qcm","question":"Dans la ville de Jéricho, une femme a caché deux espions envoyés par Josué. Comment s'appelait-elle ?","choix":["Ruth","Rahab","Marie"],"bonne":1,"explication":"C'est Rahab. Elle avait confiance en Jéhovah, et elle a été sauvée avec toute sa famille. Josué chapitre 6, verset 25.","reference":"Josué 6:25","source":"https://wol.jw.org/fr/wol/b/r30/lp-f/nwtsty/6/6","origine":"president"},{"id":"p06","niveau":"petits","type":"qcm","question":"Qu'est-ce que Rahab a attaché à sa fenêtre pour que sa famille soit protégée ?","choix":["Un drapeau blanc","Une lampe","Un cordon rouge"],"bonne":2,"explication":"Un cordon de fil écarlate, c'est-à-dire rouge vif. C'était le signe convenu avec les espions. Josué chapitre 2, verset 18.","reference":"Josué 2:18","source":"https://wol.jw.org/fr/wol/b/r30/lp-f/nwtsty/6/2","origine":"instructeur"},{"id":"p07","niveau":"petits","type":"qcm","question":"Selon la Bible, quel homme a reçu de Jéhovah une force extraordinaire ?","choix":["Samson","Jonas","Zachée"],"bonne":0,"explication":"C'est Samson ! Une nuit, il a arraché les grandes portes d'une ville et il les a portées sur ses épaules jusqu'en haut d'une montagne. Juges chapitre 16, verset 3.","reference":"Juges 16:3","source":"https://wol.jw.org/fr/wol/b/r30/lp-f/nwtsty/7/16","origine":"president"},{"id":"p08","niveau":"petits","type":"qcm","question":"Samson avait fait une promesse à Jéhovah. Qu'est-ce qu'il ne devait jamais couper ?","choix":["Ses sourcils","Ses cheveux"],"bonne":1,"explication":"Ses cheveux. Samson a dit : « Le rasoir n'est jamais passé sur ma tête. » C'était sa promesse à Jéhovah. Juges chapitre 16, verset 17.","reference":"Juges 16:17","source":"https://wol.jw.org/fr/wol/b/r30/lp-f/nwtsty/7/16","origine":"instructeur"},{"id":"p09","niveau":"petits","type":"qcm","question":"Qu'est-ce que Jacob a fait faire pour son fils Joseph ?","choix":["Une petite maison","Un beau et long vêtement","Un bateau"],"bonne":1,"explication":"Un beau et long vêtement. Jacob aimait beaucoup Joseph. Genèse chapitre 37, verset 3.","reference":"Genèse 37:3","source":"https://wol.jw.org/fr/wol/b/r30/lp-f/nwtsty/1/37","origine":"instructeur"},{"id":"p10","niveau":"petits","type":"qcm","question":"Zacharie et Élisabeth étaient très vieux, et Jéhovah leur a donné un bébé. Comment s'appelait-il ?","choix":["Samuel","Jonas","Jean"],"bonne":2,"explication":"Jean ! L'ange a dit à Zacharie : « Ta femme, Élisabeth, te donnera un fils, et tu devras l'appeler Jean. » Plus tard, il a préparé le chemin de Jésus. Luc chapitre 1, verset 13.","reference":"Luc 1:13","source":"https://wol.jw.org/fr/wol/b/r30/lp-f/nwtsty/42/1","origine":"president"},{"id":"p11","niveau":"petits","type":"qcm","question":"Que mangeait Jean le Baptiseur dans le désert ?","choix":["Des gâteaux et du lait","Des criquets et du miel sauvage","Du riz et du poisson"],"bonne":1,"explication":"Des criquets et du miel sauvage ! Il portait aussi un vêtement en poil de chameau. Matthieu chapitre 3, verset 4.","reference":"Matthieu 3:4","source":"https://wol.jw.org/fr/wol/b/r30/lp-f/nwt/40/3","origine":"instructeur"},{"id":"p12","niveau":"petits","type":"qcm","question":"Où Marie a-t-elle couché le bébé Jésus ?","choix":["Dans une mangeoire","Dans un berceau en or","Dans une barque"],"bonne":0,"explication":"Dans une mangeoire, l'endroit où mangent les animaux, parce qu'il n'y avait pas de place pour eux dans la salle prévue pour les voyageurs. Luc chapitre 2, verset 7.","reference":"Luc 2:7","source":"https://wol.jw.org/fr/wol/b/r30/lp-f/nwtsty/42/2","origine":"instructeur"},{"id":"p13","niveau":"petits","type":"qcm","question":"Qui a élevé Jésus avec Marie, comme un papa ?","choix":["Abraham","Joseph","Pierre"],"bonne":1,"explication":"C'est Joseph, le charpentier. Jésus est le Fils de Dieu, et Joseph a été son père adoptif : il l'a élevé avec amour. Luc chapitre 3, verset 23.","reference":"Luc 3:23","source":"https://wol.jw.org/fr/wol/d/r30/lp-f/1001070647","origine":"president"},{"id":"p14","niveau":"petits","type":"qcm","question":"Combien d'apôtres Jésus a-t-il choisis ?","choix":["Trois","Cent","Douze"],"bonne":2,"explication":"Douze apôtres. Matthieu chapitre 10, versets 2 à 4.","reference":"Matthieu 10:2-4","source":"https://wol.jw.org/fr/wol/b/r30/lp-f/nwtsty/40/10","origine":"president"},{"id":"p15","niveau":"petits","type":"qcm","question":"Jésus a dit à Pierre : « Nourris mes petites brebis. » De qui parlait-il ?","choix":["De vrais moutons","De ceux qui le suivaient"],"bonne":1,"explication":"De ses disciples, ceux qui suivaient Jésus ! Il demandait à Pierre de prendre soin d'eux et de les nourrir de la Parole de Dieu. Jean chapitre 21, verset 17.","reference":"Jean 21:17","source":"https://wol.jw.org/fr/wol/d/r30/lp-f/1001070689","origine":"president","exclut":["g22"]},{"id":"p16","niveau":"petits","type":"qcm","question":"Qu'est-ce qui a avalé Jonas ?","choix":["Un énorme poisson","Un lion","Un aigle"],"bonne":0,"explication":"Un énorme poisson envoyé par Jéhovah. Jonas est resté trois jours et trois nuits dans son ventre, puis il s'est retrouvé sain et sauf sur la terre ferme. Jonas chapitre 1, verset 17.","reference":"Jonas 1:17 ; 2:10","source":"https://wol.jw.org/fr/wol/b/r30/lp-f/nwtsty/32/1","origine":"instructeur"},{"id":"p17","niveau":"petits","type":"qcm","question":"Qui a fermé la gueule des lions pour protéger Daniel ?","choix":["Le roi","Un ange de Jéhovah","Un soldat"],"bonne":1,"explication":"Un ange de Jéhovah ! Daniel a dit au roi : « Mon Dieu a envoyé son ange et a fermé la gueule des lions. » Daniel chapitre 6, verset 22.","reference":"Daniel 6:22","source":"https://wol.jw.org/fr/wol/b/r30/lp-f/nwtsty/27/6","origine":"instructeur"},{"id":"p18","niveau":"petits","type":"qcm","question":"Où la maman de Moïse a-t-elle déposé son bébé pour le protéger ?","choix":["Dans une grotte","Sur un chameau","Dans une corbeille au bord du Nil"],"bonne":2,"explication":"Dans une corbeille en papyrus, au milieu des roseaux, au bord du Nil. Et sa grande sœur surveillait de loin. Exode chapitre 2, versets 3 et 4.","reference":"Exode 2:3, 4","source":"https://wol.jw.org/fr/wol/b/r30/lp-f/nwtsty/2/2","origine":"instructeur"},{"id":"p19","niveau":"petits","type":"qcm","question":"Ruth a dit à Noémi : « Ton Dieu sera mon Dieu. » Qu'a fait Ruth ?","choix":["Elle est restée avec Noémi","Elle est partie loin d'elle"],"bonne":0,"explication":"Ruth est restée avec Noémi, sa belle-mère, pour l'aider et pour servir Jéhovah avec elle. Ruth chapitre 1, verset 16.","reference":"Ruth 1:16","source":"https://wol.jw.org/fr/wol/b/r30/lp-f/nwtsty/8/1","origine":"president"},{"id":"p20","niveau":"petits","type":"qcm","question":"Zachée était petit. Où est-il monté pour voir Jésus ?","choix":["Sur un chameau","Dans un arbre","Sur un toit"],"bonne":1,"explication":"Dans un arbre, un sycomore. Et Jésus l'a appelé par son nom ! Luc chapitre 19, versets 4 et 5.","reference":"Luc 19:4, 5","source":"https://wol.jw.org/fr/wol/b/r30/lp-f/nwtsty/42/19","origine":"instructeur"},{"id":"p21","niveau":"petits","type":"qcm","question":"Pendant un mariage, en quoi Jésus a-t-il changé de l'eau ?","choix":["En lait","En jus de fruit","En vin"],"bonne":2,"explication":"En vin ! C'était son premier miracle, à Cana. Jean chapitre 2, verset 9.","reference":"Jean 2:9","source":"https://wol.jw.org/fr/wol/b/r30/lp-f/nwt/43/2","origine":"instructeur"},{"id":"p22","niveau":"petits","type":"qcm","question":"Qui a donné un nom à tous les animaux ?","choix":["Noé","Adam","Moïse"],"bonne":1,"explication":"C'est Adam, le premier homme. Jéhovah lui amenait les animaux, et chaque animal recevait le nom qu'Adam lui donnait. Genèse chapitre 2, verset 19.","reference":"Genèse 2:19","source":"https://wol.jw.org/fr/wol/b/r30/lp-f/nwtsty/1/2","origine":"instructeur"},{"id":"m01","niveau":"moyens","type":"qcm","question":"Qui a été le premier meurtrier de l'histoire humaine ?","choix":["Abel","Lamek","Caïn","Noé"],"bonne":2,"explication":"C'est Caïn. Il a laissé la jalousie le dominer et il a tué son frère Abel. La Bible le donne en exemple à ne pas suivre. Genèse chapitre 4, verset 8, et Première lettre de Jean, chapitre 3, verset 12.","reference":"Genèse 4:8 ; 1 Jean 3:12","source":"https://wol.jw.org/fr/wol/d/r30/lp-f/1200000857","origine":"president"},{"id":"m02","niveau":"moyens","type":"qcm","question":"Comment s'appelait la femme cananéenne de Jéricho qui a été épargnée avec sa famille ?","choix":["Dalila","Rahab","Ruth","Noémi"],"bonne":1,"explication":"Rahab. Elle avait caché les espions de Josué, et Jéhovah l'a protégée. Elle est même devenue une ancêtre de Jésus. Josué chapitre 6, verset 25, et Matthieu chapitre 1, verset 5.","reference":"Josué 6:25 ; Matthieu 1:5","source":"https://wol.jw.org/fr/wol/b/r30/lp-f/nwtsty/6/6","origine":"president"},{"id":"m03","niveau":"moyens","type":"qcm","question":"Qui était Ruth pour Noémi ?","choix":["Sa sœur","Sa voisine","Sa belle-fille","Sa cousine"],"bonne":2,"explication":"Sa belle-fille. Ruth, qui venait du pays de Moab, avait épousé un fils de Noémi. Devenue veuve, elle est restée fidèle à Noémi et à Jéhovah. Ruth chapitre 1, versets 4 et 16.","reference":"Ruth 1:4, 16","source":"https://wol.jw.org/fr/wol/b/r30/lp-f/nwtsty/8/1","origine":"president"},{"id":"m04","niveau":"moyens","type":"qcm","question":"Ruth s'est mariée avec Boaz. Quel roi célèbre est leur arrière-petit-fils ?","choix":["David","Saül","Salomon","Sédécias"],"bonne":0,"explication":"Le roi David. Ruth et Boaz ont eu un fils, Obed. Obed est le père de Jessé, et Jessé est le père de David. Ruth chapitre 4, versets 13 et 17.","reference":"Ruth 4:13, 17","source":"https://wol.jw.org/fr/wol/b/r30/lp-f/nwtsty/8/4","origine":"instructeur"},{"id":"m05","niveau":"moyens","type":"qcm","question":"On dit souvent de lui qu'il est l'homme le plus fort qui ait jamais vécu. Qui est-ce ?","choix":["Goliath","David","Saül","Samson"],"bonne":3,"explication":"Samson. Sa force ne venait pas de ses muscles, mais de Jéhovah : à la fin de sa vie, il a encore supplié Jéhovah de le fortifier. Juges chapitre 16, verset 28.","reference":"Juges 16:28","source":"https://wol.jw.org/fr/wol/d/r30/lp-f/2005206","origine":"president"},{"id":"m06","niveau":"moyens","type":"qcm","question":"Quand on parle des ancêtres du peuple d'Israël, quels trois noms dit-on toujours ensemble ?","choix":["Adam, Noé et Moïse","Moïse, Aaron et Josué","David, Salomon et Sédécias","Abraham, Isaac et Jacob"],"bonne":3,"explication":"Abraham, Isaac et Jacob. Jéhovah s'est présenté à Moïse ainsi : « Je suis le Dieu d'Abraham, le Dieu d'Isaac et le Dieu de Jacob. » Exode chapitre 3, verset 6.","reference":"Exode 3:6","source":"https://wol.jw.org/fr/wol/b/r30/lp-f/nwtsty/2/3","origine":"president"},{"id":"m07","niveau":"moyens","type":"qcm","question":"Pourquoi les noms des douze fils de Jacob sont-ils restés dans l'histoire du peuple ?","choix":["Parce qu'ils étaient tous prophètes","Parce que leurs familles sont devenues les douze tribus d'Israël","Parce qu'ils ont construit le temple","Parce qu'ils ont tous été rois"],"bonne":1,"explication":"Leurs descendants sont devenus les douze tribus d'Israël. Genèse chapitre 49, verset 28. Et dans la Révélation, les noms des douze tribus sont inscrits sur les portes de la ville sainte. Révélation chapitre 21, verset 12.","reference":"Genèse 49:28 ; Révélation 21:12","source":"https://wol.jw.org/fr/wol/b/r30/lp-f/nwtsty/1/49","origine":"president"},{"id":"m08","niveau":"moyens","type":"qcm","question":"Comment s'appelait le père adoptif de Jésus ?","choix":["Zacharie","Lazare","Jacques","Joseph"],"bonne":3,"explication":"Joseph. Jésus a été conçu par l'esprit saint, mais Joseph l'a élevé avec Marie. C'est pourquoi les gens disaient que Jésus était « fils de Joseph ». Luc chapitre 3, verset 23.","reference":"Luc 3:23","source":"https://wol.jw.org/fr/wol/d/r30/lp-f/1001070647","origine":"president"},{"id":"m09","niveau":"moyens","type":"qcm","question":"Sa mère était trop âgée pour avoir des enfants, et il est venu au monde pour préparer la venue du Messie. Qui est-ce ?","choix":["Isaac","Jean le Baptiseur","Samuel","L'apôtre Jean"],"bonne":1,"explication":"Jean le Baptiseur. Ses parents, Zacharie et Élisabeth, étaient très âgés. Isaac aussi est né d'une mère âgée, Sara, mais c'est Jean qui a préparé la venue du Messie. Luc chapitre 1, versets 7 et 17.","reference":"Luc 1:7, 17","source":"https://wol.jw.org/fr/wol/b/r30/lp-f/nwtsty/42/1","origine":"president"},{"id":"m10","niveau":"moyens","type":"qcm","question":"Après la trahison de Judas, il restait onze apôtres. Qui a été choisi pour devenir le douzième ?","choix":["Paul","Barnabé","Matthias","Étienne"],"bonne":2,"explication":"Matthias. Les disciples ont tiré au sort, et Matthias a été ajouté aux onze apôtres. Actes chapitre 1, verset 26.","reference":"Actes 1:26","source":"https://wol.jw.org/fr/wol/b/r30/lp-f/nwtsty/44/1","origine":"president"},{"id":"m11","niveau":"moyens","type":"qcm","question":"Après sa résurrection, pendant combien de jours Jésus s'est-il montré à ses disciples ?","choix":["Quarante jours","Trois jours","Sept jours","Cinquante jours"],"bonne":0,"explication":"Pendant quarante jours. Il leur a donné des preuves convaincantes qu'il était vivant, et il leur parlait du royaume de Dieu. Actes chapitre 1, verset 3.","reference":"Actes 1:3","source":"https://wol.jw.org/fr/wol/b/r30/lp-f/nwtsty/44/1","origine":"president"},{"id":"m12","niveau":"moyens","type":"qcm","question":"À quel apôtre Jésus ressuscité a-t-il dit : « Nourris mes petites brebis » ?","choix":["Jean","Thomas","André","Pierre"],"bonne":3,"explication":"À Pierre. Avec d'autres frères dignes de confiance, Pierre allait nourrir, fortifier et conduire les disciples de Jésus. Jean chapitre 21, versets 15 à 17.","reference":"Jean 21:15-17","source":"https://wol.jw.org/fr/wol/d/r30/lp-f/1001070689","origine":"president","exclut":["g22"]},{"id":"m13","niveau":"moyens","type":"qcm","question":"Quel apôtre a vécu très vieux et a probablement été le dernier apôtre à mourir ?","choix":["Pierre","Jean","Jacques","Matthieu"],"bonne":1,"explication":"Jean. Après la résurrection de Jésus, il a encore servi Dieu fidèlement pendant près de soixante-dix ans, et c'est sur l'île de Patmos qu'il a reçu la Révélation.","reference":"Jean 21:22","source":"https://wol.jw.org/fr/wol/d/r30/lp-f/1001070689","origine":"president"},{"id":"m14","niveau":"moyens","type":"qcm","question":"Comment Jéhovah a-t-il ouvert un chemin dans la mer pour les Israélites ?","choix":["Avec un grand pont","Avec des bateaux","Par un fort vent d'est qui a fait reculer la mer","En gelant l'eau"],"bonne":2,"explication":"Jéhovah a fait reculer la mer par un fort vent d'est toute la nuit, et les Israélites ont traversé sur un sol ferme. Exode chapitre 14, versets 21 et 22.","reference":"Exode 14:21, 22","source":"https://wol.jw.org/fr/wol/b/r30/lp-f/nwtsty/2/14","origine":"instructeur"},{"id":"m15","niveau":"moyens","type":"qcm","question":"D'après les âges donnés dans la Bible, qui a vécu le plus longtemps ?","choix":["Mathusalem","Adam","Noé","Abraham"],"bonne":0,"explication":"Mathusalem, qui a vécu neuf cent soixante-neuf ans ! Genèse chapitre 5, verset 27.","reference":"Genèse 5:27","source":"https://wol.jw.org/fr/wol/b/r30/lp-f/nwtsty/1/5","origine":"instructeur"},{"id":"m16","niveau":"moyens","type":"qcm","question":"Près de la rivière, qui apportait à manger au prophète Élie ?","choix":["Des colombes","Des corbeaux","Des soldats","Des bergers"],"bonne":1,"explication":"Des corbeaux ! Tous les matins et tous les soirs, ils lui apportaient du pain et de la viande. Premier livre des Rois, chapitre 17, verset 6.","reference":"1 Rois 17:6","source":"https://wol.jw.org/fr/wol/b/r30/lp-f/nwtsty/11/17","origine":"instructeur"},{"id":"m17","niveau":"moyens","type":"qcm","question":"Jésus avait douze ans. Où ses parents l'ont-ils retrouvé au bout de trois jours ?","choix":["Au marché","Chez des amis","Au bord du lac","Dans le Temple, au milieu des enseignants"],"bonne":3,"explication":"Dans le Temple, assis au milieu des enseignants : il les écoutait et leur posait des questions. Luc chapitre 2, verset 46.","reference":"Luc 2:46","source":"https://wol.jw.org/fr/wol/b/r30/lp-f/nwtsty/42/2","origine":"instructeur"},{"id":"m18","niveau":"moyens","type":"qcm","question":"Avec combien de pains et de poissons Jésus a-t-il nourri une immense foule ?","choix":["Trois pains et un poisson","Douze pains et douze poissons","Cinq pains et deux poissons","Sept pains et trois poissons"],"bonne":2,"explication":"Cinq pains et deux poissons. Environ cinq mille hommes ont mangé, sans compter les femmes et les enfants, et il est resté douze paniers ! Matthieu chapitre 14, versets 17 à 21.","reference":"Matthieu 14:17-21","source":"https://wol.jw.org/fr/wol/b/r30/lp-f/nwt/40/14","origine":"instructeur"},{"id":"m19","niveau":"moyens","type":"qcm","question":"Depuis combien de jours Lazare était-il dans la tombe quand Jésus l'a ressuscité ?","choix":["Un jour","Deux jours","Quatre jours","Dix jours"],"bonne":2,"explication":"Quatre jours. Jésus a crié d'une voix forte : « Lazare, viens dehors ! » Et Lazare est sorti vivant. Jean chapitre 11, versets 17, 43 et 44.","reference":"Jean 11:17, 43, 44","source":"https://wol.jw.org/fr/wol/b/r30/lp-f/nwt/43/11","origine":"instructeur"},{"id":"m20","niveau":"moyens","type":"qcm","question":"Dans quel livre de la Bible Jéhovah dit-il : « Vous êtes mes témoins » ?","choix":["Isaïe","Genèse","Psaumes","Jonas"],"bonne":0,"explication":"Dans Isaïe, chapitre 43, verset 10. C'est sur ce verset qu'est basé notre nom : Témoins de Jéhovah.","reference":"Isaïe 43:10","source":"https://wol.jw.org/fr/wol/d/r30/lp-f/1102014243","origine":"instructeur"},{"id":"m21","niveau":"moyens","type":"qcm","question":"Combien d'hommes le roi Nabuchodonosor a-t-il vus marcher dans le four de feu ?","choix":["Un","Trois","Quatre","Sept"],"bonne":2,"explication":"Quatre ! On y avait jeté Shadrak, Méshak et Abed-Négo, mais le roi a vu un quatrième homme avec eux, et le feu ne leur avait fait aucun mal. Daniel chapitre 3, verset 25.","reference":"Daniel 3:25","source":"https://wol.jw.org/fr/wol/b/r30/lp-f/nwtsty/27/3","origine":"instructeur"},{"id":"m22","niveau":"moyens","type":"qcm","question":"Où sont passées les eaux du déluge ?","choix":["Elles se sont envolées dans l'espace","Elles sont toujours sur la terre, surtout dans les océans","Elles sont descendues au centre de la terre","Personne ne peut le savoir"],"bonne":1,"explication":"Elles sont toujours sur la terre, surtout dans les océans. Après le déluge, de nouvelles montagnes se sont sans doute élevées et le fond des mers s'est creusé, et l'eau s'y est rassemblée. Genèse chapitre 8, verset 3.","reference":"Genèse 8:3","source":"https://wol.jw.org/fr/wol/d/r30/lp-f/1200001150","origine":"president"},{"id":"g01","niveau":"grands","type":"qcm","question":"En quelle année Jésus est-il né ?","choix":["En l'an 1 de notre ère","En l'an 4 avant notre ère","En l'an 2 avant notre ère","En l'an 29 de notre ère"],"bonne":2,"explication":"En l'an 2 avant notre ère, vraisemblablement au mois d'Éthanim, c'est-à-dire en septembre ou en octobre. Il est né environ six mois après Jean le Baptiseur. Luc chapitre 3, versets 1 et 23.","reference":"Luc 3:1, 23","source":"https://wol.jw.org/fr/wol/d/r30/lp-f/1200002451","origine":"president"},{"id":"g02","niveau":"grands","type":"qcm","question":"En quelle année Jésus a-t-il été baptisé ?","choix":["En l'an 29 de notre ère","En l'an 27 de notre ère","En l'an 30 de notre ère","En l'an 33 de notre ère"],"bonne":0,"explication":"En l'an 29 de notre ère, à l'automne. Jean le Baptiseur avait commencé à prêcher la quinzième année du règne de Tibère César. Luc chapitre 3, versets 1 à 3.","reference":"Luc 3:1-3","source":"https://wol.jw.org/fr/wol/d/r30/lp-f/1200002451","origine":"president","exclut":["g11"]},{"id":"g03","niveau":"grands","type":"qcm","question":"Quel âge avait Jésus quand il a commencé son ministère ?","choix":["Environ trente ans","Environ vingt ans","Environ trente-trois ans","Environ quarante ans"],"bonne":0,"explication":"Environ trente ans. Luc chapitre 3, verset 23 : « Quand Jésus commença son ministère, il avait environ 30 ans. »","reference":"Luc 3:23","source":"https://wol.jw.org/fr/wol/b/r30/lp-f/nwtsty/42/3","origine":"president"},{"id":"g04","niveau":"grands","type":"qcm","question":"Quel jour Jésus est-il mort ?","choix":["Le 14 nisan de l'an 30","Le 10 nisan de l'an 33","Le 15 nisan de l'an 36","Le 14 nisan de l'an 33"],"bonne":3,"explication":"Le 14 nisan de l'an 33 de notre ère, un vendredi de printemps, vers trois heures de l'après-midi. Luc chapitre 23, versets 44 à 46.","reference":"Luc 23:44-46","source":"https://wol.jw.org/fr/wol/d/r30/lp-f/1200002451","origine":"president","exclut":["g05"]},{"id":"g05","niveau":"grands","type":"qcm","question":"Quel âge avait Jésus à sa mort ?","choix":["Trente ans","Environ trente-trois ans et demi","Quarante ans","Environ trente et un ans"],"bonne":1,"explication":"Environ trente-trois ans et demi : il a commencé son ministère vers trente ans, et ce ministère a duré trois ans et demi. Luc chapitre 3, verset 23.","reference":"Luc 3:23","source":"https://wol.jw.org/fr/wol/d/r30/lp-f/1200002451","origine":"president","exclut":["g04"]},{"id":"g06","niveau":"grands","type":"qcm","question":"D'après Révélation chapitre 21, verset 14, quels noms sont inscrits sur les douze pierres de fondation de la muraille de la ville sainte ?","choix":["Les noms des douze tribus d'Israël","Les noms des douze anges","Les noms des douze prophètes","Les noms des douze apôtres de l'Agneau"],"bonne":3,"explication":"Les noms des douze apôtres de l'Agneau. Les noms des douze tribus, eux, sont inscrits sur les portes de la ville, au verset 12.","reference":"Révélation 21:12, 14","source":"https://wol.jw.org/fr/wol/b/r30/lp-f/nwtsty/66/21","origine":"president"},{"id":"g07","niveau":"grands","type":"qcm","question":"Comment appelle-t-on, dans la Bible, ceux qui régneront avec Jésus dans le ciel ?","choix":["La grande foule","Les autres brebis","Les 144 000","Les Lévites"],"bonne":2,"explication":"Les 144 000. Jean les a vus avec l'Agneau sur le mont Sion, et Jésus les appelle aussi son « petit troupeau ». Révélation chapitre 14, verset 1, et Luc chapitre 12, verset 32.","reference":"Révélation 14:1 ; Luc 12:32","source":"https://wol.jw.org/fr/wol/b/r30/lp-f/nwtsty/66/14","origine":"president"},{"id":"g08","niveau":"grands","type":"qcm","question":"Combien de temps durera le règne de Jésus avant qu'il remette le Royaume à son Père ?","choix":["Mille ans","Cent ans","Sept ans","Il ne le remettra jamais"],"bonne":0,"explication":"Mille ans. Ceux qui ont part à la première résurrection régneront avec lui pendant les mille ans. Ensuite, il remettra le Royaume à son Dieu et Père. Révélation chapitre 20, verset 6, et Première lettre aux Corinthiens, chapitre 15, verset 24.","reference":"Révélation 20:6 ; 1 Corinthiens 15:24","source":"https://wol.jw.org/fr/wol/b/r30/lp-f/nwtsty/66/20","origine":"president"},{"id":"g09","niveau":"grands","type":"qcm","question":"En quelle année Jésus a-t-il été intronisé comme Roi dans le ciel ?","choix":["1919","1931","1914","1975"],"bonne":2,"explication":"En octobre 1914. C'est la fin des « sept temps » annoncés dans le rêve de l'arbre, en Daniel chapitre 4, versets 16 et 17.","reference":"Daniel 4:16, 17","source":"https://wol.jw.org/fr/wol/d/r30/lp-f/1102026527","origine":"president","exclut":["g10"]},{"id":"g10","niveau":"grands","type":"ouverte","question":"Quelle prophétie de Daniel donne l'année exacte de l'intronisation du Christ dans le ciel ? Explique le calcul.","choix":[],"bonne":null,"reponse_attendue":"Le rêve du grand arbre abattu, en Daniel chapitre 4. Les « sept temps » durent deux mille cinq cent vingt ans : ils commencent en octobre 607 avant notre ère, quand Jérusalem est détruite, et se terminent en octobre 1914, quand Jésus commence à régner.","explication":"Les sept temps, c'est le « temps accordé aux nations » dont parle Jésus en Luc chapitre 21, verset 24. Ils vont d'octobre 607 avant notre ère à octobre 1914 de notre ère. Daniel chapitre 4, versets 16 et 17.","reference":"Daniel 4:16, 17 ; Luc 21:24","source":"https://wol.jw.org/fr/wol/d/r30/lp-f/1102026527","origine":"president","juge_minimum":"Daniel 4, les sept temps, de 607 avant notre ère à 1914. Bonus : 2 520 ans.","exclut":["g09"]},{"id":"g11","niveau":"grands","type":"ouverte","question":"Quelle prophétie de Daniel donne l'année exacte de l'arrivée du Messie ? Quelle est cette année ?","choix":[],"bonne":null,"reponse_attendue":"La prophétie des soixante-dix semaines, en Daniel chapitre 9. Elle part de 455 avant notre ère, quand est donné l'ordre de rebâtir Jérusalem. Soixante-neuf semaines d'années, soit quatre cent quatre-vingt-trois ans, mènent à l'an 29 de notre ère : Jésus est baptisé et devient le Messie.","explication":"Le Messie, le Guide, arrive en l'an 29. Au milieu de la dernière semaine, en l'an 33, il est mis à mort. Daniel chapitre 9, versets 24 à 27.","reference":"Daniel 9:24-27","source":"https://wol.jw.org/fr/wol/d/r30/lp-f/1102026527","origine":"president","juge_minimum":"Daniel 9, les soixante-dix semaines, et l'an 29. Bonus : départ en 455 avant notre ère.","exclut":["g02"]},{"id":"g12","niveau":"grands","type":"ouverte","question":"Quand s'est accomplie la prophétie de Malachie chapitre 3, versets 1 à 3 ?","choix":[],"bonne":null,"reponse_attendue":"De 1914 au début de 1919. Jésus, intronisé, est venu avec son Père inspecter le temple spirituel. Les chrétiens oints, les « fils de Lévi », ont traversé une période d'épreuves et en sont sortis affinés et purifiés.","explication":"Jéhovah, le Grand Affineur, a purifié ses serviteurs comme on affine l'or et l'argent. Et cet affinage continue tout au long des derniers jours. Malachie chapitre 3, versets 1 à 3.","reference":"Malachie 3:1-3","source":"https://wol.jw.org/fr/wol/d/r30/lp-f/1102014249","origine":"president","juge_minimum":"De 1914 au début de 1919. Bonus : Jésus inspecte le temple, les oints sont purifiés."},{"id":"g13","niveau":"grands","type":"ouverte","question":"Quel événement annoncé en Première lettre aux Thessaloniciens, chapitre 5, verset 3, attendons-nous encore ? Et sait-on exactement quand il viendra ?","choix":[],"bonne":null,"reponse_attendue":"La proclamation « Paix et sécurité ! » par les nations, suivie d'une destruction subite. On ne sait pas exactement quand elle sera faite : elle pourrait venir avant ou après la destruction des fausses religions, qui marque le début de la grande tribulation. L'important est de rester éveillés.","explication":"La Tour de Garde de février 2026 explique que les deux possibilités restent ouvertes. Ce qui compte le plus, ce n'est pas le moment exact, mais notre fidélité à Dieu. Première lettre aux Thessaloniciens, chapitre 5, versets 3 à 6.","reference":"1 Thessaloniciens 5:3-6","source":"https://wol.jw.org/fr/wol/d/r30/lp-f/2026285","origine":"president","juge_minimum":"La proclamation « Paix et sécurité ! ». Accepter aussi « juste avant la grande tribulation » : c'était l'explication donnée jusqu'en 2026. Bonus : on ne sait pas exactement quand, peut-être après la destruction des fausses religions."},{"id":"g14","niveau":"grands","type":"ouverte","question":"Genèse chapitre 2 dit que Dieu se reposa le septième jour, mais Jésus dit en Jean chapitre 5, verset 17 : « Mon Père a continué de travailler jusqu'à maintenant. » Comment concilier ces deux versets ?","choix":[],"bonne":null,"reponse_attendue":"Le contexte de la Genèse montre que Dieu s'est reposé de son œuvre de création matérielle concernant la terre. Jésus, lui, parle des autres œuvres de Dieu : il a inspiré la Bible, il guide et soutient les humains. Dieu a cessé de créer sur la terre, mais il n'a jamais cessé de travailler.","explication":"Il n'y a pas de contradiction : les deux versets ne parlent pas du même travail. Genèse chapitre 2, versets 2 et 3, et Jean chapitre 5, verset 17.","reference":"Genèse 2:1-3 ; Jean 5:17","source":"https://wol.jw.org/fr/wol/d/r30/lp-f/502014102","origine":"president","juge_minimum":"Les deux versets ne parlent pas du même travail : Dieu a fini de créer sur la terre, mais il continue d'agir."},{"id":"g15","niveau":"grands","type":"ouverte","question":"D'après Matthieu chapitre 10, verset 23, réussirons-nous à faire connaître la bonne nouvelle du Royaume à chaque personne sur terre avant que vienne la fin ?","choix":[],"bonne":null,"reponse_attendue":"Non. Jésus a dit à ses disciples qu'ils n'auraient pas terminé le tour des villes avant qu'il arrive. Nous prêchons dans le monde entier, mais des millions de personnes vivent là où notre activité est sévèrement limitée, et des centaines de bébés naissent chaque minute.","explication":"La bonne nouvelle est prêchée sur toute la terre, en témoignage pour toutes les nations, et le site jw.org la rend accessible à la majorité des humains. Mais nous n'aurons pas prêché à chaque personne avant que Jésus vienne juger. Matthieu chapitre 10, verset 23, et chapitre 24, verset 14.","reference":"Matthieu 10:23 ; 24:14","source":"https://wol.jw.org/fr/wol/d/r30/lp-f/2024405","origine":"president","juge_minimum":"Non : Jésus a dit qu'on n'aurait pas fini le tour des villes avant qu'il vienne. Bonus : une raison (pays où l'activité est limitée, naissances)."},{"id":"g16","niveau":"grands","type":"qcm","question":"Selon la chronologie biblique, il y a combien d'années environ qu'Adam a été créé ?","choix":["Environ quatre mille ans","Un peu plus de six mille ans","Environ dix mille ans","Des millions d'années"],"bonne":1,"explication":"Un peu plus de six mille ans. Adam a été créé en 4026 avant notre ère, soit il y a environ six mille cinquante ans. Les âges donnés en Genèse chapitre 5 permettent ce calcul.","reference":"Genèse 5","source":"https://wol.jw.org/fr/wol/d/r30/lp-f/1200000970","origine":"president"},{"id":"g17","niveau":"grands","type":"qcm","question":"Depuis quelle année le peuple de Dieu s'appelle-t-il Témoins de Jéhovah ?","choix":["1914","1919","1942","1931"],"bonne":3,"explication":"Depuis 1931. Le 26 juillet, lors d'une assemblée aux États-Unis, les Étudiants de la Bible ont adopté avec joie ce nom, basé sur Isaïe chapitre 43, verset 10.","reference":"Isaïe 43:10","source":"https://wol.jw.org/fr/wol/d/r30/lp-f/1102014243","origine":"president"},{"id":"g18","niveau":"grands","type":"qcm","question":"Qui fut le dernier roi de la lignée de David à régner à Jérusalem ?","choix":["Joachim","Salomon","Sédécias","Saül"],"bonne":2,"explication":"Sédécias. Après lui, Jéhovah a annoncé que la couronne n'appartiendrait à personne « jusqu'à ce que vienne celui qui a le droit légal ». Ce roi, c'est Jésus. Ézéchiel chapitre 21, verset 27.","reference":"Jérémie 52:1 ; Ézéchiel 21:27","source":"https://wol.jw.org/fr/wol/d/r30/lp-f/2011605","origine":"president"},{"id":"g19","niveau":"grands","type":"qcm","question":"Le roi David a commis un péché très grave, et selon la Loi de Moïse il aurait mérité la mort. Ce péché concernait la femme d'un de ses soldats. Comment s'appelait-elle ?","choix":["Dalila","Bethsabée","Esther","Noémi"],"bonne":1,"explication":"Bethsabée, la femme d'Urie. David s'est sincèrement repenti, et Jéhovah lui a pardonné : il n'a pas été mis à mort, même s'il a subi les conséquences de son péché. Deuxième livre de Samuel, chapitre 12, verset 13.","reference":"2 Samuel 11:3 ; 12:13","source":"https://wol.jw.org/fr/wol/d/r30/lp-f/2007686","origine":"president"},{"id":"g20","niveau":"grands","type":"qcm","question":"Comment Samson est-il mort ?","choix":["De vieillesse, dans sa maison","Dans un combat contre un lion","Noyé dans la mer","En faisant tomber le temple de Dagon"],"bonne":3,"explication":"En faisant tomber le temple de Dagon. Prisonnier des Philistins, il a supplié Jéhovah de lui rendre sa force une dernière fois. Il a poussé les deux colonnes, le temple s'est écroulé, et Samson est mort avec les ennemis du peuple de Dieu. Juges chapitre 16, versets 28 à 30.","reference":"Juges 16:28-30","source":"https://wol.jw.org/fr/wol/b/r30/lp-f/nwtsty/7/16","origine":"president"},{"id":"g21","niveau":"grands","type":"qcm","question":"Combien de temps Noé et sa famille sont-ils restés dans l'arche ?","choix":["Quarante jours","Cent cinquante jours","Un peu plus d'un an","Sept ans"],"bonne":2,"explication":"Un peu plus d'un an : trois cent soixante-dix jours. La pluie est tombée quarante jours, mais il a fallu bien plus longtemps pour que les eaux baissent et que la terre sèche. Genèse chapitre 7, verset 11, et chapitre 8, versets 13 et 14.","reference":"Genèse 7:11 ; 8:13, 14","source":"https://wol.jw.org/fr/wol/d/r30/lp-f/1200001150","origine":"instructeur"},{"id":"g22","niveau":"grands","type":"qcm","question":"Après sa résurrection, Jésus a demandé trois fois à Pierre s'il l'aimait. Qu'a-t-il voulu lui faire comprendre ?","choix":["Qu'il doutait encore de lui et voulait le mettre à l'épreuve","Qu'il lui avait pardonné et qu'il devait nourrir ses brebis","Qu'il pouvait retourner tranquillement à son ancien métier de pêcheur","Qu'il le nommait chef, au-dessus de tous les autres apôtres"],"bonne":1,"explication":"Qu'il lui avait pardonné, et que son amour devait le pousser à prendre soin de ses brebis. La nuit de l'arrestation de Jésus, Pierre l'avait renié trois fois. Après sa résurrection, au bord de la mer de Galilée, Jésus lui a permis trois fois de dire qu'il l'aimait, puis il lui a confié le soin de ses disciples. Jean chapitre 21, versets 15 à 17.","reference":"Jean 21:15-17","source":"https://wol.jw.org/fr/wol/d/r30/lp-f/1001070689","origine":"instructeur","exclut":["m12","p15"]},{"id":"p23","niveau":"petits","type":"qcm","question":"Avec quoi Jéhovah a-t-il fait le premier homme, Adam ?","choix":["De la poussière","Du bois","Des pierres"],"bonne":0,"explication":"Avec de la poussière ! Puis Jéhovah a soufflé dans ses narines, et Adam est devenu vivant. Genèse chapitre 2, verset 7.","reference":"Genèse 2:7","source":"https://wol.jw.org/fr/wol/d/r30/lp-f/1102016012","origine":"instructeur"},{"id":"p24","niveau":"petits","type":"qcm","question":"Quel animal Satan a-t-il fait parler pour tromper Ève ?","choix":["Un lion","Un serpent","Un singe"],"bonne":1,"explication":"Un serpent. Les serpents ne parlent pas : c'est Satan, un ange méchant, qui l'a fait parler pour mentir à Ève. Genèse chapitre 3, versets 1 à 5.","reference":"Genèse 3:1-5","source":"https://wol.jw.org/fr/wol/d/r30/lp-f/1102016013","origine":"instructeur"},{"id":"p25","niveau":"petits","type":"qcm","question":"À Babel, des gens construisaient une très grande tour. Comment Jéhovah les a-t-il arrêtés ?","choix":["Avec une grosse pluie","Avec des langues différentes","Avec un grand vent"],"bonne":1,"explication":"Jéhovah les a fait parler des langues différentes. Ils ne se comprenaient plus, alors ils ont arrêté de construire. Genèse chapitre 11, versets 7 à 9.","reference":"Genèse 11:7-9","source":"https://wol.jw.org/fr/wol/d/r30/lp-f/1102016017","origine":"instructeur"},{"id":"p26","niveau":"petits","type":"qcm","question":"La femme de Loth a regardé en arrière. Qu'est-elle devenue ?","choix":["Un arbre","Un oiseau","Une statue de sel"],"bonne":2,"explication":"Une statue de sel. Les anges avaient dit de ne pas regarder derrière, mais elle a désobéi. Genèse chapitre 19, verset 26.","reference":"Genèse 19:26","source":"https://wol.jw.org/fr/wol/d/r30/lp-f/1102016020","origine":"instructeur"},{"id":"p27","niveau":"petits","type":"qcm","question":"Quel animal Jéhovah a-t-il fait parler pour arrêter Balaam ?","choix":["Son chien","Son ânesse","Son chameau"],"bonne":1,"explication":"Son ânesse ! Elle voyait l'ange de Jéhovah sur la route, mais Balaam, lui, ne le voyait pas. Nombres chapitre 22, versets 28 à 31.","reference":"Nombres 22:28-31","source":"https://wol.jw.org/fr/wol/d/r30/lp-f/1102016038","origine":"instructeur"},{"id":"p28","niveau":"petits","type":"qcm","question":"Qu'ont rapporté les espions du pays de Canaan ?","choix":["De l'or","Des fruits","Des moutons"],"bonne":1,"explication":"Des fruits ! Des raisins, des grenades et des figues. Le pays que Jéhovah donnait à son peuple était un très bon pays. Nombres chapitre 13, verset 23.","reference":"Nombres 13:23","source":"https://wol.jw.org/fr/wol/d/r30/lp-f/1102016036","origine":"instructeur"},{"id":"p29","niveau":"petits","type":"qcm","question":"Gédéon a demandé un signe à Jéhovah. Qu'a-t-il posé par terre ?","choix":["Une peau de mouton","Une grande épée","Un panier de fruits"],"bonne":0,"explication":"Une peau de mouton. Le matin, elle était mouillée de rosée, et le sol était sec. Gédéon a su que Jéhovah l'avait choisi. Juges chapitre 6, versets 37 et 38.","reference":"Juges 6:37, 38","source":"https://wol.jw.org/fr/wol/d/r30/lp-f/1102016044","origine":"instructeur"},{"id":"p30","niveau":"petits","type":"qcm","question":"Avec quoi David a-t-il vaincu le géant Goliath ?","choix":["Une épée","Un arc","Une fronde"],"bonne":2,"explication":"Avec une fronde et une pierre. Goliath avait une épée et une lance, mais David est venu au nom de Jéhovah. Premier livre de Samuel, chapitre 17, versets 45 et 49.","reference":"1 Samuel 17:45, 49","source":"https://wol.jw.org/fr/wol/d/r30/lp-f/1102016050","origine":"instructeur"},{"id":"p31","niveau":"petits","type":"qcm","question":"Au mont Carmel, Élie a prié. Qu'est-ce que Jéhovah a envoyé du ciel ?","choix":["De la neige","Du feu","Du vent"],"bonne":1,"explication":"Du feu ! Il a brûlé l'offrande d'Élie. Baal, lui, n'avait rien répondu. Alors tout le peuple a crié : Jéhovah est le vrai Dieu ! Premier livre des Rois, chapitre 18, versets 38 et 39.","reference":"1 Rois 18:38, 39","source":"https://wol.jw.org/fr/wol/d/r30/lp-f/1102016056","origine":"instructeur"},{"id":"p32","niveau":"petits","type":"qcm","question":"Esther a été très courageuse pour sauver son peuple. Qui était-elle ?","choix":["Une bergère","Une reine","Une boulangère"],"bonne":1,"explication":"Une reine. Le roi l'avait choisie. Elle est allée le voir sans être invitée, en risquant sa vie, pour sauver les Juifs. Esther chapitre 2, verset 17, et chapitre 4, verset 16.","reference":"Esther 2:17 ; 4:16","source":"https://wol.jw.org/fr/wol/d/r30/lp-f/1102016075","origine":"instructeur"},{"id":"p33","niveau":"petits","type":"qcm","question":"Une nuit, des anges ont annoncé la naissance de Jésus. À qui ?","choix":["À des pêcheurs","À des soldats","À des bergers"],"bonne":2,"explication":"À des bergers qui gardaient leurs troupeaux près de Bethléem. Ils sont tout de suite allés voir le bébé. Luc chapitre 2, versets 8 à 11.","reference":"Luc 2:8-11","source":"https://wol.jw.org/fr/wol/d/r30/lp-f/1102016080","origine":"instructeur","exclut":["g30"]},{"id":"p34","niveau":"petits","type":"qcm","question":"Pour protéger Jésus du méchant roi Hérode, où sa famille est-elle partie ?","choix":["En Égypte","À Ninive","À Rome"],"bonne":0,"explication":"En Égypte. Jéhovah a averti son papa dans un rêve. Toute la famille est partie tout de suite, et Jésus était en sécurité. Matthieu chapitre 2, versets 13 et 14.","reference":"Matthieu 2:13, 14","source":"https://wol.jw.org/fr/wol/d/r30/lp-f/1102016081","origine":"instructeur"},{"id":"p35","niveau":"petits","type":"qcm","question":"Quel apôtre est sorti du bateau pour marcher sur l'eau vers Jésus ?","choix":["Pierre","Jean","Thomas"],"bonne":0,"explication":"Pierre. Mais il a regardé la tempête, il a eu peur et il a commencé à couler. Jésus lui a attrapé la main. Matthieu chapitre 14, versets 29 à 31.","reference":"Matthieu 14:29-31","source":"https://wol.jw.org/fr/wol/d/r30/lp-f/1102016094","origine":"instructeur"},{"id":"p36","niveau":"petits","type":"qcm","question":"Quand Jésus est monté au ciel, qu'est-ce qui l'a caché ?","choix":["Un nuage","Un arbre","Une montagne"],"bonne":0,"explication":"Un nuage. Les apôtres le regardaient monter, puis un nuage l'a caché à leurs yeux. C'était au mont des Oliviers. Actes chapitre 1, verset 9.","reference":"Actes 1:9","source":"https://wol.jw.org/fr/wol/d/r30/lp-f/1102016103","origine":"instructeur"},{"id":"p37","niveau":"petits","type":"qcm","question":"Paul et Silas chantaient en prison. Que s'est-il passé au milieu de la nuit ?","choix":["Un incendie","Un tremblement de terre","Une inondation"],"bonne":1,"explication":"Un grand tremblement de terre ! Les portes se sont ouvertes. Le gardien de la prison a appris la vérité, et il s'est fait baptiser avec sa famille. Actes chapitre 16, versets 25 à 33.","reference":"Actes 16:25-33","source":"https://wol.jw.org/fr/wol/d/r30/lp-f/1102016109","origine":"instructeur"},{"id":"p38","niveau":"petits","type":"qcm","question":"Une nuit, quelqu'un a appelé le petit Samuel. Qui était-ce ?","choix":["Sa maman","Jéhovah","Le vieux prêtre"],"bonne":1,"explication":"C'était Jéhovah ! Samuel a répondu : Parle, car ton serviteur écoute. Il était jeune, mais il a eu le courage de répéter tout le message. Premier livre de Samuel, chapitre 3, versets 10 et 18.","reference":"1 Samuel 3:10, 18","source":"https://wol.jw.org/fr/wol/d/r30/lp-f/1102025921","origine":"instructeur"},{"id":"p39","niveau":"petits","type":"qcm","question":"Abigaïl est allée calmer David et ses hommes en colère. Qu'a-t-elle apporté ?","choix":["Des épées","Beaucoup à manger","Des bijoux"],"bonne":1,"explication":"Beaucoup à manger, chargé sur des ânes. Elle a parlé à David avec douceur, et il s'est calmé. Premier livre de Samuel, chapitre 25, versets 18 et 32 à 35.","reference":"1 Samuel 25:18, 32-35","source":"https://wol.jw.org/fr/wol/d/r30/lp-f/1102025924","origine":"instructeur"},{"id":"p40","niveau":"petits","type":"qcm","question":"Une maman très pauvre a fait un petit pain pour Élie avec ce qui lui restait. Qu'est-ce qui ne s'est plus vidé chez elle ?","choix":["Sa farine et son huile","Son puits d'eau","Son coffre d'argent"],"bonne":0,"explication":"Sa farine et son huile ! C'était pendant une grande sécheresse. Jéhovah a nourri cette maman, son fils et Élie jusqu'au retour de la pluie. Premier livre des Rois, chapitre 17, versets 13 à 16.","reference":"1 Rois 17:13-16","source":"https://wol.jw.org/fr/wol/d/r30/lp-f/1102025930","origine":"instructeur"},{"id":"p41","niveau":"petits","type":"qcm","question":"Naamân était très malade. Dans sa maison, qui a parlé du prophète de Jéhovah ?","choix":["Une petite fille","Un grand roi","Un vieux soldat"],"bonne":0,"explication":"Une petite fille israélite, qui servait la femme de Naamân. Elle a eu le courage de parler du prophète de son Dieu, et Naamân a été guéri. Deuxième livre des Rois, chapitre 5, versets 2 et 3.","reference":"2 Rois 5:2, 3","source":"https://wol.jw.org/fr/wol/d/r30/lp-f/1102025931","origine":"instructeur"},{"id":"p42","niveau":"petits","type":"qcm","question":"Le serviteur d'Élisée avait peur d'une armée. Qu'a-t-il vu sur les montagnes ?","choix":["Des chevaux de feu","Des lions","Des géants"],"bonne":0,"explication":"Des chevaux et des chars de feu, tout autour d'Élisée ! C'étaient les anges de Jéhovah. Ceux qui sont avec nous sont plus nombreux, avait dit Élisée. Deuxième livre des Rois, chapitre 6, versets 16 et 17.","reference":"2 Rois 6:16, 17","source":"https://wol.jw.org/fr/wol/d/r30/lp-f/1102025932","origine":"instructeur"},{"id":"m23","niveau":"moyens","type":"qcm","question":"La Bible dit que Dieu a pris Hénoch. Que s'est-il passé ?","choix":["Il est monté au ciel sans mourir","Il s'est endormi paisiblement dans la mort","Il a été enlevé par ses ennemis","Il est parti vivre seul dans le désert"],"bonne":1,"explication":"Il s'est endormi paisiblement dans la mort. Des gens violents voulaient probablement lui faire du mal, et Jéhovah l'a protégé. Il n'est pas monté au ciel : Jésus a dit que personne n'y était monté. Genèse chapitre 5, verset 24, et Jean chapitre 3, verset 13.","reference":"Genèse 5:24 ; Jean 3:13","source":"https://wol.jw.org/fr/wol/d/r30/lp-f/1102025901","origine":"instructeur"},{"id":"m24","niveau":"moyens","type":"qcm","question":"La femme de Putiphar voulait pousser Joseph à mal agir avec elle. Pourquoi a-t-il refusé ?","choix":["Il avait peur d'être puni par son maître","Il ne voulait pas pécher contre Dieu","Il voulait retourner chez son père","Il espérait être libéré plus vite"],"bonne":1,"explication":"Il ne voulait pas pécher contre Dieu, ni trahir Putiphar. Elle insistait jour après jour, et un jour Joseph s'est enfui. Genèse chapitre 39, versets 8 à 12.","reference":"Genèse 39:8-12","source":"https://wol.jw.org/fr/wol/d/r30/lp-f/1102025908","origine":"instructeur"},{"id":"m25","niveau":"moyens","type":"qcm","question":"Pharaon a ordonné à deux sages-femmes de tuer les bébés garçons hébreux. Elles ont refusé. Comment s'appelaient-elles ?","choix":["Miriam et Jokébed","Shifra et Poua","Marthe et Marie","Déborah et Jaël"],"bonne":1,"explication":"Shifra et Poua. Elles craignaient Dieu plus que le roi d'Égypte, et elles ont sauvé les bébés. Jéhovah leur a fait du bien et leur a donné des enfants. Exode chapitre 1, versets 15 à 21.","reference":"Exode 1:15-21","source":"https://wol.jw.org/fr/wol/d/r30/lp-f/1102025909","origine":"instructeur"},{"id":"m26","niveau":"moyens","type":"qcm","question":"Caleb avait été l'un des deux espions fidèles. Quel âge avait-il quand il a demandé la ville d'Hébron ?","choix":["40 ans","60 ans","85 ans","120 ans"],"bonne":2,"explication":"85 ans ! Quarante-cinq ans plus tôt, les mauvais espions disaient que les géants d'Hébron étaient trop forts. Caleb a dit : Jéhovah sera avec moi. Et il a pris la ville. Josué chapitre 14, versets 10 à 12.","reference":"Josué 14:10-12","source":"https://wol.jw.org/fr/wol/d/r30/lp-f/1102025912","origine":"instructeur"},{"id":"m27","niveau":"moyens","type":"qcm","question":"Le septième jour, combien de fois les Israélites ont-ils fait le tour de Jéricho ?","choix":["Une fois","Trois fois","Sept fois","Douze fois"],"bonne":2,"explication":"Sept fois. Les six jours d'avant, ils en avaient fait le tour une fois par jour. Puis ils ont poussé un grand cri, et la muraille s'est effondrée. Josué chapitre 6, versets 15, 16 et 20.","reference":"Josué 6:15, 16, 20","source":"https://wol.jw.org/fr/wol/d/r30/lp-f/1102025913","origine":"instructeur","exclut":["m39"]},{"id":"m28","niveau":"moyens","type":"qcm","question":"Mefibosheth, le fils de Jonathan, était handicapé. Qu'a décidé le roi David ?","choix":["Il mangerait toujours à la table du roi","Il deviendrait le chef de l'armée","Il serait guéri par un prophète","Il habiterait loin de Jérusalem"],"bonne":0,"explication":"Il mangerait tous les jours à la table du roi. David tenait la promesse faite des années plus tôt à son ami Jonathan : prendre soin de sa famille. Deuxième livre de Samuel, chapitre 9, versets 7 et 13.","reference":"2 Samuel 9:7, 13","source":"https://wol.jw.org/fr/wol/d/r30/lp-f/1102025927","origine":"instructeur"},{"id":"m29","niveau":"moyens","type":"qcm","question":"À Babylone, qu'ont mangé Daniel et ses trois amis pendant dix jours, à la place des plats du roi ?","choix":["Du pain et du miel","Des légumes, avec de l'eau","Du poisson grillé","Des fruits secs et du lait"],"bonne":1,"explication":"Des légumes, et ils ne buvaient que de l'eau. Au bout de dix jours, ils avaient meilleure mine que tous les autres jeunes. Jéhovah les a bénis. Daniel chapitre 1, versets 12 à 15.","reference":"Daniel 1:12-15","source":"https://wol.jw.org/fr/wol/d/r30/lp-f/1102025937","origine":"instructeur"},{"id":"m30","niveau":"moyens","type":"qcm","question":"Sous le roi Josias, qu'a découvert le grand prêtre Hilkia pendant les réparations du temple ?","choix":["Un trésor d'or caché","Le livre de la Loi","Les tables de pierre","L'épée de Goliath"],"bonne":1,"explication":"Le livre de la Loi que Jéhovah avait donnée à Moïse. Josias a été bouleversé en l'écoutant, et il a aidé le peuple à revenir à Jéhovah. Deuxième livre des Rois, chapitre 22, versets 8 à 13.","reference":"2 Rois 22:8-13","source":"https://wol.jw.org/fr/wol/d/r30/lp-f/1102025936","origine":"instructeur"},{"id":"m31","niveau":"moyens","type":"qcm","question":"Qui a été le premier disciple de Jésus à être tué à cause de sa foi ?","choix":["Jacques","Pierre","Étienne","Paul"],"bonne":2,"explication":"Étienne. Devant le Sanhédrin, il a parlé avec courage. On l'a lapidé, et il a prié : ne leur compte pas ce péché. Actes chapitre 7, versets 59 et 60.","reference":"Actes 7:59, 60","source":"https://wol.jw.org/fr/wol/d/r30/lp-f/1102025948","origine":"instructeur"},{"id":"m32","niveau":"moyens","type":"qcm","question":"Les apôtres ont donné un surnom à un disciple : Barnabé. Que veut dire ce surnom ?","choix":["Fils de consolation","Fils du tonnerre","Homme de paix","Ami fidèle"],"bonne":0,"explication":"Fils de consolation. Barnabé savait réconforter. Il a même eu le courage d'accueillir Saul, l'ancien persécuteur, quand les autres avaient peur de lui. Actes chapitre 4, verset 36, et chapitre 9, verset 27.","reference":"Actes 4:36 ; 9:27","source":"https://wol.jw.org/fr/wol/d/r30/lp-f/1102025951","origine":"instructeur"},{"id":"m33","niveau":"moyens","type":"qcm","question":"La Bible a donné, environ 200 ans à l'avance, le nom du roi qui prendrait Babylone. Qui est-ce ?","choix":["Nabuchodonosor","Cyrus","Salomon","Alexandre le Grand"],"bonne":1,"explication":"Cyrus, roi de Perse. En 539 avant notre ère, son armée a détourné le fleuve et elle est entrée par les portes laissées ouvertes. Isaïe chapitre 44, verset 27, jusqu'au chapitre 45, verset 2.","reference":"Isaïe 44:27–45:2","source":"https://wol.jw.org/fr/wol/d/r30/lp-f/1102021203","origine":"instructeur"},{"id":"m34","niveau":"moyens","type":"qcm","question":"Combien de fois environ le nom de Jéhovah est-il écrit dans la Bible ?","choix":["Plus de 70 fois","Plus de 700 fois","Plus de 7 000 fois","Plus de 70 000 fois"],"bonne":2,"explication":"Plus de 7 000 fois ! C'est bien la preuve que Jéhovah veut qu'on connaisse son nom et qu'on l'utilise. Isaïe chapitre 42, verset 8.","reference":"Isaïe 42:8","source":"https://wol.jw.org/fr/wol/d/r30/lp-f/1102021204","origine":"instructeur","exclut":["g27"]},{"id":"m35","niveau":"moyens","type":"qcm","question":"Pendant combien de temps environ la Bible a-t-elle été écrite ?","choix":["40 ans","400 ans","1 600 ans","4 000 ans"],"bonne":2,"explication":"Environ 1 600 ans, de 1513 avant notre ère jusque vers l'an 98 de notre ère. Une quarantaine d'hommes l'ont écrite, et ils ne se contredisent pas, parce que Dieu en est l'Auteur. Deuxième lettre à Timothée, chapitre 3, verset 16.","reference":"2 Timothée 3:16","source":"https://wol.jw.org/fr/wol/d/r30/lp-f/1102021205","origine":"instructeur"},{"id":"m36","niveau":"moyens","type":"qcm","question":"Pourquoi la Bible appelle-t-elle Jésus le Fils unique de Dieu ?","choix":["Il est le seul à être né à Bethléem","Il est le seul créé directement par Jéhovah","Il est le seul à avoir été baptisé","Il est le seul à avoir fait des miracles"],"bonne":1,"explication":"Parce qu'il est le seul que Jéhovah a créé directement. Il a été créé en tout premier, et il a aidé son Père à créer tout le reste. Jean chapitre 3, verset 16, et Colossiens chapitre 1, verset 15.","reference":"Jean 3:16 ; Colossiens 1:15","source":"https://wol.jw.org/fr/wol/d/r30/lp-f/1102021215","origine":"instructeur"},{"id":"m37","niveau":"moyens","type":"qcm","question":"Qui sont les démons ?","choix":["Les âmes de méchants humains morts","Des anges qui se sont rebellés contre Dieu","Des monstres fabriqués par Satan","Des humains qui pratiquent la magie"],"bonne":1,"explication":"Des anges qui ont suivi Satan dans sa rébellion. Jéhovah les a chassés du ciel. Ils sont près de la terre, et leur destruction approche. Révélation chapitre 12, versets 9 et 12.","reference":"Révélation 12:9, 12","source":"https://wol.jw.org/fr/wol/d/r30/lp-f/1102021224","origine":"instructeur"},{"id":"m38","niveau":"moyens","type":"qcm","question":"Anne, la mère de Samuel, était triste de ne pas avoir d'enfant. Qui la faisait souffrir encore plus ?","choix":["L'autre femme de son mari","La mère de son mari","Une servante de la maison","Sa propre sœur aînée"],"bonne":0,"explication":"L'autre femme de son mari. Elle avait des enfants et se moquait d'Anne, surtout pendant le voyage de chaque année au tabernacle. Anne a tout confié à Jéhovah dans la prière. Premier livre de Samuel, chapitre 1, versets 6 et 7.","reference":"1 Samuel 1:6, 7","source":"https://wol.jw.org/fr/wol/d/r30/lp-f/1102013252","origine":"instructeur"},{"id":"m39","niveau":"moyens","type":"qcm","question":"Élie attendait la pluie. Combien de fois a-t-il envoyé son serviteur regarder vers la mer ?","choix":["Deux fois","Trois fois","Sept fois","Dix fois"],"bonne":2,"explication":"Sept fois. La septième fois, le serviteur a vu un petit nuage, de la taille d'une main d'homme. Pour Élie, c'était assez : Jéhovah allait agir. Premier livre des Rois, chapitre 18, versets 43 et 44.","reference":"1 Rois 18:43, 44","source":"https://wol.jw.org/fr/wol/d/r30/lp-f/1102013257","origine":"instructeur","exclut":["m27"]},{"id":"m40","niveau":"moyens","type":"qcm","question":"Jonas était fâché, assis près de Ninive. Qu'est-ce que Jéhovah a fait pousser en une nuit pour lui donner de l'ombre ?","choix":["Une courge","Un palmier","Un figuier","Un cèdre"],"bonne":0,"explication":"Une courge. Elle a séché dès le lendemain, et Jonas était triste pour elle. Jéhovah s'en est servi pour lui apprendre la miséricorde. Jonas chapitre 4, versets 6 à 10.","reference":"Jonas 4:6-10","source":"https://wol.jw.org/fr/wol/d/r30/lp-f/1102013260","origine":"instructeur","exclut":["g28"]},{"id":"m41","niveau":"moyens","type":"qcm","question":"Après la mort de Lazare, à qui Jésus a-t-il dit : « Je suis la résurrection et la vie » ?","choix":["À Marthe","À Marie de Magdala","À Pierre","À sa mère, Marie"],"bonne":0,"explication":"À Marthe, la sœur de Lazare. Elle lui a répondu : je crois que tu es le Christ, le Fils de Dieu. Malgré son chagrin, sa foi restait solide. Jean chapitre 11, versets 25 à 27.","reference":"Jean 11:25-27","source":"https://wol.jw.org/fr/wol/d/r30/lp-f/1102013266","origine":"instructeur"},{"id":"m42","niveau":"moyens","type":"qcm","question":"Pierre a demandé à Jésus s'il devait pardonner jusqu'à sept fois. Qu'a répondu Jésus ?","choix":["Oui, sept fois suffisent","Trois fois seulement","Jusqu'à soixante-dix-sept fois","Seulement s'il s'excuse"],"bonne":2,"explication":"Jusqu'à soixante-dix-sept fois. Jésus ne voulait pas qu'on compte : l'amour ne fixe pas de limite au pardon. Les chefs religieux, eux, enseignaient de pardonner trois fois seulement. Matthieu chapitre 18, versets 21 et 22.","reference":"Matthieu 18:21, 22","source":"https://wol.jw.org/fr/wol/d/r30/lp-f/1102013269","origine":"instructeur"},{"id":"g23","niveau":"grands","type":"ouverte","question":"D'après Hébreux chapitre 11, verset 4, Abel parle encore, bien qu'il soit mort. Grâce à quoi parle-t-il ? Et pourquoi son offrande a-t-elle plu à Dieu ?","choix":[],"bonne":null,"explication":"Abel est le premier humain à avoir manifesté la foi. Il a offert à Jéhovah ce qu'il avait de meilleur, avec un cœur sincère. Quand nous imitons sa foi, nous l'entendons encore nous parler. Hébreux chapitre 11, verset 4.","reference":"Hébreux 11:4 ; Genèse 4:4","source":"https://wol.jw.org/fr/wol/d/r30/lp-f/1102013271","origine":"instructeur","reponse_attendue":"Grâce à sa foi : il est le premier humain à l'avoir manifestée. Son offrande a plu à Dieu parce qu'il l'a faite par foi, avec de bonnes motivations : il a donné à Jéhovah ce qu'il avait de meilleur, les premiers-nés de son troupeau. Son exemple de foi nous parle encore aujourd'hui.","juge_minimum":"Grâce à sa foi. Bonus : il a offert le meilleur de ce qu'il avait, avec de bonnes motivations."},{"id":"g24","niveau":"grands","type":"qcm","question":"D'après Imitez leur foi, Abraham a peut-être connu un fidèle serviteur de Dieu qui avait vécu le Déluge. Qui est-ce ?","choix":["Hénoch","Mathusalem","Sem","Lamek"],"bonne":2,"explication":"Sem, un fils de Noé. Il avait vu plus de 400 ans d'histoire, dont le Déluge et la tour de Babel. Après le Déluge, Noé a appelé Jéhovah le Dieu de Sem. Genèse chapitre 9, verset 26.","reference":"Genèse 9:26","source":"https://wol.jw.org/fr/wol/d/r30/lp-f/1102013273","origine":"instructeur"},{"id":"g25","niveau":"grands","type":"ouverte","question":"Quand les fils de Samuel se sont montrés malhonnêtes, qu'ont réclamé les anciens d'Israël ? Et d'après Jéhovah, qui rejetaient-ils vraiment ?","choix":[],"bonne":null,"explication":"Les fils de Samuel acceptaient des pots-de-vin. Le peuple a voulu un roi, comme les autres nations. En réalité, c'est Jéhovah qu'il rejetait comme roi. Premier livre de Samuel, chapitre 8, versets 1 à 7.","reference":"1 Samuel 8:1-7","source":"https://wol.jw.org/fr/wol/d/r30/lp-f/1102013254","origine":"instructeur","reponse_attendue":"Ils ont réclamé un roi, pour être jugés comme toutes les nations. Jéhovah a dit à Samuel : ce n'est pas toi qu'ils ont rejeté, mais c'est moi qu'ils ont rejeté comme roi.","juge_minimum":"Un roi, comme les autres nations. Ils rejetaient Jéhovah lui-même comme roi."},{"id":"g26","niveau":"grands","type":"qcm","question":"Après avoir fui la reine Jézabel, Élie a marché 40 jours et 40 nuits. Jusqu'à quelle montagne ?","choix":["Le mont Carmel","Le mont Horeb","Le mont des Oliviers","Le mont Moria"],"bonne":1,"explication":"Le mont Horeb, c'est-à-dire le Sinaï, où Jéhovah s'était révélé à Moïse, des siècles plus tôt, dans le buisson en feu. Là, Jéhovah a consolé Élie par une voix calme et basse. Premier livre des Rois, chapitre 19, versets 8 à 12.","reference":"1 Rois 19:8-12","source":"https://wol.jw.org/fr/wol/d/r30/lp-f/1102013258","origine":"instructeur","exclut":["g27"]},{"id":"g27","niveau":"grands","type":"qcm","question":"Élie se croyait le seul fidèle qui restait. D'après Jéhovah, combien d'hommes en Israël ne s'étaient pas mis à genoux devant Baal ?","choix":["70","700","7 000","70 000"],"bonne":2,"explication":"Sept mille. Élie n'était pas seul ! Jéhovah lui a aussi donné Élisée, pour l'aider et lui succéder. Premier livre des Rois, chapitre 19, versets 16 et 18.","reference":"1 Rois 19:16, 18","source":"https://wol.jw.org/fr/wol/d/r30/lp-f/1102013258","origine":"instructeur","exclut":["g26","m34"]},{"id":"g28","niveau":"grands","type":"ouverte","question":"Quand la plante qui faisait de l'ombre à Jonas a séché, quelle leçon Jéhovah lui a-t-il donnée au sujet de Ninive ?","choix":[],"bonne":null,"explication":"Jonas tenait plus à une plante qu'à la vie de plus de 120 000 personnes. Jéhovah, qui leur donne la vie, voulait lui apprendre la miséricorde. Jonas chapitre 4, versets 10 et 11.","reference":"Jonas 4:10, 11","source":"https://wol.jw.org/fr/wol/d/r30/lp-f/1102013260","origine":"instructeur","reponse_attendue":"Jonas avait pitié d'une plante qu'il n'avait ni plantée ni entretenue. Jéhovah, qui a donné la vie aux Ninivites et pourvoit à leurs besoins, avait bien plus de raisons d'avoir pitié de Ninive, où vivaient plus de 120 000 personnes qui ne faisaient même pas la différence entre le bien et le mal, sans compter leurs nombreux animaux. Jonas devait apprendre la miséricorde.","juge_minimum":"Si Jonas a pitié d'une plante, Jéhovah a bien plus de raisons d'avoir pitié des habitants de Ninive. Bonus : plus de 120 000 personnes.","exclut":["m40"]},{"id":"g29","niveau":"grands","type":"qcm","question":"Les Juifs fêtent chaque année la victoire du temps d'Esther. D'où vient le nom de cette fête, Pourim ?","choix":["Des sorts tirés par Aman","Du nom du roi de Perse","D'un mot qui veut dire victoire","Du nom d'une ville de Perse"],"bonne":0,"explication":"Des sorts tirés par Aman. Pourim vient du mot pour, qui veut dire sort. Aman avait tiré au sort le jour où les Juifs devaient être tués. Grâce à Esther, ce jour est devenu celui de leur victoire. Esther chapitre 3, verset 7, et chapitre 9, versets 24 à 26.","reference":"Esther 3:7 ; 9:24-26","source":"https://wol.jw.org/fr/wol/d/r30/lp-f/1102013262","origine":"instructeur"},{"id":"g30","niveau":"grands","type":"qcm","question":"Après la visite des bergers à Bethléem, qu'a fait Marie de tout ce qu'elle avait entendu ?","choix":["Elle l'a raconté à tout le village","Elle y a réfléchi dans son cœur","Elle l'a écrit sur un rouleau","Elle a demandé l'avis des prêtres"],"bonne":1,"explication":"Elle retenait toutes ces paroles et y réfléchissait dans son cœur. Marie était une jeune femme réfléchie. Imitons-la en méditant sur ce que nous lisons dans la Bible. Luc chapitre 2, verset 19.","reference":"Luc 2:19","source":"https://wol.jw.org/fr/wol/d/r30/lp-f/1102013264","origine":"instructeur","exclut":["p33"]},{"id":"g31","niveau":"grands","type":"qcm","question":"Beaucoup de disciples avaient cessé de suivre Jésus. Il a demandé aux apôtres : « Vous ne voulez pas vous en aller, vous aussi ? » Qu'a répondu Pierre ?","choix":["Seigneur, vers qui irions-nous ?","Nous attendrons de mieux comprendre.","Nous resterons si tu nous expliques.","Nous allons y réfléchir ensemble."],"bonne":0,"explication":"Seigneur, vers qui irions-nous ? Tu as des paroles de vie éternelle. Pierre ne comprenait pas tout, mais il est resté fidèle. Jean chapitre 6, versets 67 et 68.","reference":"Jean 6:66-68","source":"https://wol.jw.org/fr/wol/d/r30/lp-f/1102013268","origine":"instructeur"},{"id":"g32","niveau":"grands","type":"ouverte","question":"Au mont Carmel, Élie a demandé au peuple : « Jusqu'à quand hésiterez-vous ? » Que voulait-il dire, et quelle leçon pour nous ?","choix":[],"bonne":null,"explication":"Le peuple essayait de suivre deux chemins à la fois. Mais Jéhovah ne partage avec personne l'adoration qui lui revient. Premier livre des Rois, chapitre 18, verset 21.","reference":"1 Rois 18:21","source":"https://wol.jw.org/fr/wol/d/r30/lp-f/1102013256","origine":"instructeur","reponse_attendue":"Les Israélites voulaient adorer Baal tout en demandant à Jéhovah de les bénir. Ils devaient choisir, parce que Jéhovah exige un attachement exclusif. Pour nous : ne pas laisser d'autres « baals » prendre dans notre vie la place qui revient au culte de Jéhovah.","juge_minimum":"On ne peut pas servir à la fois Jéhovah et Baal : il faut choisir. Bonus : une application actuelle, nos priorités."},{"id":"g33","niveau":"grands","type":"qcm","question":"D'après des biblistes, que signifie le nom Jéhovah ?","choix":["Il fait devenir","Le Tout-Puissant","Le Seigneur des seigneurs","Celui qui voit tout"],"bonne":0,"explication":"Il fait devenir. Jéhovah est la forme française d'un nom hébreu. Les autres réponses sont des titres : Dieu en a beaucoup, mais il n'a qu'un seul nom. Isaïe chapitre 42, verset 8.","reference":"Isaïe 42:8","source":"https://wol.jw.org/fr/wol/d/r30/lp-f/1102021204","origine":"instructeur"},{"id":"g34","niveau":"grands","type":"ouverte","question":"En Genèse chapitre 3, quel mensonge Satan a-t-il dit à Ève ? Et en quoi a-t-il sali la réputation de Jéhovah ?","choix":[],"bonne":null,"explication":"Vous ne mourrez absolument pas : c'était le premier mensonge. Satan a fait passer Jéhovah pour un Dieu qui prive les humains de ce qui est bon. Jéhovah prouvera que sa façon de gouverner est la meilleure. Genèse chapitre 3, versets 4 et 5, et Jean chapitre 8, verset 44.","reference":"Genèse 3:4, 5 ; Jean 8:44","source":"https://wol.jw.org/fr/wol/d/r30/lp-f/1102021226","origine":"instructeur","reponse_attendue":"Il lui a dit qu'elle ne mourrait pas et qu'elle serait comme Dieu. Il a laissé entendre que Jéhovah la privait de quelque chose de bon, et que les humains seraient plus heureux sans lui obéir. Il a ainsi calomnié Jéhovah, en le faisant passer pour un dirigeant injuste et sans amour.","juge_minimum":"Vous ne mourrez pas. Et il a fait passer Jéhovah pour un dirigeant injuste qui prive les humains de ce qui est bon."},{"id":"g35","niveau":"grands","type":"ouverte","question":"Pourquoi la Bible dit-elle que la vie de Jésus est une rançon correspondante ? Comment la mort d'un seul homme peut-elle sauver tous les humains ?","choix":[],"bonne":null,"explication":"Un homme parfait a fait entrer le péché et la mort. Un autre homme parfait a donné sa vie pour racheter ce qui avait été perdu. Première lettre à Timothée, chapitre 2, versets 5 et 6.","reference":"1 Timothée 2:5, 6 ; Romains 5:12","source":"https://wol.jw.org/fr/wol/d/r30/lp-f/1102021227","origine":"instructeur","reponse_attendue":"Adam était un homme parfait. En désobéissant, il a perdu la vie parfaite, pour lui et pour ses descendants, et nous sommes devenus prisonniers du péché et de la mort. Jésus, homme parfait lui aussi, a donné sa vie parfaite : un prix exactement équivalent. Il nous permet ainsi de retrouver ce qu'Adam a perdu.","juge_minimum":"Un homme parfait, Adam, a tout perdu ; un homme parfait, Jésus, a payé le prix équivalent."},{"id":"g36","niveau":"grands","type":"qcm","question":"D'après la Bible, dans quel état sont les morts ?","choix":["Ils veillent sur leur famille","Ils ne savent rien","Ils souffrent pour leurs fautes","Ils attendent au ciel"],"bonne":1,"explication":"Ils ne savent rien. Jésus a comparé la mort à un profond sommeil. Les morts ne souffrent pas, et ils ne peuvent pas nous faire de mal. Ecclésiaste chapitre 9, verset 5.","reference":"Ecclésiaste 9:5","source":"https://wol.jw.org/fr/wol/d/r30/lp-f/1102021229","origine":"instructeur"},{"id":"g37","niveau":"grands","type":"qcm","question":"D'après la Bible, qui sera ressuscité ?","choix":["Seulement les serviteurs de Jéhovah","Les justes et les injustes","Seulement ceux qui sont morts jeunes","Seulement ceux qui vont au ciel"],"bonne":1,"explication":"Les justes et les injustes. Jésus a dit que tous ceux qui sont dans les tombes, dans la mémoire de Dieu, entendront sa voix. Actes chapitre 24, verset 15, et Jean chapitre 5, versets 28 et 29.","reference":"Actes 24:15 ; Jean 5:28, 29","source":"https://wol.jw.org/fr/wol/d/r30/lp-f/1102021230","origine":"instructeur"},{"id":"g38","niveau":"grands","type":"qcm","question":"D'après Daniel chapitre 2, verset 44, qu'est-ce qui distingue le royaume de Dieu des gouvernements humains ?","choix":["Il sera élu par tous les peuples","Il ne sera jamais détruit","Il gouvernera depuis Jérusalem","Il ne durera que sept ans"],"bonne":1,"explication":"Il ne sera jamais détruit. Son roi, Jésus, ne sera jamais remplacé, et il gouvernera toute la terre avec amour et justice. Daniel chapitre 2, verset 44.","reference":"Daniel 2:44","source":"https://wol.jw.org/fr/wol/d/r30/lp-f/1102021231","origine":"instructeur"},{"id":"g39","niveau":"grands","type":"qcm","question":"En Actes chapitre 15, qui a demandé aux chrétiens de s'abstenir du sang ?","choix":["Le collège central de Jérusalem","L'apôtre Paul, tout seul","Les prêtres du Temple","Les anciens d'Antioche"],"bonne":0,"explication":"Le collège central, c'est-à-dire les apôtres et les anciens de Jérusalem. Jéhovah l'avait déjà demandé à Noé après le Déluge, parce que pour lui le sang représente la vie. Actes chapitre 15, versets 28 et 29, et Genèse chapitre 9, verset 4.","reference":"Actes 15:28, 29 ; Genèse 9:4","source":"https://wol.jw.org/fr/wol/d/r30/lp-f/1102021239","origine":"instructeur","exclut":["g42"]},{"id":"g40","niveau":"grands","type":"qcm","question":"Après un miracle, des gens ont voulu faire de Jésus leur roi. Qu'a-t-il fait ?","choix":["Il a accepté pour un temps","Il s'est retiré seul dans la montagne","Il a demandé l'avis de ses apôtres","Il leur a dit d'attendre la Pâque"],"bonne":1,"explication":"Il s'est retiré dans la montagne. Il ne se mêlait pas de politique, car son royaume ne fait pas partie de ce monde. Les vrais chrétiens restent neutres eux aussi. Jean chapitre 6, verset 15, et chapitre 18, verset 36.","reference":"Jean 6:15 ; 18:36","source":"https://wol.jw.org/fr/wol/d/r30/lp-f/1102021245","origine":"instructeur"},{"id":"g41","niveau":"grands","type":"ouverte","question":"Quelle est la différence entre se vouer à Jéhovah et se faire baptiser ?","choix":[],"bonne":null,"explication":"L'un est une promesse faite à Jéhovah dans la prière. L'autre la rend visible à tous. Et c'est l'amour qui pousse à faire ces deux pas. Psaume 40, verset 8, et Première lettre de Pierre, chapitre 3, verset 21.","reference":"Psaume 40:8 ; 1 Pierre 3:21","source":"https://wol.jw.org/fr/wol/d/r30/lp-f/1102021246","origine":"instructeur","reponse_attendue":"Se vouer à Jéhovah, c'est lui promettre dans une prière personnelle qu'on n'adorera que lui et qu'on fera passer sa volonté en premier. Le baptême vient ensuite : il montre publiquement qu'on s'est voué à Dieu. C'est l'amour pour Jéhovah qui pousse à faire ces deux pas.","juge_minimum":"L'offrande de soi est une promesse faite à Jéhovah dans la prière ; le baptême la rend publique."},{"id":"g42","niveau":"grands","type":"qcm","question":"Qui est aujourd'hui l'esclave fidèle et avisé dont parle Jésus en Matthieu chapitre 24, verset 45 ?","choix":["Tous les chrétiens baptisés","Un petit groupe d'anciens oints","Les anciens de chaque assemblée","Les pionniers et les missionnaires"],"bonne":1,"explication":"Un petit groupe d'anciens oints de l'esprit : le Collège central. Il fournit la nourriture spirituelle au bon moment et dirige l'œuvre de prédication. Matthieu chapitre 24, verset 45.","reference":"Matthieu 24:45","source":"https://wol.jw.org/fr/wol/d/r30/lp-f/1102021254","origine":"instructeur","exclut":["g39"]}],"illustrations":{"p01-0":"\u003csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'>\u003cg stroke='#241C30' stroke-width='3' stroke-linejoin='round' stroke-linecap='round'>\u003cpath d='M22 90 Q22 71 50 69 Q78 71 78 90 Z' fill='#3B7DD8'/>\u003cpath d='M44 57 V70 H56 V57' fill='#D9A273'/>\u003cellipse cx='50' cy='44' rx='15' ry='17' fill='#D9A273'/>\u003cg fill='#8A3F1F'>\u003ccircle cx='38' cy='33' r='6.5'/>\u003ccircle cx='46' cy='27.5' r='7'/>\u003ccircle cx='55' cy='27.5' r='7'/>\u003ccircle cx='62.5' cy='33' r='6.5'/>\u003ccircle cx='35.5' cy='40.5' r='5'/>\u003ccirc
