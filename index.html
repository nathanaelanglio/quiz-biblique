oke-linecap='round'>\u003cpath d='M30 30 L62 30 L58 86 L34 86 Z' fill='#E6F2F8'/>\u003cpath d='M30.9 42 L61.1 42 L58 86 L34 86 Z' fill='#8E1F3F' stroke='none'/>\u003cpath d='M30 30 L62 30 L58 86 L34 86 Z' fill='none'/>\u003cpath d='M76 48 Q78 42 84 42' fill='none' stroke='#4F9D58' stroke-width='3'/>\u003cg fill='#6D3B7A' stroke-width='2.2'>\u003ccircle cx='70' cy='56' r='5'/>\u003ccircle cx='80' cy='56' r='5'/>\u003ccircle cx='75' cy='64' r='5'/>\u003ccircle cx='65' cy='64' r='5'/>\u003ccircle cx='85' cy='64' r='5'/>\u003ccircle cx='70' cy='72' r='5'/>\u003ccircle cx='80' cy='72' r='5'/>\u003ccircle cx='75' cy='80' r='5'/>\u003c/g>\u003c/g>\u003c/svg>","p22-0":"\u003csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'>\u003cg stroke='#241C30' stroke-width='3' stroke-linejoin='round' stroke-linecap='round'>\u003cpath d='M22 90 Q22 71 50 69 Q78 71 78 90 Z' fill='#8D6E4A'/>\u003cpath d='M44 57 V70 H56 V57' fill='#C68A5B'/>\u003cellipse cx='50' cy='44' rx='15' ry='17' fill='#C68A5B'/>\u003cpath d='M45 33 Q50 31 55 33' fill='none' stroke-width='1.5'/>\u003cg fill='#F1F1F1'>\u003cpath d='M35.5 50 Q32 36 39 30 Q38 41 39.5 50 Z'/>\u003cpath d='M64.5 50 Q68 36 61 30 Q62 41 60.5 50 Z'/>\u003c/g>\u003cpath d='M35.5 46 Q35 68 50 78 Q65 68 64.5 46 Q61 57 50 58 Q39 57 35.5 46 Z' fill='#F1F1F1'/>\u003cg fill='#241C30' stroke='none'>\u003ccircle cx='44.5' cy='44' r='2.1'/>\u003ccircle cx='55.5' cy='44' r='2.1'/>\u003c/g>\u003cpath d='M41 39 L47 38 M53 38 L59 39' stroke='#9A9A9A' stroke-width='2.5'/>\u003cpath d='M45 52 Q50 57 55 52 Q50 54 45 52 Z' fill='#7A2E3A'/>\u003c/g>\u003c/svg>","p22-1":"\u003csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'>\u003cg stroke='#241C30' stroke-width='3' stroke-linejoin='round' stroke-linecap='round'>\u003cpath d='M22 90 Q22 71 50 69 Q78 71 78 90 Z' fill='#7D9A4A'/>\u003cpath d='M44 57 V70 H56 V57' fill='#B07444'/>\u003cellipse cx='50' cy='44' rx='15' ry='17' fill='#B07444'/>\u003cpath d='M35 42 Q33 25 50 25 Q67 25 65 42 Q61 32 50 32 Q39 32 35 42 Z' fill='#2A1D16'/>\u003cg fill='#241C30' stroke='none'>\u003ccircle cx='44.5' cy='44' r='2.1'/>\u003ccircle cx='55.5' cy='44' r='2.1'/>\u003c/g>\u003cpath d='M45.5 52.5 Q50 56 54.5 52.5' fill='none'/>\u003c/g>\u003c/svg>","p22-2":"\u003csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'>\u003cg stroke='#241C30' stroke-width='3' stroke-linejoin='round' stroke-linecap='round'>\u003cpath d='M22 90 Q22 71 50 69 Q78 71 78 90 Z' fill='#6D4C9F'/>\u003cpath d='M44 57 V70 H56 V57' fill='#B07444'/>\u003cellipse cx='50' cy='44' rx='15' ry='17' fill='#B07444'/>\u003cpath d='M33 48 Q31 23 50 22 Q69 23 67 48 L73 70 Q66 64 64.5 48 Q63 32 50 32 Q37 32 35.5 48 Q34 64 27 70 Z' fill='#EDE3CF'/>\u003cpath d='M35 32 Q50 25 65 32' fill='none' stroke='#8A5A2B' stroke-width='4'/>\u003cpath d='M35.5 46 Q35 68 50 78 Q65 68 64.5 46 Q61 57 50 58 Q39 57 35.5 46 Z' fill='#A6A6A6'/>\u003cg fill='#241C30' stroke='none'>\u003ccircle cx='44.5' cy='44' r='2.1'/>\u003ccircle cx='55.5' cy='44' r='2.1'/>\u003c/g>\u003cpath d='M45 52 Q50 57 55 52 Q50 54 45 52 Z' fill='#7A2E3A'/>\u003c/g>\u003c/svg>"},"textes":{"accueil":"Bonjour à tous ! Je m'appelle Joël, et c'est moi qui anime le quiz biblique. Choisissez votre niveau, formez vos équipes, et c'est parti !","debut":"C'est parti ! Écoutez bien chaque question, et prenez le temps de réfléchir ensemble.","debut-tous":"C'est parti ! Aujourd'hui, nous jouons tous ensemble, dans la même équipe. Écoutez bien, et aidez-vous les uns les autres.","derniere":"Attention, voici la dernière question !","bravo-1":"Bravo ! C'est la bonne réponse !","bravo-2":"Excellent ! Vous avez trouvé !","bravo-3":"Super, bien joué ! C'est exactement ça !","encourage-1":"Ce n'est pas grave ! Regardons ensemble la bonne réponse.","encourage-2":"Presque ! Voici la bonne réponse.","encourage-3":"Pas cette fois, mais vous allez apprendre quelque chose de beau !","temps":"Le temps est écoulé ! Voyons ensemble la réponse.","joker-5050":"Je retire des mauvaises réponses. Réfléchissez bien !","joker-adulte":"Vous pouvez demander de l'aide à un adulte !","ouverte":"Répondez à voix haute ! Ensuite, l'adulte révèle la réponse.","revele":"Voici la réponse attendue.","podium":"Quelle belle partie ! Bravo à toutes les équipes, vous avez tous bien joué. Merci d'avoir participé, et à bientôt pour un nouveau quiz !","tour-lionceaux":"Au tour des Lionceaux ! Vous êtes prêts ? Écoutez bien la question.","tour-colombes":"Au tour des Colombes ! Vous êtes prêts ? Écoutez bien la question.","tour-oliviers":"Au tour des Oliviers ! Vous êtes prêts ? Écoutez bien la question.","tour-etoiles":"Au tour des Étoiles ! Vous êtes prêts ? Écoutez bien la question.","tour-cedres":"Au tour des Cèdres ! Vous êtes prêts ? Écoutez bien la question.","tour-perles":"Au tour des Perles ! Vous êtes prêts ? Écoutez bien la question.","tour-tous":"À vous tous ! Vous êtes prêts ? Écoutez bien la question.","q-p01":"Qui a construit une grande arche pour sauver sa famille et les animaux ? David ? Noé ? Ou Pierre ?","e-p01":"C'est Noé ! Jéhovah lui a dit : Fais-toi une arche en bois. Noé a obéi, et sa famille a été sauvée. Genèse chapitre 6, verset 14.","q-p02":"Combien de personnes sont entrées dans l'arche ? Huit ? Deux ? Ou Vingt ?","e-p02":"Huit personnes : Noé, sa femme, leurs trois fils et les trois femmes de leurs fils. Genèse chapitre 7, verset 13.","q-p03":"Après le déluge, quel beau signe Jéhovah a-t-il mis dans le nuage ? Une étoile ? La lune ? Ou Un arc-en-ciel ?","e-p03":"Un arc-en-ciel ! C'est le signe de la promesse que Jéhovah a faite à la terre. Genèse chapitre 9, verset 13.","q-p04":"Dans la Bible, qui était le grand frère jaloux d'Abel ? Caïn ? Ou Moïse ?","e-p04":"Caïn. Il a laissé la jalousie grandir dans son cœur. La Bible nous demande de ne pas être comme Caïn, mais de nous aimer les uns les autres. Première lettre de Jean, chapitre 3, versets 11 et 12.","q-p05":"Dans la ville de Jéricho, une femme a caché deux espions envoyés par Josué. Comment s'appelait-elle ? Ruth ? Rahab ? Ou Marie ?","e-p05":"C'est Rahab. Elle avait confiance en Jéhovah, et elle a été sauvée avec toute sa famille. Josué chapitre 6, verset 25.","q-p06":"Qu'est-ce que Rahab a attaché à sa fenêtre pour que sa famille soit protégée ? Un drapeau blanc ? Une lampe ? Ou Un cordon rouge ?","e-p06":"Un cordon de fil écarlate, c'est-à-dire rouge vif. C'était le signe convenu avec les espions. Josué chapitre 2, verset 18.","q-p07":"Selon la Bible, quel homme a reçu de Jéhovah une force extraordinaire ? Samson ? Jonas ? Ou Zachée ?","e-p07":"C'est Samson ! Une nuit, il a arraché les grandes portes d'une ville et il les a portées sur ses épaules jusqu'en haut d'une montagne. Juges chapitre 16, verset 3.","q-p08":"Samson avait fait une promesse à Jéhovah. Qu'est-ce qu'il ne devait jamais couper ? Ses sourcils ? Ou Ses cheveux ?","e-p08":"Ses cheveux. Samson a dit : Le rasoir n'est jamais passé sur ma tête. C'était sa promesse à Jéhovah. Juges chapitre 16, verset 17.","q-p09":"Qu'est-ce que Jacob a fait faire pour son fils Joseph ? Une petite maison ? Un beau et long vêtement ? Ou Un bateau ?","e-p09":"Un beau et long vêtement. Jacob aimait beaucoup Joseph. Genèse chapitre 37, verset 3.","q-p10":"Zacharie et Élisabeth étaient très vieux, et Jéhovah leur a donné un bébé. Comment s'appelait-il ? Samuel ? Jonas ? Ou Jean ?","e-p10":"Jean ! L'ange a dit à Zacharie : Ta femme, Élisabeth, te donnera un fils, et tu devras l'appeler Jean. Plus tard, il a préparé le chemin de Jésus. Luc chapitre 1, verset 13.","q-p11":"Que mangeait Jean le Baptiseur dans le désert ? Des gâteaux et du lait ? Des criquets et du miel sauvage ? Ou Du riz et du poisson ?","e-p11":"Des criquets et du miel sauvage ! Il portait aussi un vêtement en poil de chameau. Matthieu chapitre 3, verset 4.","q-p12":"Où Marie a-t-elle couché le bébé Jésus ? Dans une mangeoire ? Dans un berceau en or ? Ou Dans une barque ?","e-p12":"Dans une mangeoire, l'endroit où mangent les animaux, parce qu'il n'y avait pas de place pour eux dans la salle prévue pour les voyageurs. Luc chapitre 2, verset 7.","q-p13":"Qui a élevé Jésus avec Marie, comme un papa ? Abraham ? Joseph ? Ou Pierre ?","e-p13":"C'est Joseph, le charpentier. Jésus est le Fils de Dieu, et Joseph a été son père adoptif : il l'a élevé avec amour. Luc chapitre 3, verset 23.","q-p14":"Combien d'apôtres Jésus a-t-il choisis ? Trois ? Cent ? Ou Douze ?","e-p14":"Douze apôtres. Matthieu chapitre 10, versets 2 à 4.","q-p15":"Jésus a dit à Pierre : Nourris mes petites brebis. De qui parlait-il ? De vrais moutons ? Ou De ceux qui le suivaient ?","e-p15":"De ses disciples, ceux qui suivaient Jésus ! Il demandait à Pierre de prendre soin d'eux et de les nourrir de la Parole de Dieu. Jean chapitre 21, verset 17.","q-p16":"Qu'est-ce qui a avalé Jonas ? Un énorme poisson ? Un lion ? Ou Un aigle ?","e-p16":"Un énorme poisson envoyé par Jéhovah. Jonas est resté trois jours et trois nuits dans son ventre, puis il s'est retrouvé sain et sauf sur la terre ferme. Jonas chapitre 1, verset 17.","q-p17":"Qui a fermé la gueule des lions pour protéger Daniel ? Le roi ? Un ange de Jéhovah ? Ou Un soldat ?","e-p17":"Un ange de Jéhovah ! Daniel a dit au roi : Mon Dieu a envoyé son ange et a fermé la gueule des lions. Daniel chapitre 6, verset 22.","q-p18":"Où la maman de Moïse a-t-elle déposé son bébé pour le protéger ? Dans une grotte ? Sur un chameau ? Ou Dans une corbeille au bord du Nil ?","e-p18":"Dans une corbeille en papyrus, au milieu des roseaux, au bord du Nil. Et sa grande sœur surveillait de loin. Exode chapitre 2, versets 3 et 4.","q-p19":"Ruth a dit à Noémi : Ton Dieu sera mon Dieu. Qu'a fait Ruth ? Elle est restée avec Noémi ? Ou Elle est partie loin d'elle ?","e-p19":"Ruth est restée avec Noémi, sa belle-mère, pour l'aider et pour servir Jéhovah avec elle. Ruth chapitre 1, verset 16.","q-p20":"Zachée était petit. Où est-il monté pour voir Jésus ? Sur un chameau ? Dans un arbre ? Ou Sur un toit ?","e-p20":"Dans un arbre, un sycomore. Et Jésus l'a appelé par son nom ! Luc chapitre 19, versets 4 et 5.","q-p21":"Pendant un mariage, en quoi Jésus a-t-il changé de l'eau ? En lait ? En jus de fruit ? Ou En vin ?","e-p21":"En vin ! C'était son premier miracle, à Cana. Jean chapitre 2, verset 9.","q-p22":"Qui a donné un nom à tous les animaux ? Noé ? Adam ? Ou Moïse ?","e-p22":"C'est Adam, le premier homme. Jéhovah lui amenait les animaux, et chaque animal recevait le nom qu'Adam lui donnait. Genèse chapitre 2, verset 19.","q-m01":"Qui a été le premier meurtrier de l'histoire humaine ? A : Abel. B : Lamek. C : Caïn. D : Noé.","e-m01":"C'est Caïn. Il a laissé la jalousie le dominer et il a tué son frère Abel. La Bible le donne en exemple à ne pas suivre. Genèse chapitre 4, verset 8, et Première lettre de Jean, chapitre 3, verset 12.","q-m02":"Comment s'appelait la femme cananéenne de Jéricho qui a été épargnée avec sa famille ? A : Dalila. B : Rahab. C : Ruth. D : Noémi.","e-m02":"Rahab. Elle avait caché les espions de Josué, et Jéhovah l'a protégée. Elle est même devenue une ancêtre de Jésus. Josué chapitre 6, verset 25, et Matthieu chapitre 1, verset 5.","q-m03":"Qui était Ruth pour Noémi ? A : Sa sœur. B : Sa voisine. C : Sa belle-fille. D : Sa cousine.","e-m03":"Sa belle-fille. Ruth, qui venait du pays de Moab, avait épousé un fils de Noémi. Devenue veuve, elle est restée fidèle à Noémi et à Jéhovah. Ruth chapitre 1, versets 4 et 16.","q-m04":"Ruth s'est mariée avec Boaz. Quel roi célèbre est leur arrière-petit-fils ? A : David. B : Saül. C : Salomon. D : Sédécias.","e-m04":"Le roi David. Ruth et Boaz ont eu un fils, Obed. Obed est le père de Jessé, et Jessé est le père de David. Ruth chapitre 4, versets 13 et 17.","q-m05":"On dit souvent de lui qu'il est l'homme le plus fort qui ait jamais vécu. Qui est-ce ? A : Goliath. B : David. C : Saül. D : Samson.","e-m05":"Samson. Sa force ne venait pas de ses muscles, mais de Jéhovah : à la fin de sa vie, il a encore supplié Jéhovah de le fortifier. Juges chapitre 16, verset 28.","q-m06":"Quand on parle des ancêtres du peuple d'Israël, quels trois noms dit-on toujours ensemble ? A : Adam, Noé et Moïse. B : Moïse, Aaron et Josué. C : David, Salomon et Sédécias. D : Abraham, Isaac et Jacob.","e-m06":"Abraham, Isaac et Jacob. Jéhovah s'est présenté à Moïse ainsi : Je suis le Dieu d'Abraham, le Dieu d'Isaac et le Dieu de Jacob. Exode chapitre 3, verset 6.","q-m07":"Pourquoi les noms des douze fils de Jacob sont-ils restés dans l'histoire du peuple ? A : Parce qu'ils étaient tous prophètes. B : Parce que leurs familles sont devenues les douze tribus d'Israël. C : Parce qu'ils ont construit le temple. D : Parce qu'ils ont tous été rois.","e-m07":"Leurs descendants sont devenus les douze tribus d'Israël. Genèse chapitre 49, verset 28. Et dans la Révélation, les noms des douze tribus sont inscrits sur les portes de la ville sainte. Révélation chapitre 21, verset 12.","q-m08":"Comment s'appelait le père adoptif de Jésus ? A : Zacharie. B : Lazare. C : Jacques. D : Joseph.","e-m08":"Joseph. Jésus a été conçu par l'esprit saint, mais Joseph l'a élevé avec Marie. C'est pourquoi les gens disaient que Jésus était fils de Joseph. Luc chapitre 3, verset 23.","q-m09":"Sa mère était trop âgée pour avoir des enfants, et il est venu au monde pour préparer la venue du Messie. Qui est-ce ? A : Isaac. B : Jean le Baptiseur. C : Samuel. D : L'apôtre Jean.","e-m09":"Jean le Baptiseur. Ses parents, Zacharie et Élisabeth, étaient très âgés. Isaac aussi est né d'une mère âgée, Sara, mais c'est Jean qui a préparé la venue du Messie. Luc chapitre 1, versets 7 et 17.","q-m10":"Après la trahison de Judas, il restait onze apôtres. Qui a été choisi pour devenir le douzième ? A : Paul. B : Barnabé. C : Matthias. D : Étienne.","e-m10":"Matthias. Les disciples ont tiré au sort, et Matthias a été ajouté aux onze apôtres. Actes chapitre 1, verset 26.","q-m11":"Après sa résurrection, pendant combien de jours Jésus s'est-il montré à ses disciples ? A : Quarante jours. B : Trois jours. C : Sept jours. D : Cinquante jours.","e-m11":"Pendant quarante jours. Il leur a donné des preuves convaincantes qu'il était vivant, et il leur parlait du royaume de Dieu. Actes chapitre 1, verset 3.","q-m12":"À quel apôtre Jésus ressuscité a-t-il dit : Nourris mes petites brebis? A : Jean. B : Thomas. C : André. D : Pierre.","e-m12":"À Pierre. Avec d'autres frères dignes de confiance, Pierre allait nourrir, fortifier et conduire les disciples de Jésus. Jean chapitre 21, versets 15 à 17.","q-m13":"Quel apôtre a vécu très vieux et a probablement été le dernier apôtre à mourir ? A : Pierre. B : Jean. C : Jacques. D : Matthieu.","e-m13":"Jean. Après la résurrection de Jésus, il a encore servi Dieu fidèlement pendant près de soixante-dix ans, et c'est sur l'île de Patmos qu'il a reçu la Révélation.","q-m14":"Comment Jéhovah a-t-il ouvert un chemin dans la mer pour les Israélites ? A : Avec un grand pont. B : Avec des bateaux. C : Par un fort vent d'est qui a fait reculer la mer. D : En gelant l'eau.","e-m14":"Jéhovah a fait reculer la mer par un fort vent d'est toute la nuit, et les Israélites ont traversé sur un sol ferme. Exode chapitre 14, versets 21 et 22.","q-m15":"D'après les âges donnés dans la Bible, qui a vécu le plus longtemps ? A : Mathusalem. B : Adam. C : Noé. D : Abraham.","e-m15":"Mathusalem, qui a vécu neuf cent soixante-neuf ans ! Genèse chapitre 5, verset 27.","q-m16":"Près de la rivière, qui apportait à manger au prophète Élie ? A : Des colombes. B : Des corbeaux. C : Des soldats. D : Des bergers.","e-m16":"Des corbeaux ! Tous les matins et tous les soirs, ils lui apportaient du pain et de la viande. Premier livre des Rois, chapitre 17, verset 6.","q-m17":"Jésus avait douze ans. Où ses parents l'ont-ils retrouvé au bout de trois jours ? A : Au marché. B : Chez des amis. C : Au bord du lac. D : Dans le Temple, au milieu des enseignants.","e-m17":"Dans le Temple, assis au milieu des enseignants : il les écoutait et leur posait des questions. Luc chapitre 2, verset 46.","q-m18":"Avec combien de pains et de poissons Jésus a-t-il nourri une immense foule ? A : Trois pains et un poisson. B : Douze pains et douze poissons. C : Cinq pains et deux poissons. D : Sept pains et trois poissons.","e-m18":"Cinq pains et deux poissons. Environ cinq mille hommes ont mangé, sans compter les femmes et les enfants, et il est resté douze paniers ! Matthieu chapitre 14, versets 17 à 21.","q-m19":"Depuis combien de jours Lazare était-il dans la tombe quand Jésus l'a ressuscité ? A : Un jour. B : Deux jours. C : Quatre jours. D : Dix jours.","e-m19":"Quatre jours. Jésus a crié d'une voix forte : Lazare, viens dehors ! Et Lazare est sorti vivant. Jean chapitre 11, versets 17, 43 et 44.","q-m20":"Dans quel livre de la Bible Jéhovah dit-il : Vous êtes mes témoins? A : Isaïe. B : Genèse. C : Psaumes. D : Jonas.","e-m20":"Dans Isaïe, chapitre 43, verset 10. C'est sur ce verset qu'est basé notre nom : Témoins de Jéhovah.","q-m21":"Combien d'hommes le roi Nabuchodonosor a-t-il vus marcher dans le four de feu ? A : Un. B : Trois. C : Quatre. D : Sept.","e-m21":"Quatre ! On y avait jeté Shadrak, Méshak et Abed-Négo, mais le roi a vu un quatrième homme avec eux, et le feu ne leur avait fait aucun mal. Daniel chapitre 3, verset 25.","q-m22":"Où sont passées les eaux du déluge ? A : Elles se sont envolées dans l'espace. B : Elles sont toujours sur la terre, surtout dans les océans. C : Elles sont descendues au centre de la terre. D : Personne ne peut le savoir.","e-m22":"Elles sont toujours sur la terre, surtout dans les océans. Après le déluge, de nouvelles montagnes se sont sans doute élevées et le fond des mers s'est creusé, et l'eau s'y est rassemblée. Genèse chapitre 8, verset 3.","q-g01":"En quelle année Jésus est-il né ? A : En l'an 1 de notre ère. B : En l'an 4 avant notre ère. C : En l'an 2 avant notre ère. D : En l'an 29 de notre ère.","e-g01":"En l'an 2 avant notre ère, vraisemblablement au mois d'Éthanim, c'est-à-dire en septembre ou en octobre. Il est né environ six mois après Jean le Baptiseur. Luc chapitre 3, versets 1 et 23.","q-g02":"En quelle année Jésus a-t-il été baptisé ? A : En l'an 29 de notre ère. B : En l'an 27 de notre ère. C : En l'an 30 de notre ère. D : En l'an 33 de notre ère.","e-g02":"En l'an 29 de notre ère, à l'automne. Jean le Baptiseur avait commencé à prêcher la quinzième année du règne de Tibère César. Luc chapitre 3, versets 1 à 3.","q-g03":"Quel âge avait Jésus quand il a commencé son ministère ? A : Environ trente ans. B : Environ vingt ans. C : Environ trente-trois ans. D : Environ quarante ans.","e-g03":"Environ trente ans. Luc chapitre 3, verset 23 : Quand Jésus commença son ministère, il avait environ 30 ans.","q-g04":"Quel jour Jésus est-il mort ? A : Le 14 nisan de l'an 30. B : Le 10 nisan de l'an 33. C : Le 15 nisan de l'an 36. D : Le 14 nisan de l'an 33.","e-g04":"Le 14 nisan de l'an 33 de notre ère, un vendredi de printemps, vers trois heures de l'après-midi. Luc chapitre 23, versets 44 à 46.","q-g05":"Quel âge avait Jésus à sa mort ? A : Trente ans. B : Environ trente-trois ans et demi. C : Quarante ans. D : Environ trente et un ans.","e-g05":"Environ trente-trois ans et demi : il a commencé son ministère vers trente ans, et ce ministère a duré trois ans et demi. Luc chapitre 3, verset 23.","q-g06":"D'après Révélation chapitre 21, verset 14, quels noms sont inscrits sur les douze pierres de fondation de la muraille de la ville sainte ? A : Les noms des douze tribus d'Israël. B : Les noms des douze anges. C : Les noms des douze prophètes. D : Les noms des douze apôtres de l'Agneau.","e-g06":"Les noms des douze apôtres de l'Agneau. Les noms des douze tribus, eux, sont inscrits sur les portes de la ville, au verset 12.","q-g07":"Comment appelle-t-on, dans la Bible, ceux qui régneront avec Jésus dans le ciel ? A : La grande foule. B : Les autres brebis. C : Les 144 000. D : Les Lévites.","e-g07":"Les 144 000. Jean les a vus avec l'Agneau sur le mont Sion, et Jésus les appelle aussi son petit troupeau. Révélation chapitre 14, verset 1, et Luc chapitre 12, verset 32.","q-g08":"Combien de temps durera le règne de Jésus avant qu'il remette le Royaume à son Père ? A : Mille ans. B : Cent ans. C : Sept ans. D : Il ne le remettra jamais.","e-g08":"Mille ans. Ceux qui ont part à la première résurrection régneront avec lui pendant les mille ans. Ensuite, il remettra le Royaume à son Dieu et Père. Révélation chapitre 20, verset 6, et Première lettre aux Corinthiens, chapitre 15, verset 24.","q-g09":"En quelle année Jésus a-t-il été intronisé comme Roi dans le ciel ? A : 1919. B : 1931. C : 1914. D : 1975.","e-g09":"En octobre 1914. C'est la fin des sept temps annoncés dans le rêve de l'arbre, en Daniel chapitre 4, versets 16 et 17.","q-g10":"Quelle prophétie de Daniel donne l'année exacte de l'intronisation du Christ dans le ciel ? Explique le calcul.","e-g10":"Le rêve du grand arbre abattu, en Daniel chapitre 4. Les sept temps durent deux mille cinq cent vingt ans : ils commencent en octobre 607 avant notre ère, quand Jérusalem est détruite, et se terminent en octobre 1914, quand Jésus commence à régner. Les sept temps, c'est le temps accordé aux nations dont parle Jésus en Luc chapitre 21, verset 24. Ils vont d'octobre 607 avant notre ère à octobre 1914 de notre ère. Daniel chapitre 4, versets 16 et 17.","q-g11":"Quelle prophétie de Daniel donne l'année exacte de l'arrivée du Messie ? Quelle est cette année ?","e-g11":"La prophétie des soixante-dix semaines, en Daniel chapitre 9. Elle part de 455 avant notre ère, quand est donné l'ordre de rebâtir Jérusalem. Soixante-neuf semaines d'années, soit quatre cent quatre-vingt-trois ans, mènent à l'an 29 de notre ère : Jésus est baptisé et devient le Messie. Le Messie, le Guide, arrive en l'an 29. Au milieu de la dernière semaine, en l'an 33, il est mis à mort. Daniel chapitre 9, versets 24 à 27.","q-g12":"Quand s'est accomplie la prophétie de Malachie chapitre 3, versets 1 à 3 ?","e-g12":"De 1914 au début de 1919. Jésus, intronisé, est venu avec son Père inspecter le temple spirituel. Les chrétiens oints, les fils de Lévi, ont traversé une période d'épreuves et en sont sortis affinés et purifiés. Jéhovah, le Grand Affineur, a purifié ses serviteurs comme on affine l'or et l'argent. Et cet affinage continue tout au long des derniers jours. Malachie chapitre 3, versets 1 à 3.","q-g13":"Quel événement annoncé en Première lettre aux Thessaloniciens, chapitre 5, verset 3, attendons-nous encore ? Et sait-on exactement quand il viendra ?","e-g13":"La proclamation Paix et sécurité ! par les nations, suivie d'une destruction subite. On ne sait pas exactement quand elle sera faite : elle pourrait venir avant ou après la destruction des fausses religions, qui marque le début de la grande tribulation. L'important est de rester éveillés. La Tour de Garde de février 2026 explique que les deux possibilités restent ouvertes. Ce qui compte le plus, ce n'est pas le moment exact, mais notre fidélité à Dieu. Première lettre aux Thessaloniciens, chapitre 5, versets 3 à 6.","q-g14":"Genèse chapitre 2 dit que Dieu se reposa le septième jour, mais Jésus dit en Jean chapitre 5, verset 17 : Mon Père a continué de travailler jusqu'à maintenant. Comment concilier ces deux versets ?","e-g14":"Le contexte de la Genèse montre que Dieu s'est reposé de son œuvre de création matérielle concernant la terre. Jésus, lui, parle des autres œuvres de Dieu : il a inspiré la Bible, il guide et soutient les humains. Dieu a cessé de créer sur la terre, mais il n'a jamais cessé de travailler. Il n'y a pas de contradiction : les deux versets ne parlent pas du même travail. Genèse chapitre 2, versets 2 et 3, et Jean chapitre 5, verset 17.","q-g15":"D'après Matthieu chapitre 10, verset 23, réussirons-nous à faire connaître la bonne nouvelle du Royaume à chaque personne sur terre avant que vienne la fin ?","e-g15":"Non. Jésus a dit à ses disciples qu'ils n'auraient pas terminé le tour des villes avant qu'il arrive. Nous prêchons dans le monde entier, mais des millions de personnes vivent là où notre activité est sévèrement limitée, et des centaines de bébés naissent chaque minute. La bonne nouvelle est prêchée sur toute la terre, en témoignage pour toutes les nations, et le site jw.org la rend accessible à la majorité des humains. Mais nous n'aurons pas prêché à chaque personne avant que Jésus vienne juger. Matthieu chapitre 10, verset 23, et chapitre 24, verset 14.","q-g16":"Selon la chronologie biblique, il y a combien d'années environ qu'Adam a été créé ? A : Environ quatre mille ans. B : Un peu plus de six mille ans. C : Environ dix mille ans. D : Des millions d'années.","e-g16":"Un peu plus de six mille ans. Adam a été créé en 4026 avant notre ère, soit il y a environ six mille cinquante ans. Les âges donnés en Genèse chapitre 5 permettent ce calcul.","q-g17":"Depuis quelle année le peuple de Dieu s'appelle-t-il Témoins de Jéhovah ? A : 1914. B : 1919. C : 1942. D : 1931.","e-g17":"Depuis 1931. Le 26 juillet, lors d'une assemblée aux États-Unis, les Étudiants de la Bible ont adopté avec joie ce nom, basé sur Isaïe chapitre 43, verset 10.","q-g18":"Qui fut le dernier roi de la lignée de David à régner à Jérusalem ? A : Joachim. B : Salomon. C : Sédécias. D : Saül.","e-g18":"Sédécias. Après lui, Jéhovah a annoncé que la couronne n'appartiendrait à personne jusqu'à ce que vienne celui qui a le droit légal. Ce roi, c'est Jésus. Ézéchiel chapitre 21, verset 27.","q-g19":"Le roi David a commis un péché très grave, et selon la Loi de Moïse il aurait mérité la mort. Ce péché concernait la femme d'un de ses soldats. Comment s'appelait-elle ? A : Dalila. B : Bethsabée. C : Esther. D : Noémi.","e-g19":"Bethsabée, la femme d'Urie. David s'est sincèrement repenti, et Jéhovah lui a pardonné : il n'a pas été mis à mort, même s'il a subi les conséquences de son péché. Deuxième livre de Samuel, chapitre 12, verset 13.","q-g20":"Comment Samson est-il mort ? A : De vieillesse, dans sa maison. B : Dans un combat contre un lion. C : Noyé dans la mer. D : En faisant tomber le temple de Dagon.","e-g20":"En faisant tomber le temple de Dagon. Prisonnier des Philistins, il a supplié Jéhovah de lui rendre sa force une dernière fois. Il a poussé les deux colonnes, le temple s'est écroulé, et Samson est mort avec les ennemis du peuple de Dieu. Juges chapitre 16, versets 28 à 30.","q-g21":"Combien de temps Noé et sa famille sont-ils restés dans l'arche ? A : Quarante jours. B : Cent cinquante jours. C : Un peu plus d'un an. D : Sept ans.","e-g21":"Un peu plus d'un an : trois cent soixante-dix jours. La pluie est tombée quarante jours, mais il a fallu bien plus longtemps pour que les eaux baissent et que la terre sèche. Genèse chapitre 7, verset 11, et chapitre 8, versets 13 et 14.","q-g22":"Après sa résurrection, Jésus a demandé trois fois à Pierre s'il l'aimait. Qu'a-t-il voulu lui faire comprendre ? A : Qu'il doutait encore de lui et voulait le mettre à l'épreuve. B : Qu'il lui avait pardonné et qu'il devait nourrir ses brebis. C : Qu'il pouvait retourner tranquillement à son ancien métier de pêcheur. D : Qu'il le nommait chef, au-dessus de tous les autres apôtres.","e-g22":"Qu'il lui avait pardonné, et que son amour devait le pousser à prendre soin de ses brebis. La nuit de l'arrestation de Jésus, Pierre l'avait renié trois fois. Après sa résurrection, au bord de la mer de Galilée, Jésus lui a permis trois fois de dire qu'il l'aimait, puis il lui a confié le soin de ses disciples. Jean chapitre 21, versets 15 à 17."},"voixDispo":{"accueil":1,"bravo-1":1,"bravo-2":1,"bravo-3":1,"debut-tous":1,"debut":1,"derniere":1,"e-g01":1,"e-g02":1,"e-g03":1,"e-g04":1,"e-g05":1,"e-g06":1,"e-g07":1,"e-g08":1,"e-g09":1,"e-g10":1,"e-g11":1,"e-g12":1,"e-g13":1,"e-g14":1,"e-g15":1,"e-g16":1,"e-g17":1,"e-g18":1,"e-g19":1,"e-g20":1,"e-g21":1,"e-g22":1,"e-m01":1,"e-m02":1,"e-m03":1,"e-m04":1,"e-m05": function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function forme(eq){var f=FORMES[eq.f];return '<svg class="forme" viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="#fff" stroke-width="5" stroke-linejoin="round">'+f+'</g><g fill="'+eq.c+'" stroke="#241C30" stroke-width="1.8" stroke-linejoin="round">'+f+'</g></svg>'}
function puce(eq,actif){return '<span class="puce'+(actif?' actif':'')+'">'+forme(eq)+'<span class="n">'+esc(eq.n)+'</span><span class="pts">'+eq.s+'</span></span>'}

/* ---------- Son : effets de Milo et voix de Joël ---------- */
var AC=null, analyseur=null, buf=new Uint8Array(256), tictacBuf=null;
function ctx(){
  if(AC)return AC;
  try{AC=new (window.AudioContext||window.webkitAudioContext)();analyseur=AC.createAnalyser();analyseur.fftSize=512;analyseur.connect(AC.destination);buf=new Uint8Array(analyseur.fftSize)}catch(e){AC=null}
  if(AC&&location.protocol!=='file:'){fetch('sons/tictac.ogg').then(function(r){return r.arrayBuffer()}).then(function(a){return AC.decodeAudioData(a)}).then(function(b){tictacBuf=b}).catch(function(){})}
  return AC;
}
var effets={};
function effet(nom){
  if(!son)return;
  if(nom==='tictac'&&AC&&tictacBuf){var s=AC.createBufferSource(),g=AC.createGain();g.gain.value=GAINS.tictac;s.buffer=tictacBuf;s.connect(g);g.connect(AC.destination);s.start();return}
  try{var a=effets[nom]||(effets[nom]=new Audio('sons/'+nom+(nom==='tictac'?'.ogg':'.mp3')));a.volume=GAINS[nom]||.5;a.currentTime=0;a.play().catch(function(){})}catch(e){}
}
// Joue un effet et n'appelle la suite qu'une fois l'effet terminé : la voix de Joël ne passe jamais sous la musique
// (remarque du Président, 15/11/2026). Filet de sécurité si l'événement de fin n'arrive pas.
function effetPuis(nom,suite,maxMs){
  var fait=false;function go(){if(fait)return;fait=true;suite()}
  if(!son){setTimeout(go,300);return}
  effet(nom);var a=effets[nom];
  if(a){a.onended=function(){setTimeout(go,200)}}
  setTimeout(go,maxMs||6000);
}
var lecteur=new Audio(), sourceBranchee=false, file=[], parleEnCours=false, derniereFile=[], jeton=0, simule=false;
lecteur.preload='auto';
function brancher(){
  if(sourceBranchee||!ctx()||location.protocol==='file:')return;
  try{var s=AC.createMediaElementSource(lecteur);s.connect(analyseur);sourceBranchee=true}catch(e){}
}
function etatGuide(add,rem){var g=document.getElementById('g');if(!g)return;(rem||[]).forEach(function(c){g.classList.remove(c)});(add||[]).forEach(function(c){g.classList.add(c)})}
function dire(cles,fin){ // cles : liste de clés de TXT, lues à la suite
  jeton++;var mon=jeton;stopVoix(true);
  file=cles.slice();derniereFile=cles.slice();
  suivant();
  function suivant(){
    if(mon!==jeton)return;
    var k=file.shift();
    if(!k){parleEnCours=false;etatGuide([],['parle']);if(fin)fin();return}
    var txt=TXT[k]||'';
    if(!son){parleEnCours=false;etatGuide([],['parle']);if(fin)fin();return}
    parleEnCours=true;etatGuide(['parle']);
    if(VOIX[k]){
      brancher();simule=!sourceBranchee;
      lecteur.src='voix/'+k+'.mp3';lecteur.volume=1;
      lecteur.onended=function(){setTimeout(suivant,250)};
      lecteur.onerror=function(){synthese(txt,function(){setTimeout(suivant,250)})};
      var p=lecteur.play();if(p&&p.catch)p.catch(function(){synthese(txt,function(){setTimeout(suivant,250)})});
    }else synthese(txt,function(){setTimeout(suivant,250)});
  }
}
function synthese(txt,ok){
  simule=true;
  try{
    var u=new SpeechSynthesisUtterance(txt);u.lang='fr-FR';u.rate=.95;
    var vs=speechSynthesis.getVoices().filter(function(v){return /^fr/i.test(v.lang)});
    var h=vs.filter(function(v){return /Henri|Paul|Thomas|Remy|Rémy|Male|Homme/i.test(v.name)})[0]||vs[0];if(h)u.voice=h;
    u.onend=ok;u.onerror=ok;speechSynthesis.speak(u);
  }catch(e){ok()}
}
function stopVoix(garderFile){
  try{lecteur.onended=null;lecteur.onerror=null;lecteur.pause()}catch(e){}
  try{speechSynthesis.cancel()}catch(e){}
  if(!garderFile){jeton++;file=[]}
  parleEnCours=false;etatGuide([],['parle']);
}
var t0=performance.now();
function bouche(t){
  var g=document.getElementById('g'),v=0;
  if(g&&parleEnCours){
    if(!simule&&analyseur){analyseur.getByteTimeDomainData(buf);var m=0;for(var i=0;i<buf.length;i++){var d=Math.abs(buf[i]-128);if(d>m)m=d}v=Math.min(1,m/38)}
    else{var s=(t-t0)/1000;v=Math.max(0,Math.min(1,(Math.sin(s*9.5)*.5+Math.sin(s*15.7)*.3+.25)*(Math.sin(s*1.3)>-.55?1:0)))}
  }
  if(g)g.style.setProperty('--bouche',v.toFixed(2));
  requestAnimationFrame(bouche);
}
requestAnimationFrame(bouche);

/* ---------- Tirage des questions ---------- */
function melanger(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),x=a[i];a[i]=a[j];a[j]=x}return a}
function tirer(niv,deja){
  var vus=lire('vus',[]);
  var exclus={};deja.forEach(function(q){exclus[q.id]=1;(q.exclut||[]).forEach(function(x){exclus[x]=1})});
  var pool=Q.filter(function(q){return q.niveau===niv&&!exclus[q.id]});
  // Partie très longue : les paires qui se donnent la réponse ne peuvent plus être évitées, puis on accepte de reposer.
  if(!pool.length)pool=Q.filter(function(q){return q.niveau===niv&&!deja.some(function(d){return d.id===q.id})});
  if(!pool.length)pool=Q.filter(function(q){return q.niveau===niv});
  var neufs=pool.filter(function(q){return vus.indexOf(q.id)<0});
  if(!neufs.length){vus=vus.filter(function(id){return !pool.some(function(q){return q.id===id})});ecrire('vus',vus);neufs=pool}
  var q=melanger(neufs)[0];
  if(q){vus.push(q.id);ecrire('vus',vus)}
  return q;
}

/* ---------- Partie ---------- */
function nouvellePartie(){
  var eqs=cfg.jeu==='tous'?[TOUS]:EQUIPES.filter(function(e){return cfg.actives.indexOf(e.k)>=0});
  P={eq:eqs.map(function(e){return {k:e.k,n:e.n,c:e.c,e:e.e,f:e.f,s:0,j5050:false,jadulte:false,niv:cfg.niveau==='melange'?(cfg.nivEq[e.k]||'moyens'):cfg.niveau}}),
     tour:0,n:0,total:cfg.nb,poses:[],q:null,ok:null,retirees:[],reponse:null,tic:null,reste:0,duree:0,juge:null};
}
function eqCourante(){return P.eq[P.tour]}
function dureeQ(niv){return cfg.duree==='sans'?0:(cfg.duree==='auto'?NIV[niv].duree:+cfg.duree)}
function lancerTour(){
  stopMinuteur();
  var eq=eqCourante();
  P.q=tirer(eq.niv,P.poses);P.poses.push(P.q);P.n++;P.ok=null;P.retirees=[];P.reponse=null;P.juge=null;
  if(P.eq.length>1||P.n===1){ecran='tour';rendre();
    var cles=[];if(P.n===1)cles.push(cfg.jeu==='tous'?'debut-tous':'debut');cles.push('tour-'+eq.k);
    effetPuis('tour',function(){if(ecran==='tour')dire(cles)},1300);}
  else poser();
}
function poser(){
  // La durée se fixe AVANT l'affichage : sinon la 1re question (et chaque changement de niveau en Mélange) s'affichait sans minuteur.
  P.duree=dureeQ(eqCourante().niv);P.reste=P.duree;
  ecran='question';rendre();
  var cles=[];if(P.n===P.total&&P.total>1)cles.push('derniere');cles.push('q-'+P.q.id);if(P.q.type==='ouverte')cles.push('ouverte');
  majMinuteur();
  dire(cles,function(){demarrerMinuteur()});
}
function demarrerMinuteur(){
  if(!P||ecran!=='question'||!P.duree||P.tic)return;
  P.tic=setInterval(function(){
    P.reste--;majMinuteur();
    if(P.reste<=5&&P.reste>0)effet('tictac');
    if(P.reste<=0){stopMinuteur();effet('fin-temps');
      if(P.q.type==='ouverte'){reveler(true)}else{repondre(-1,true)}}
  },1000);
}
function stopMinuteur(){if(P&&P.tic){clearInterval(P.tic);P.tic=null}}
function majMinuteur(){
  var ch=document.getElementById('chiffre'),arc=document.getElementById('arc');if(!ch||!arc)return;
  var c=2*Math.PI*44;ch.textContent=P.reste;arc.setAttribute('stroke-dasharray',(c*(P.duree?P.reste/P.duree:0)).toFixed(1)+' '+c.toFixed(1));
  ch.parentNode.setAttribute('aria-label',P.reste+' secondes');
}
function repondre(i,temps){
  if(ecran!=='question'||P.q.type==='ouverte')return;
  stopMinuteur();P.reponse=i;P.ok=(i===P.q.bonne);
  if(P.ok)eqCourante().s+=10;
  ecran='reponse';rendre();
  var r=1+Math.floor(Math.random()*3);
  effetPuis(P.ok?'juste':'faux',function(){if(ecran==='reponse')dire([temps?'temps':(P.ok?'bravo-'+r:'encourage-'+r),'e-'+P.q.id])},1300);
}
function reveler(temps){
  if(ecran!=='question')return;
  stopMinuteur();ecran='reponse';P.ok=null;rendre();
  dire([temps?'temps':'revele','e-'+P.q.id]);
}
function juger(ok){
  if(P.juge!==null)return;
  P.juge=ok;P.ok=ok;if(ok){eqCourante().s+=10}
  rendre();var r=1+Math.floor(Math.random()*3);
  effetPuis(ok?'juste':'faux',function(){if(ecran==='reponse')dire([ok?'bravo-'+r:'encourage-'+r])},1300);
}
function suite(){
  stopVoix();
  if(P.n>=P.total){ecran='podium';rendre();effetPuis('podium',function(){dire(['podium'])},5800);return}
  P.tour=(P.tour+1)%P.eq.length;lancerTour();
}
function joker5050(){
  var eq=eqCourante();if(eq.j5050||P.q.type==='ouverte'||ecran!=='question')return;
  eq.j5050=true;var mauvaises=P.q.choix.map(function(_,i){return i}).filter(function(i){return i!==P.q.bonne});
  P.retirees=melanger(mauvaises).slice(0,P.q.choix.length>=4?2:1);
  rendre();majMinuteur();effetPuis('joker',function(){dire(['joker-5050'],function(){demarrerMinuteur()})},1300);
}
function jokerAdulte(){
  var eq=eqCourante();if(eq.jadulte||ecran!=='question')return;
  eq.jadulte=true;rendre();majMinuteur();effetPuis('joker',function(){dire(['joker-adulte'],function(){demarrerMinuteur()})},1300);
}

  var bout='<button class="cta" data-act="suite"'+(ouv&&P.juge===null?' disabled style="opacity:.5"':'')+'>'+(P.n>=P.total?'Voir le podium':(P.eq.length>1?'Équipe suivante':'Question suivante'))+'</button>';
  if(tel())return '<div class="ecran ecran-reponse">'+bandeauTour(false)+g+'<main class="corps">'+titre+bloc+explic+'</main><div class="pied-bouton">'+bout+'</div></div>';
  return '<div class="ecran ecran-reponse">'+bandeauTour(false)+g+'<main class="corps">'+titre+bloc+explic+'</main><footer class="pied">'+scores(P.tour)+bout+'</footer></div>';
};
R.podium=function(){
  var tri=P.eq.slice().sort(function(a,b){return b.s-a.s});
  function marche(e,rang){return e?'<div class="marche m'+rang+'" style="--c:'+e.c+'"><div class="qui">'+forme(e)+esc(e.n)+'<span class="pts">'+e.s+' points</span></div><div class="socle">'+rang+'</div></div>':''}
  var conf='';for(var i=0;i<34;i++){conf+='<i style="left:'+((i*37)%100)+'%;background:'+(P.eq[i%P.eq.length].c)+';animation-delay:'+(-(i*.53)%4).toFixed(2)+'s;animation-duration:'+(3.4+(i%5)*.35).toFixed(2)+'s"></i>'}
  var pod=tri.length===1?marche(tri[0],1):marche(tri[1],2)+marche(tri[0],1)+marche(tri[2],3);
  return '<div class="ecran ecran-podium"><div class="confettis" aria-hidden="true">'+conf+'</div>'
    +'<h1 class="po-titre">'+(tri.length===1?'Bravo à tous !':'Bravo à toutes les équipes !')+'</h1>'
    +guide('joie',TXT.podium)
    +'<div class="podium">'+pod+'</div>'
    +'<div class="tous"><p>Une médaille pour chaque équipe :</p>'+tri.map(function(e){return '<span class="puce">'+RUBAN+forme(e)+'<span class="n">'+esc(e.n)+'</span></span>'}).join('')
    +'<button class="secondaire" data-act="rejouer">Rejouer</button><button class="secondaire" data-act="menu">Changer les réglages</button></div></div>';
};

/* ---------- Rendu et mise à l'échelle ---------- */
function rendre(){
  scene.className=(tel()?'tel':'tv')+' niv-'+niveauScene();
  scene.innerHTML=R[ecran]();
  ajuster();
  if(parleEnCours)etatGuide(['parle']);
  var f=scene.querySelector('[autofocus]');if(f)try{f.focus({preventScroll:true})}catch(e){}
}
function ajuster(){
  var w=tel()?375:1920,h=tel()?812:1080,W=window.innerWidth,H=window.innerHeight,s=Math.min(W/w,H/h);
  scene.style.width=w+'px';scene.style.height=h+'px';
  scene.style.transform='translate('+((W-w*s)/2)+'px,'+((H-h*s)/2)+'px) scale('+s+')';
}
window.addEventListener('resize',ajuster);

/* ---------- Commandes ---------- */
function action(act,v){
  switch(act){
    case 'mode':case 'jeu':case 'duree':cfg[act]=v;break;
    case 'niveau':cfg.niveau=v;break;
    case 'nb':cfg.nb=+v;break;
    case 'eq':{var i=cfg.actives.indexOf(v);if(i>=0){if(cfg.actives.length>1)cfg.actives.splice(i,1)}else cfg.actives.push(v);
      cfg.actives=EQUIPES.map(function(e){return e.k}).filter(function(k){return cfg.actives.indexOf(k)>=0});break}
    case 'nbeq':{var n=+v;var garde=cfg.actives.slice(0,n);EQUIPES.forEach(function(e){if(garde.length<n&&garde.indexOf(e.k)<0)garde.push(e.k)});
      cfg.actives=EQUIPES.map(function(e){return e.k}).filter(function(k){return garde.indexOf(k)>=0});break}
    case 'niveq':{var o=['petits','moyens','grands'],c=cfg.nivEq[v]||'moyens';cfg.nivEq[v]=o[(o.indexOf(c)+1)%3];break}
    case 'commencer':ecrire('cfg',cfg);ctx();nouvellePartie();effetPuis('jingle',lancerTour,6000);return;
    case 'pret':poser();return;
    case 'rep':repondre(+v);return;
    case 'reveler':reveler(false);return;
    case 'juge':juger(v==='1');return;
    case 'suite':suite();return;
    case 'j5050':joker5050();return;
    case 'jadulte':jokerAdulte();return;
    case 'rejouer':stopVoix();var anc=P.eq;nouvellePartie();lancerTour();return;
    case 'menu':stopVoix();stopMinuteur();ecran='accueil';rendre();return;
  }
  ecrire('cfg',cfg);rendre();
}
scene.addEventListener('click',function(ev){
  var b=ev.target.closest('[data-act]');if(!b||b.disabled)return;
  ev.stopPropagation();action(b.dataset.act,b.dataset.v);
});
scene.addEventListener('keydown',function(ev){
  if((ev.key==='Enter'||ev.key===' ')&&ev.target.matches('.eq-champ')){ev.preventDefault();action('eq',ev.target.dataset.v)}
});
document.addEventListener('keydown',function(ev){
  if(ev.target.matches('input,textarea'))return;
  var k=ev.key.toLowerCase();
  if(ecran==='question'&&P&&P.q.type!=='ouverte'){var idx={'1':0,'2':1,'3':2,'4':3,a:0,b:1,c:2,d:3}[k];if(idx!==undefined&&idx<P.q.choix.length&&P.retirees.indexOf(idx)<0){repondre(idx);return}}
  if(ecran==='question'&&P&&P.q.type==='ouverte'&&(k==='enter'||k===' ')){ev.preventDefault();reveler(false);return}
  if(ecran==='reponse'&&P&&P.q.type==='ouverte'&&P.juge===null){if(k==='o'||k==='1'){juger(true);return}if(k==='n'||k==='0'){juger(false);return}}
  if(ecran==='reponse'&&(k==='enter'||k===' '||k==='arrowright')&&!(P.q.type==='ouverte'&&P.juge===null)){ev.preventDefault();suite();return}
  if(ecran==='tour'&&(k==='enter'||k===' ')){ev.preventDefault();poser();return}
  if(k==='r')reecouter();
  if(k==='m')basculerSon();
});
function reecouter(){if(derniereFile.length)dire(derniereFile,ecran==='question'?demarrerMinuteur:null)}
function basculerSon(){son=!son;ecrire('son',son);var b=document.getElementById('b-son');b.setAttribute('aria-pressed',String(son));b.setAttribute('aria-label',son?'Couper le son':'Remettre le son');if(!son)stopVoix()}
document.getElementById('b-reecouter').addEventListener('click',reecouter);
document.getElementById('b-son').addEventListener('click',basculerSon);
document.getElementById('b-son').setAttribute('aria-pressed',String(son));

/* Premier geste : les navigateurs exigent un clic avant de jouer un son. */
var lancer=document.getElementById('lancer');
document.getElementById('b-lancer').addEventListener('click',function(){
  lancer.hidden=true;ctx();if(AC&&AC.resume)AC.resume();
  try{speechSynthesis.getVoices()}catch(e){}
  dire(['accueil']);
});
rendre();
})();
</script>
